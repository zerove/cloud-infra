server:
  port: 9200

management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,info
  endpoint:
    health:
      enabled: false
  metrics:
    export:
      prometheus:
        enabled: true

spring:
  application:
    name: cloud-auth
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
  cloud:
    nacos:
      discovery:
        server-addr: nacos:8848
        enabled: true
      config:
        server-addr: nacos:8848
  datasource:
    type: org.postgresql.ds.PGSimpleDataSource
    url: jdbc:postgresql://postgres-server:5432/cloud_infra
    username: root
    password: root
  data:
    redis:
      host: redis-server
      port: 6379
      database: 0
