# staging 环境敏感配置 (模板，实际通过 SealedSecrets/Vault 注入)
# ⚠️ 严禁提交真实密钥！

postgres:
  host: "cloud-infra-postgresql-staging"
  port: 5432
  username: "postgres"
  password: "{{ .Values.staging.postgres.password | default \"\" }}"
  database: "cloud_infra_staging"

redis:
  host: "cloud-infra-redis-staging"
  port: 6379
  password: "{{ .Values.staging.redis.password | default \"\" }}"

rabbitmq:
  host: "cloud-infra-rabbitmq-staging"
  port: 5672
  username: "guest"
  password: "guest"

auth:
  jwt:
    secret: "{{ .Values.staging.auth.jwt.secret | default \"\" }}"
    expireTime: 86400000
    algorithm: "HS256"
    cache:
      enabled: true
      maxSize: 10000
      ttlSeconds: 300

minio:
  endpoint: "cloud-infra-minio-staging:9000"
  accessKey: "{{ .Values.staging.minio.accessKey | default \"\" }}"
  secretKey: "{{ .Values.staging.minio.secretKey | default \"\" }}"