# dev 环境 system 服务配置
# 继承自 values-common.yaml 和 values-secrets.yaml

service:
  port: 8082
  type: ClusterIP

managementService:
  port: 9301

replicaCount: 1

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 500m
    memory: 256Mi

# 服务特定配置
service:
  port: 8082

managementService:
  port: 9301
