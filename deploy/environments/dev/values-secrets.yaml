# dev 环境敏感配置 (仅示例，实际部署时通过 SealedSecret 或 Vault 注入)
#
# 重要：生产环境严禁将明文密钥提交到 Git！
# 生产环境请使用 SealedSecrets / Vault / External Secrets Operator

# 数据库
postgres:
  host: "cloud-infra-postgresql-dev"
  port: 5432
  username: "postgres"
  password: "dev-password-change-me"
  database: "cloud_infra_dev"

# Redis
redis:
  host: "cloud-infra-redis-dev"
  port: 6379
  password: "dev-redis-password"

# Redis 会话
redisSession:
  host: "cloud-infra-redis-dev"
  port: 6379

# RabbitMQ
rabbitmq:
  host: "cloud-infra-rabbitmq-dev"
  port: 5672
  username: "guest"
  password: "guest"

# JWT
jwt:
  secret: "dev-jwt-secret-change-in-production-min-32-chars"

# 内部服务间调用签名密钥 (FeignAuthInterceptor + HeaderAuthenticationFilter)
# 必须 6 个微服务使用相同值, 否则 Feign 调用验签失败
# 生产环境通过 SealedSecret 注入, 开发环境用占位符 (实际部署前替换)
internalCall:
  secret: "dev-internal-call-secret-replace-in-production"

# 固定验证码 (e2e 脚本依赖; 留空则走真实验证码)
captcha:
  fixedCode: "1234"

# MinIO
minio:
  endpoint: "cloud-infra-minio-dev:9000"
  accessKey: "cloud-infra-minio-dev"
  secretKey: "CloudInfraMinioDevSecret2024"
