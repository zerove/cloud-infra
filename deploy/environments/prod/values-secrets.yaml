# prod 环境敏感配置 (模板，实际通过 SealedSecrets/Vault 注入)
# ⚠️ 严禁提交真实密钥！
# 生产环境必须使用 SealedSecrets / Vault / External Secrets Operator

postgres:
  host: "cloud-infra-postgresql-prod"
  port: 5432
  username: "postgres"
  password: "{{ .Values.prod.postgres.password | default \"\" }}"
  database: "cloud_infra_prod"

redis:
  host: "cloud-infra-redis-prod"
  port: 6379
  password: "{{ .Values.prod.redis.password | default \"\" }}"

rabbitmq:
  host: "cloud-infra-rabbitmq-prod"
  port: 5672
  username: "{{ .Values.prod.rabbitmq.username | default \"\" }}"
  password: "{{ .Values.prod.rabbitmq.password | default \"\" }}"

auth:
  jwt:
    secret: "{{ .Values.prod.auth.jwt.secret | default \"\" }}"
    expireTime: 86400000
    algorithm: "HS256"
    cache:
      enabled: true
      maxSize: 50000
      ttlSeconds: 300

minio:
  endpoint: "cloud-infra-minio-prod:9000"
  accessKey: "{{ .Values.prod.minio.accessKey | default \"\" }}"
  secretKey: "{{ .Values.prod.minio.secretKey | default \"\" }}"