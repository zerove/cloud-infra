server:
  port: 8082
  shutdown: graceful

spring:
  rabbitmq:
    host: cloud-rabbitmq
    port: 5672
    username: guest
    password: guest
  cloud:
    stream:
      rabbit:
        binder:
          nodes: cloud-rabbitmq:5672
          username: guest
          password: guest
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:cloud-nacos:8848}
        enabled: true
      config:
        server-addr: ${NACOS_ADDR:cloud-nacos:8848}
  lifecycle:
    timeout-per-shutdown-phase: 30s
  main:
    # 关闭懒初始化: 避免 Tomcat 启动后健康检查与 Nacos 注册并发触发 fat jar 类加载风暴
    # (Spring Boot loader NestedJarFile 全局锁 + 虚拟线程 pinning 导致死锁, 见本次调试记录)
    lazy-initialization: false
    allow-bean-definition-overriding: true
  autoconfigure:
    # 排除 Seata（无 Seata Server 部署，@GlobalTransactional 注解空转）
    exclude: io.seata.spring.boot.autoconfigure.SeataAutoConfiguration
  datasource:
    url: jdbc:postgresql://${SPRING_DATASOURCE_HOST:postgres}:${SPRING_DATASOURCE_PORT:5432}/cloud_infra
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:30000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:600000}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:30000}
      validation-timeout: ${HIKARI_VALIDATION_TIMEOUT:5000}
      leak-detection-threshold: ${HIKARI_LEAK_DETECTION:60000}
      connection-test-query: ${HIKARI_TEST_QUERY:SELECT 1}
      pool-name: cloud-infra-hikari-pool
      read-only: false
      # 预编译语句缓存
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
        # PostgreSQL 批量插入优化
        reWriteBatchedInserts: true
        # 连接参数
        ApplicationName: cloud-infra-system
  threads:
    virtual:
      enabled: ${SPRING_THREADS_VIRTUAL_ENABLED:true}
  # Flyway 数据库迁移配置
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    baseline-description: "Initial schema"
    locations: classpath:db/migration
    encoding: UTF-8
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:cloud-redis}
      port: 6379
      database: 0
      # Redisson 连接池优化：减少启动期连接风暴
      redisson:
        client:
          single-server:
            connection-pool-size: 8
            connection-minimum-idle-size: 2
            idle-connection-timeout: 10000
            connect-timeout: 5000
            timeout: 5000
            retry-attempts: 3
            retry-interval: 1000
            subscriptions-per-connection: 5


management:
  server:
    port: 8082
  endpoints:
    web:
      base-path: /management
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://otel-collector:4318/v1/traces}

# Resilience4j 弹性设计配置
resilience4j:
  circuitbreaker:
    failure-rate-threshold: 50
    slow-call-rate-threshold: 100
    slow-call-duration-threshold-ms: 2000
    sliding-window-count-based: true
    sliding-window-size: 100
    minimum-number-of-calls: 10
    permitted-calls-in-half-open: 10
    wait-duration-in-open-state-ms: 30000
    record-exceptions:
      - java.io.IOException
      - java.util.concurrent.TimeoutException
      - org.springframework.web.client.ResourceAccessException
    # 下游服务熔断实例(与 cloud-infra-api Feign 注解 name 对应)
    instances:
      notificationService:
        failure-rate-threshold: 50
        sliding-window-size: 100
        minimum-number-of-calls: 10
        wait-duration-in-open-state: 30s
      fileService:
        failure-rate-threshold: 50
        sliding-window-size: 100
        minimum-number-of-calls: 10
        wait-duration-in-open-state: 30s
      searchService:
        failure-rate-threshold: 50
        sliding-window-size: 100
        minimum-number-of-calls: 10
        wait-duration-in-open-state: 30s
  ratelimiter:
    limit-refresh-period-ms: 1000
    limit-for-period: 100
    timeout-duration-ms: 500
    # 下游服务限流实例(与 cloud-infra-api Feign 注解 name 对应, 写操作防刷)
    instances:
      notificationService:
        limit-refresh-period: 1s
        limit-for-period: 100
        timeout-duration: 500ms
      fileService:
        limit-refresh-period: 1s
        limit-for-period: 100
        timeout-duration: 500ms
  retry:
    max-attempts: 3
    wait-duration-ms: 500
    exponential-backoff: true
    exponential-multiplier: 2.0
    retry-exceptions:
      - java.io.IOException
      - java.util.concurrent.TimeoutException
    # 下游服务重试实例(与 cloud-infra-api Feign 注解 name 对应)
    instances:
      notificationService:
        max-attempts: 3
        wait-duration: 500ms
      fileService:
        max-attempts: 3
        wait-duration: 500ms
      searchService:
        max-attempts: 3
        wait-duration: 500ms
    ignore-exceptions:
      - java.lang.IllegalArgumentException
      - java.lang.IllegalStateException
  bulkhead:
    max-concurrent-calls: 50
    max-wait-duration-ms: 1000

# JWT 配置（生产必须通过 AUTH_JWT_SECRET 注入外置强密钥；以下为开发默认值）
auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:sNU5JnRxwBiHxl7k5j1ZWKxhpeOKNCV4Y5wBdTeGbQMakSouGdvjDKmGWtpNXqpu}
    expire-time: ${AUTH_JWT_EXPIRE_TIME:86400000}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl