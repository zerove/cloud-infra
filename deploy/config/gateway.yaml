server:
  port: 9000
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  threads:
    virtual:
      enabled: true
  main:
    lazy-initialization: true
    allow-bean-definition-overriding: true
  datasource:
    hikari:
      connection-timeout: 30000
      validation-timeout: 5000
      initialization-fail-timeout: -1
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:cloud-nacos:8848}
        enabled: true
      config:
        server-addr: ${NACOS_ADDR:cloud-nacos:8848}
        import-check:
          enabled: false
    gateway:
      server:
        webmvc:
          # 路由由 GatewayApplication.java 函数式 DSL 定义，此处不再配置
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:cloud-redis}
      port: 6379
      database: 0
      # Redisson 连接池优化：减少启动期连接风暴
      redisson:
        client:
          single-server:
            connection-pool-size: 8
            connection-minimum-idle-size: 2
            idle-connection-timeout: 10000
            connect-timeout: 5000
            timeout: 5000
            retry-attempts: 3
            retry-interval: 1000
            subscriptions-per-connection: 5
  config:
    import:
      - optional:nacos:gateway.yaml
      - optional:nacos:actuator-config.yaml
      - optional:nacos:auth-white-list.yaml

management:
  server:
    port: 9301
  endpoints:
    web:
      base-path: /management
      exposure:
        # 与 actuator-config.yaml 保持一致：env/beans/conditions 默认不暴露
        include: health,info,prometheus,metrics,refresh
  endpoint:
    env:
      show-values: never
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      endpoint: http://otel-collector:4317

# Resilience4j 弹性设计配置
# JWT 配置（生产必须通过 AUTH_JWT_SECRET 注入外置强密钥；以下为开发默认值）
auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:}
    expire-time: ${AUTH_JWT_EXPIRE_TIME:86400000}

# 内部服务间调用签名密钥不再在此声明（issue 30 清理, 2026-10-01）:
# 该键写的是 ${INTERNAL_CALL_SECRET:} 透传, 而 InternalCallCrypto.resolveSecret()
# 第一优先级读 System.getenv("INTERNAL_CALL_SECRET"), 且全仓无任何 @Value/Environment
# 消费者读该键 —— 这段配置同步到 Nacos 后从不被读取, 只会误导运维以为改 Nacos 能生效。
# 密钥的唯一正确来源是环境变量 INTERNAL_CALL_SECRET, compose.yaml 已用 ${INTERNAL_CALL_SECRET:?} 强制拦截漏配。
