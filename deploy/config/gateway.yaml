server:
  port: 9000
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  threads:
    virtual:
      enabled: true
  main:
    lazy-initialization: true
    allow-bean-definition-overriding: true
  datasource:
    hikari:
      connection-timeout: 30000
      validation-timeout: 5000
      initialization-fail-timeout: -1
  cloud:
    nacos:
      discovery:
        server-addr: cloud-nacos:8848
        enabled: true
      config:
        server-addr: cloud-nacos:8848
        import-check:
          enabled: false
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      server:
        webmvc:
          routes:
          - id: system-module
            uri: lb://system-module
            predicates:
              - Path=/system/**
            filters:
              - stripPrefix=1
          - id: auth-service
            uri: lb://cloud-auth
            predicates:
              - Path=/auth/**
          - id: file-service
            uri: lb://file-service
            predicates:
              - Path=/file/**
            filters:
              - stripPrefix=1
          - id: notification-service
            uri: lb://notification-service
            predicates:
              - Path=/notification/**
            filters:
              - stripPrefix=1
          - id: search-service
            uri: lb://search-service
            predicates:
              - Path=/search/**
            filters:
              - stripPrefix=1
  config:
    import:
      - optional:nacos:gateway.yaml
      - optional:nacos:actuator-config.yaml
      - optional:nacos:auth-white-list.yaml