server:
  port: 9000
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  threads:
    virtual:
      enabled: true
  main:
    lazy-initialization: true
    allow-bean-definition-overriding: true
  datasource:
    hikari:
      connection-timeout: 30000
      validation-timeout: 5000
      initialization-fail-timeout: -1
  cloud:
    nacos:
      discovery:
        server-addr: cloud-nacos:8848
        enabled: true
      config:
        server-addr: cloud-nacos:8848
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      mvc:
        routes:
          - id: system-module
            uri: lb://system-module
            predicates:
              - Path=/system/**
            filters:
              - StripPrefix=1
              - RequestTimeout=10000
              - Retry=3, 1000, 2000, 4000, GET,POST,PUT,DELETE,10000
          - id: auth-service
            uri: lb://cloud-auth
            predicates:
              - Path=/auth/**
            filters:
              - StripPrefix=1
              - RequestTimeout=5000
              - Retry=3, 500, 1000, 2000, GET,POST
          - id: file-service
            uri: lb://file-service
            predicates:
              - Path=/file/**
            filters:
              - StripPrefix=1
              - RequestTimeout=30000
              - Retry=2, 2000, 4000, POST
          - id: notification-service
            uri: lb://notification-service
            predicates:
              - Path=/notification/**
            filters:
              - StripPrefix=1
              - RequestTimeout=15000
              - Retry=3, 1000, 2000, 4000, GET,POST
          - id: search-service
            uri: lb://search-service
            predicates:
              - Path=/search/**
            filters:
              - StripPrefix=1
              - RequestTimeout=10000
              - Retry=3, 1000, 2000, 4000, GET,POST
        cors:
          configurations:
            '[/**]':
              allowed-origin-patterns:
                - "http://localhost:*"
                - "http://127.0.0.1:*"
              allowed-methods:
                - GET
                - POST
                - PUT
                - DELETE
                - PATCH
                - OPTIONS
              allowed-headers: "*"
              allow-credentials: true
              max-age: 3600

# Sentinel 配置
sentinel:
  transport:
    dashboard: cloud-sentinel:8858
    port: 8719
  datasource:
    flow:
      nacos:
        server-addr: cloud-nacos:8848
        data-id: cloud-infra-gateway-sentinel-flow
        group-id: DEFAULT_GROUP
        data-type: json
        rule-type: flow
        enabled: true
    degrade:
      nacos:
        server-addr: cloud-nacos:8848
        data-id: cloud-infra-gateway-sentinel-degrade
        group-id: DEFAULT_GROUP
        data-type: json
        rule-type: degrade
        enabled: true
    param-flow:
      nacos:
        server-addr: cloud-nacos:8848
        data-id: cloud-infra-gateway-sentinel-param-flow
        group-id: DEFAULT_GROUP
        data-type: json
        rule-type: param-flow
        enabled: true
    system:
      nacos:
        server-addr: cloud-nacos:8848
        data-id: cloud-infra-gateway-sentinel-system
        group-id: DEFAULT_GROUP
        data-type: json
        rule-type: system
        enabled: true
    authority:
      nacos:
        server-addr: cloud-nacos:8848
        data-id: cloud-infra-gateway-sentinel-authority
        group-id: DEFAULT_GROUP
        data-type: json
        rule-type: authority
        enabled: true

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:sNU5JnRxwBiHxl7k5j1ZWKxhpeOKNCV4Y5wBdTeGbQMakSouGdvjDKmGWtpNXqpu}
    expire-time: ${AUTH_JWT_EXPIRE_TIME:86400000}
  white-list:
    - /auth/login
    - /auth/refresh
    - /auth/register
    - /auth/captchaImage
    - /actuator/health
    - /actuator/info
    - /actuator/prometheus
    - /v3/api-docs
    - /swagger-ui/
    - /webjars/

knife4j:
  gateway:
    enabled: true
    strategy: discover
    discover:
      enabled: true
      version: openapi3

management:
  server:
    port: 9301
  endpoints:
    web:
      base-path: /management
      exposure:
        include: prometheus,health,info
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
  metrics:
    export:
      prometheus:
        enabled: true
