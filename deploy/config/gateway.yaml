server:
  port: 9000
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  threads:
    virtual:
      enabled: true
  main:
    lazy-initialization: true
    allow-bean-definition-overriding: true
  datasource:
    hikari:
      connection-timeout: 30000
      validation-timeout: 5000
      initialization-fail-timeout: -1
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:cloud-nacos:8848}
        enabled: true
      config:
        server-addr: ${NACOS_ADDR:cloud-nacos:8848}
        import-check:
          enabled: false
    gateway:
      server:
        webmvc:
          # 路由由 GatewayApplication.java 函数式 DSL 定义，此处不再配置
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:cloud-redis}
      port: 6379
      database: 0
      # Redisson 连接池优化：减少启动期连接风暴
      redisson:
        client:
          single-server:
            connection-pool-size: 8
            connection-minimum-idle-size: 2
            idle-connection-timeout: 10000
            connect-timeout: 5000
            timeout: 5000
            retry-attempts: 3
            retry-interval: 1000
            subscriptions-per-connection: 5
  config:
    import:
      - optional:nacos:gateway.yaml
      - optional:nacos:actuator-config.yaml
      - optional:nacos:auth-white-list.yaml

management:
  server:
    port: 9301
  endpoints:
    web:
      base-path: /management
      exposure:
        # 与 actuator-config.yaml 保持一致：env/beans/conditions 默认不暴露
        include: health,info,prometheus,metrics,refresh
  endpoint:
    env:
      show-values: never
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      endpoint: http://otel-collector:4317

# Resilience4j 弹性设计配置
resilience4j:
  circuitbreaker:
    failure-rate-threshold: 50
    slow-call-rate-threshold: 80
    slow-call-duration-threshold-ms: 2000
    sliding-window-count-based: true
    sliding-window-size: 100
    minimum-number-of-calls: 10
    permitted-calls-in-half-open: 10
    wait-duration-in-open-state-ms: 30000
    record-exceptions:
      - java.io.IOException
      - java.util.concurrent.TimeoutException
      - org.springframework.web.client.ResourceAccessException
  ratelimiter:
    limit-refresh-period-ms: 1000
    limit-for-period: 100
    timeout-duration-ms: 500
  retry:
    max-attempts: 3
    wait-duration-ms: 500
    exponential-backoff: true
    exponential-multiplier: 2.0
    retry-exceptions:
      - java.io.IOException
      - java.util.concurrent.TimeoutException
    ignore-exceptions:
      - java.lang.IllegalArgumentException
      - java.lang.IllegalStateException
  bulkhead:
    max-concurrent-calls: 50
    max-wait-duration-ms: 1000

# 网关转发到后端服务的 HTTP 客户端超时
# 读超时原为硬编码 10s (GatewayClientConfig 里的字面量), 而 file/upload 的
# 20MiB 上传经网关实测耗时 2.6~5.2s, 余量仅 2~4 倍, 宿主负载高峰时被击穿,
# 表现为客户端 500 而 file-service 日志全是 200 (网关先于服务端放弃)。
# 现改为可配置; 代码默认值同样是 60s, 不依赖本配置也会生效。
# 注意: 键名必须与 GatewayHttpTimeoutProperties 的 Java Bean 名逐字对齐
# (是 read 而不是 readTimeout), 否则会静默退回默认值而不报错。
gateway:
  http-timeout:
    connect: 3s
    connection-request: 3s
    read: 60s

# JWT 配置（生产必须通过 AUTH_JWT_SECRET 注入外置强密钥；以下为开发默认值）
auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:}
    expire-time: ${AUTH_JWT_EXPIRE_TIME:86400000}

# 内部服务间调用签名密钥不再在此声明（issue 30 清理, 2026-10-01）:
# 该键写的是 ${INTERNAL_CALL_SECRET:} 透传, 而 InternalCallCrypto.resolveSecret()
# 第一优先级读 System.getenv("INTERNAL_CALL_SECRET"), 且全仓无任何 @Value/Environment
# 消费者读该键 —— 这段配置同步到 Nacos 后从不被读取, 只会误导运维以为改 Nacos 能生效。
# 密钥的唯一正确来源是环境变量 INTERNAL_CALL_SECRET, compose.yaml 已用 ${INTERNAL_CALL_SECRET:?} 强制拦截漏配。
