server:
  port: 9000
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  threads:
    virtual:
      enabled: true
  main:
    lazy-initialization: true
    allow-bean-definition-overriding: true
  datasource:
    hikari:
      connection-timeout: 30000
      validation-timeout: 5000
      initialization-fail-timeout: -1
  cloud:
    nacos:
      discovery:
        server-addr: cloud-nacos:8848
        enabled: true
      config:
        server-addr: cloud-nacos:8848
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      mvc:
        routes:
          - id: system-module
            uri: lb://system-module
            predicates:
              - Path=/system/**
            filters:
              - StripPrefix=1
          - id: auth-service
            uri: lb://cloud-auth
            predicates:
              - Path=/auth/**
            filters:
              - StripPrefix=1
          - id: file-service
            uri: lb://file-service
            predicates:
              - Path=/file/**
            filters:
              - StripPrefix=1
          - id: notification-service
            uri: lb://notification-service
            predicates:
              - Path=/notification/**
            filters:
              - StripPrefix=1
          - id: search-service
            uri: lb://search-service
            predicates:
              - Path=/search/**
            filters:
              - StripPrefix=1

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:CHANGE_ME_please_set_a_random_secret_32chars_min}
    expire-time: ${AUTH_JWT_EXPIRE_TIME:86400000}
  white-list:
    - /auth/login
    - /auth/refresh
    - /auth/register
    - /auth/captchaImage
    - /actuator/health
    - /actuator/info
    - /actuator/prometheus
    - /v3/api-docs
    - /swagger-ui/
    - /webjars/

knife4j:
  gateway:
    enabled: true
    strategy: discover
    discover:
      enabled: true
      version: openapi3

management:
  server:
    port: 9301
  endpoints:
    web:
      base-path: /management
      exposure:
        include: prometheus,health,info
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
  metrics:
    export:
      prometheus:
        enabled: true
