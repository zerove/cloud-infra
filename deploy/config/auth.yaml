server:
  port: 8081
  shutdown: graceful

management:
  server:
    port: 9301
  endpoints:
    web:
      base-path: /management
      exposure:
        include: prometheus,health,info
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://otel-collector:4318/v1/traces}


spring:
  rabbitmq:
    host: cloud-rabbitmq
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: cloud-auth
  main:
    # 关闭懒初始化: 与系统模块统一，防止 fat jar 类加载与 Nacos 注册并发风险
    lazy-initialization: false
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
  cloud:
    stream:
      rabbit:
        binder:
          nodes: cloud-rabbitmq:5672
          username: ${RABBITMQ_USER:guest}
          password: ${RABBITMQ_PASSWORD:guest}
    nacos:
      discovery:
        server-addr: cloud-nacos:8848
        enabled: true
      config:
        server-addr: cloud-nacos:8848
  datasource:
    url: jdbc:postgresql://${SPRING_DATASOURCE_HOST:cloud-postgres}:${SPRING_DATASOURCE_PORT:5432}/cloud_infra
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:30000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:600000}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:30000}
      validation-timeout: ${HIKARI_VALIDATION_TIMEOUT:5000}
      leak-detection-threshold: ${HIKARI_LEAK_DETECTION:60000}
      connection-test-query: ${HIKARI_TEST_QUERY:SELECT 1}
      pool-name: cloud-infra-auth-hikari-pool
      read-only: false
      # 预编译语句缓存
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
        # PostgreSQL 批量插入优化
        reWriteBatchedInserts: true
        # 连接参数
        ApplicationName: cloud-infra-auth
  data:
    redis:
      host: cloud-redis
      port: 6379
      database: 0

# JWT 配置（生产必须通过 AUTH_JWT_SECRET 注入外置强密钥；以下为开发默认值）
auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:}
    expire-time: ${AUTH_JWT_EXPIRE_TIME:86400000}
    algorithm: ${AUTH_JWT_ALGORITHM:HS256}
    cache:
      enabled: ${AUTH_JWT_CACHE_ENABLED:true}
      max-size: ${AUTH_JWT_CACHE_MAX_SIZE:10000}
      ttl-seconds: ${AUTH_JWT_CACHE_TTL:300}
  token:
    access-ttl-ms: ${AUTH_TOKEN_ACCESS_TTL_MS:86400000}
    refresh-ttl-ms: ${AUTH_TOKEN_REFRESH_TTL_MS:604800000}
    blacklist-ttl-ms: ${AUTH_TOKEN_BLACKLIST_TTL_MS:86400000}

# 内部服务间调用签名密钥（生产必须通过 INTERNAL_CALL_SECRET 注入外置强密钥）
cloud-infra:
  internal-call:
    secret: ${INTERNAL_CALL_SECRET:}