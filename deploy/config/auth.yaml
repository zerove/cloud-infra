server:
  port: 8081
  shutdown: graceful

management:
  server:
    port: 9301
  endpoints:
    web:
      base-path: /management
      exposure:
        include: prometheus,health,info
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      # 2026-11-05 perf audit P0: 全量采样 1.0 -> 0.2（建议值），压 CPU/吞吐
      probability: 0.2
spring:
  rabbitmq:
    host: cloud-rabbitmq
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: cloud-auth
  main:
    # 关闭懒初始化: 与系统模块统一，防止 fat jar 类加载与 Nacos 注册并发风险
    lazy-initialization: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: ${FEIGN_CONNECT_TIMEOUT_MS:10000}
            readTimeout: ${FEIGN_READ_TIMEOUT_MS:5000}
    stream:
      rabbit:
        binder:
          nodes: cloud-rabbitmq:5672
          username: ${RABBITMQ_USER:guest}
          password: ${RABBITMQ_PASSWORD:guest}
    nacos:
      discovery:
        server-addr: ${NACOS_DISCOVERY_ADDR:${NACOS_ADDR:cloud-nacos:8848}}
        enabled: true
      config:
        server-addr: ${NACOS_CONFIG_ADDR:${NACOS_ADDR:cloud-nacos:8848}}
  data:
    redis:
      host: cloud-redis
      port: 6379
      database: 0

# JWT 配置（生产必须通过 AUTH_JWT_SECRET 注入外置强密钥；以下为开发默认值）
auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:}
    expire-time: ${AUTH_JWT_EXPIRE_TIME:86400000}
    algorithm: ${AUTH_JWT_ALGORITHM:HS256}
    cache:
      enabled: ${AUTH_JWT_CACHE_ENABLED:true}
      max-size: ${AUTH_JWT_CACHE_MAX_SIZE:10000}
      ttl-seconds: ${AUTH_JWT_CACHE_TTL:300}
  token:
    access-ttl-ms: ${AUTH_TOKEN_ACCESS_TTL_MS:86400000}
    refresh-ttl-ms: ${AUTH_TOKEN_REFRESH_TTL_MS:604800000}
    blacklist-ttl-ms: ${AUTH_TOKEN_BLACKLIST_TTL_MS:86400000}
  # H5: E2E 固定验证码。仅本地/e2e 环境设置非空值；生产必须保持空串（真实验证码校验）
  captcha:
    fixed-code: ${AUTH_CAPTCHA_FIXED_CODE:}

cloud-infra:
  security:
    # 开启后 X-User-Id 仅在携带有效网关签名时被信任，防内网直连伪造身份
    verify-internal-sign: true