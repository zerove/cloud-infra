server:
  port: 9200
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,info
  endpoint:
    health:
      enabled: false
  metrics:
    export:
      prometheus:
        enabled: true

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: cloud-auth
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        enabled: true
      config:
        server-addr: 127.0.0.1:8848
  datasource:
    url: jdbc:postgresql://${SPRING_DATASOURCE_HOST:postgres-server}:${SPRING_DATASOURCE_PORT:5432}/cloud_infra
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:30000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:600000}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:30000}
      validation-timeout: ${HIKARI_VALIDATION_TIMEOUT:5000}
      leak-detection-threshold: ${HIKARI_LEAK_DETECTION:60000}
      connection-test-query: ${HIKARI_TEST_QUERY:SELECT 1}
      pool-name: cloud-infra-auth-hikari-pool
      read-only: false
      # 预编译语句缓存
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
        # PostgreSQL 批量插入优化
        reWriteBatchedInserts: true
        # 连接参数
        ApplicationName: cloud-infra-auth
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0

# JWT 配置
auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:CloudInfraSecretKey123456789012345678901234567890}
    expire-time: ${AUTH_JWT_EXPIRE_TIME:86400000}
    algorithm: ${AUTH_JWT_ALGORITHM:HS256}
    cache:
      enabled: ${AUTH_JWT_CACHE_ENABLED:true}
      max-size: ${AUTH_JWT_CACHE_MAX_SIZE:10000}
      ttl-seconds: ${AUTH_JWT_CACHE_TTL:300}