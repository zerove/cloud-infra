server:
  port: 9302

spring:
  cloud:
    nacos:
      discovery:
        server-addr: nacos-server:8848
        enabled: true
      config:
        server-addr: nacos-server:8848
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:postgresql://${SPRING_DATASOURCE_HOST:postgres}:${SPRING_DATASOURCE_PORT:5432}/cloud_infra
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:30000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:600000}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:30000}
      validation-timeout: ${HIKARI_VALIDATION_TIMEOUT:5000}
      leak-detection-threshold: ${HIKARI_LEAK_DETECTION:60000}
      connection-test-query: ${HIKARI_TEST_QUERY:SELECT 1}
      pool-name: cloud-infra-notification-hikari-pool
      read-only: false
      # 预编译语句缓存
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
        # PostgreSQL 批量插入优化
        reWriteBatchedInserts: true
        # 连接参数
        ApplicationName: cloud-infra-notification
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: 6379
      database: 0
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest

management:
  server:
    port: 9303
  endpoints:
    web:
      exposure:
        include: "*"