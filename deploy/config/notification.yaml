server:
  port: 9302

spring:
  cloud:
    nacos:
      discovery:
        server-addr: nacos-server:8848
        enabled: true
      config:
        server-addr: nacos-server:8848
  main:
    allow-bean-definition-overriding: true
  datasource:
    type: org.postgresql.ds.PGSimpleDataSource
    url: jdbc:postgresql://${SPRING_DATASOURCE_HOST:postgres}:${SPRING_DATASOURCE_PORT:5432}/cloud_infra
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: 6379
      database: 0
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest

management:
  server:
    port: 9303
  endpoints:
    web:
      exposure:
        include: "*"
