server:
  port: 8084
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: ${FEIGN_CONNECT_TIMEOUT_MS:10000}
            readTimeout: ${FEIGN_READ_TIMEOUT_MS:60000}
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:cloud-nacos:8848}
        enabled: true
      config:
        server-addr: ${NACOS_ADDR:cloud-nacos:8848}
        import-check:
          enabled: false
  main:
    # 关闭懒初始化: 与系统模块统一，防止 fat jar 类加载与 Nacos 注册并发风险
    lazy-initialization: false
    allow-bean-definition-overriding: true
  task:
    scheduling:
      # Spring Boot 默认 pool.size=1, 即全模块共用一个调度线程。
      # 通知补扫任务的扫描会 join() 等待整批 MQ 投递完成, broker 不可达时
      # 单条可阻塞到连接超时, 补扫一旦卡住会连带拖住本模块所有其他
      # @Scheduled 任务。给两个线程让它们互不阻塞。
      pool:
        size: 2
      thread-name-prefix: notif-sched-
  datasource:
    url: jdbc:postgresql://${SPRING_DATASOURCE_HOST:postgres}:${SPRING_DATASOURCE_PORT:5432}/cloud_infra
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 30000
  # 本服务的 schema.sql 此前从未被执行 —— 全仓只有 system-module 配了 Flyway,
  # 而 src/main/resources/schema.sql 里的 7 张表(含 sys_notification_schedule)
  # 无人引用。后果: @Scheduled 定时扫描每轮抛
  # `relation "sys_notification_schedule" does not exist`(实测 39 次),
  # 定时调度功能实际不可用, 但容器 healthcheck 仍报 healthy。
  #
  # 该文件全部为 `CREATE TABLE IF NOT EXISTS`, 且无 DROP/TRUNCATE/ALTER
  # (已实测 0 处), 故 mode: always 可安全重复执行, 不会破坏既有数据。
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:cloud-redis}
      port: 6379
      database: 0
  rabbitmq:
    host: cloud-rabbitmq
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        prefetch: ${RABBITMQ_PREFETCH:10}
        acknowledge-mode: auto
  config:
    import:
      - optional:nacos:actuator-config.yaml

# JWT 配置（生产必须通过 AUTH_JWT_SECRET 注入外置强密钥；以下为开发默认值）
auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:}
    expire-time: ${AUTH_JWT_EXPIRE_TIME:86400000}

# 业务可观测性配置 (透传 OTLP endpoint)
management:
  server:
    port: 9301
  endpoints:
    web:
      base-path: /management
      exposure:
        include: health,info,prometheus,metrics,env,beans,conditions,refresh
  tracing:
    sampling:
      probability: 1.0
# 平台能力配置
cloud-infra:
  tenant:
    # 多租户隔离（M6-01）。2026-10-01 开启。
    # NotificationMapper / UserNotificationPreferenceMapper 带类级 @TenantFilter，
    # 此前开关默认 false 且部署配置未开，隔离在部署态从未生效。
    # 注：NotificationDispatchMapper 刻意不加 @TenantFilter —— 分发由 MQ 消费者与
    # 定时补扫驱动，无登录主体，加了会被改写为 1=0 致分发静默失效。
    enabled: true
    # 不强制：分发补扫与 MQ 消费链路本就无登录主体。租户头存在时必须验签通过才被采信。
    require-tenant: false