server:
  port: 8085
  shutdown: graceful

spring:
  rabbitmq:
    host: cloud-rabbitmq
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        prefetch: ${RABBITMQ_PREFETCH:10}
        acknowledge-mode: auto
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: ${FEIGN_CONNECT_TIMEOUT_MS:10000}
            readTimeout: ${FEIGN_READ_TIMEOUT_MS:60000}
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:cloud-nacos:8848}
        enabled: true
      config:
        server-addr: ${NACOS_ADDR:cloud-nacos:8848}
        import-check:
          enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 30s
  main:
    # 关闭懒初始化: 与系统模块统一，防止 fat jar 类加载与 Nacos 注册并发风险
    lazy-initialization: false
    allow-bean-definition-overriding: true
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://cloud-elasticsearch:9200}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:cloud-redis}
      port: 6379
      database: 0
  threads:
    virtual:
      enabled: true
  config:
    import:
      - optional:nacos:actuator-config.yaml

# JWT 配置（生产必须通过 AUTH_JWT_SECRET 注入外置强密钥；以下为开发默认值）
auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:}
    expire-time: ${AUTH_JWT_EXPIRE_TIME:86400000}

# 跨服务 Feign host 映射 (search-service 调 notification-service)
# entrypoint.sh 启动时自动注入实际 IP 到 SERVICE_HOST_MAP, 实际值由运行时决定
# SERVICE_HOST_MAP: notification-service:127.0.0.1

management:
  server:
    port: 9301
  endpoints:
    web:
      base-path: /management
      exposure:
        include: health,info,prometheus,metrics,env,beans,conditions,refresh
  tracing:
    sampling:
      probability: 1.0