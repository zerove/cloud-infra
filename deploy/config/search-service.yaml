server:
  port: 8085
  shutdown: graceful

spring:
  rabbitmq:
    host: cloud-rabbitmq
    port: 5672
    username: guest
    password: guest
  cloud:
    stream:
      rabbit:
        binder:
          nodes: cloud-rabbitmq:5672
          username: guest
          password: guest
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:cloud-nacos:8848}
        enabled: true
      config:
        server-addr: ${NACOS_ADDR:cloud-nacos:8848}
  lifecycle:
    timeout-per-shutdown-phase: 30s
  main:
    allow-bean-definition-overriding: true
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://cloud-elasticsearch:9200}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:cloud-redis}
      port: 6379
      database: 0
  threads:
    virtual:
      enabled: true

# JWT 配置（生产必须通过 AUTH_JWT_SECRET 注入外置强密钥；以下为开发默认值）
auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:***REMOVED-LEAKED-DEV-JWT-SECRET***}
    expire-time: ${AUTH_JWT_EXPIRE_TIME:86400000}

management:
  server:
    port: 9301
  endpoints:
    web:
      base-path: /management
      exposure:
        include: "*"
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://otel-collector:4318/v1/traces}

