server:
  port: 9306
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: cloud-file
  cloud:
    nacos:
      discovery:
        server-addr: nacos-server:8848
        enabled: true
      config:
        server-addr: nacos-server:8848
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${SPRING_DATASOURCE_HOST:postgres}:${SPRING_DATASOURCE_PORT:5432}/cloud_infra
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: 6379
      database: 0
  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 1024MB

file:
  storage:
    type: auto
  upload:
    dir: /data/uploads

management:
  server:
    port: 9307
  endpoints:
    web:
      exposure:
        include: "*"
