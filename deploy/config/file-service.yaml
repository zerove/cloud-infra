server:
  port: 8083
  shutdown: graceful

spring:
  rabbitmq:
    host: cloud-rabbitmq
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  cloud:
    stream:
      rabbit:
        binder:
          nodes: cloud-rabbitmq:5672
          username: ${RABBITMQ_USER:guest}
          password: ${RABBITMQ_PASSWORD:guest}
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:cloud-nacos:8848}
        enabled: true
      config:
        server-addr: ${NACOS_ADDR:cloud-nacos:8848}
        import-check:
          enabled: false
  application:
    name: file-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  main:
    # 关闭懒初始化: 与系统模块统一，防止 fat jar 类加载与 Nacos 注册并发风险
    lazy-initialization: false
    allow-bean-definition-overriding: true
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${SPRING_DATASOURCE_HOST:postgres}:${SPRING_DATASOURCE_PORT:5432}/cloud_infra
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:30000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:600000}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:30000}
      validation-timeout: ${HIKARI_VALIDATION_TIMEOUT:5000}
      leak-detection-threshold: ${HIKARI_LEAK_DETECTION:60000}
      connection-test-query: ${HIKARI_TEST_QUERY:SELECT 1}
      pool-name: cloud-infra-file-hikari-pool
      read-only: false
      # 预编译语句缓存
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
        # PostgreSQL 批量插入优化
        reWriteBatchedInserts: true
        # 连接参数
        ApplicationName: cloud-infra-file
  # 本服务的 schema.sql 此前从未被执行 —— 4 张表(file_metadata / file_permission /
  # file_version / sys_storage_quota)各有对应的 @TableName Mapper 真实引用,
  # 但运行时 4 张表全部缺失(已实测), 任何文件元数据操作都会失败。
  #
  # 该文件全部为 `CREATE TABLE IF NOT EXISTS`, 且无 DROP/TRUNCATE/ALTER(实测 0 处),
  # 故 mode: always 可安全重复执行, 不会破坏既有数据。
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:cloud-redis}
      port: 6379
      database: 0
  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 1024MB
  config:
    import:
      - optional:nacos:actuator-config.yaml

# JWT 配置（生产必须通过 AUTH_JWT_SECRET 注入外置强密钥；以下为开发默认值）
auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:}
    expire-time: ${AUTH_JWT_EXPIRE_TIME:86400000}

file:
  storage:
    type: auto
    local:
      # ⚠️ 键名必须与 LocalStorageStrategy 的 @Value 逐字一致 (2026-10-06 实测缺陷)。
      #   代码读的是 `${file.storage.local.path:...}`, 而此前配置写的是
      #   `upload.dir` —— 那个键**没有任何代码读取**, 于是服务一直静默使用
      #   代码默认值 /tmp/cloud-infra/uploads。
      #   证据: 运行时 /data 在容器内不存在, 而 /tmp/cloud-infra/uploads 存在。
      #   教训: 配了 ≠ 生效(第三条硬规则), 配置键必须与读取处逐字对齐。
      path: /data/uploads
    minio:
      endpoint: ${MINIO_ENDPOINT:http://cloud-minio:9000}
      access-key: ${MINIO_ACCESS_KEY:minio-dev-user}
      secret-key: ${MINIO_SECRET_KEY:minio-dev-secret-12345678}
      # 桶名必须与 FileController 签名直传硬编码的 "cloud-infra-files" 一致。
      # 2026-10-06 实测: 不一致时常规上传报 NoSuchBucket; 小文件走本地故不受影响,
      # 于是缺陷长期只在大文件路径上暴露。
      bucket: ${MINIO_BUCKET:cloud-infra-files}

management:
  server:
    port: 9301
  endpoints:
    web:
      base-path: /management
      exposure:
        include: health,info,prometheus,metrics,env,beans,conditions,refresh
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://otel-collector:4318/v1/traces}

# 平台能力配置
cloud-infra:
  tenant:
    # 多租户隔离（M6-01）。2026-10-01 开启。
    # FileMetadataMapper 带类级 @TenantFilter，file_metadata 表有 tenant_id 列，
    # 此前开关默认 false 且部署配置未开，隔离在部署态从未生效。
    # 租户身份由网关按 JWT 中的 tenantId claim 注入，不接受客户端自选。
    enabled: true
    # 不强制：MQ 消费与内部调用无登录主体。租户头存在时必须通过内部签名验签才被采信。
    require-tenant: false