server:
  port: 9400

spring:
  application:
    name: cloud-notification
  cloud:
    nacos:
      discovery:
        server-addr: nacos:8848
      config:
        server-addr: nacos:8848
        file-extension: yaml
    stream:
      bindings:
        notificationConsumer-in-0:
          destination: notification-exchange
          group: notification-group
      rabbit:
        bindings:
          notificationConsumer-in-0:
            consumer:
              exchangeType: direct
  config:
    import: "optional:nacos:notification.yaml"
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:rabbitmq-server}
    port: 5672
    username: guest
    password: guest
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis-server}
      port: 6379
  threads:
    virtual:
      enabled: ${SPRING_THREADS_VIRTUAL_ENABLED:true}
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:postgresql://${SPRING_DATASOURCE_HOST:postgres-server}:${SPRING_DATASOURCE_PORT:5432}/cloud_infra
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: org.postgresql.Driver

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always
