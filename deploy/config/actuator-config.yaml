# 共享 Actuator 管理端点配置（所有微服务通过 Nacos shared-configs 加载）
# 修改后需重新执行 ./deploy/up.sh 同步至 Nacos
management:
  endpoints:
    web:
      base-path: /management
      exposure:
        include: health,info,prometheus,metrics,env,beans,conditions,refresh
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name:unknown}
  info:
    env:
      enabled: true

# 禁用业务端口的 actuator 端点，仅在管理端口暴露（避免 Spring Boot 3 独立管理端口死锁）
# 参考: https://github.com/spring-projects/spring-boot/issues/39277
server:
  servlet:
    context-path: /
