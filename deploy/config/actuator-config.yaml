# 共享 Actuator 管理端点配置（所有微服务通过 Nacos shared-configs 加载）
# 修改后需重新执行 ./deploy/up.sh 同步至 Nacos
management:
  endpoints:
    web:
      base-path: /management
      exposure:
        # 收敛暴露面：env/beans/conditions 仅运维排查时临时开启，
        # 常规只保留健康、指标类端点（refresh 供 Nacos 配置刷新）
        include: health,info,prometheus,metrics,refresh
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    env:
      # 环境变量端点强制脱敏：所有属性值以******掩码返回，防凭据泄露
      show-values: never
  metrics:
    tags:
      application: ${spring.application.name:unknown}
  info:
    env:
      enabled: true
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING_PROBABILITY:1.0}

# ⚠️ 勿在此处加 `feign.client.config.*`：该 legacy 前缀在 Spring Cloud 2025.x
# (openfeign 5.0.1) 已不被任何类读取 —— FeignClientProperties 前缀只有
# `spring.cloud.openfeign.client`。真实超时配置在各服务的该前缀下（2026-10-13 补齐）。

# 禁用业务端口的 actuator 端点，仅在管理端口暴露（避免 Spring Boot 3 独立管理端口死锁）
# 参考: https://github.com/spring-projects/spring-boot/issues/39277
server:
  servlet:
    context-path: /
