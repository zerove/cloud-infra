server:
  port: 9500

spring:
  application:
    name: cloud-search
  cloud:
    nacos:
      discovery:
        server-addr: nacos:8848
        register-enabled: true
      config:
        server-addr: nacos:8848
        file-extension: yaml
  config:
    import: "optional:nacos:search-application.yaml"
    autoconfigure:
      exclude: org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  elasticsearch:
    uris: http://elasticsearch:9200
  data:
    elasticsearch:
      repositories:
        enabled: true
  threads:
    virtual:
      enabled: ${SPRING_THREADS_VIRTUAL_ENABLED:true}

management:
  health:
    elasticsearch:
      enabled: false
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
