# SkyWalking 9.6.0 OAP 配置 - 使用 application.yml 挂载 (env var SW_* 已弃用)
# 详见 https://skywalking.apache.org/docs/main/next/backend/setup/configuration/

cluster:
  selector: ${SW_CLUSTER:standalone}
  standalone:
    # 单节点 OAP 模式 (生产应 cluster:selector=standalone + 内部 ES 集群)
    namespace: ${SW_NAMESPACE:cloud-infra}
  # 集群模式 (k8s 多副本):
  # selector: ${SW_CLUSTER:kubernetes}
  # kubernetes:
  #   watchTimeout: 60

core:
  selector: ${SW_CORE:default}
  default:
    # 角色分组 (单节点所有模块)
    role: ${SW_CORE_ROLE:Mixed}
    # 数据保留 (与 env var 一致)
    recordDataTTL: ${SW_CORE_RECORD_DATA_TTL:3}
    metricsDataTTL: ${SW_CORE_METRICS_DATA_TTL:7}
    # 日志采样
    searchableTraces: ${SW_SEARCHABLE_TRACES:on}
    searchableLogs: ${SW_SEARCHABLE_LOGS:off}
    searchableMetrics: ${SW_SEARCHABLE_METRICS:on}

storage:
  selector: ${SW_STORAGE:elasticsearch}
  elasticsearch:
    namespace: ${SW_NAMESPACE:cloud-infra}
    clusterNodes: ${SW_STORAGE_ES_CLUSTER_NODES:cloud-elasticsearch:9200}
    # ES 7.x 必须用 elasticsearch7 selector
    # ES 8.x 用 elasticsearch8
    protocol: ${SW_STORAGE_ES_HTTP_PROTOCOL:http}
    # 信任自签证书
    trustStorePath: ${SW_STORAGE_ES_SSL_JKS_PATH:}
    trustStorePass: ${SW_STORAGE_ES_SSL_JKS_PASS:}
    user: ${SW_STORAGE_ES_USER:}
    password: ${SW_STORAGE_ES_PASSWORD:}
    secretsManagementFile: ${SW_STORAGE_ES_SECRETS_MANAGEMENT_FILE:}
    dayStep: ${SW_STORAGE_DAY_STEP:1}
    indexShardsNumber: ${SW_STORAGE_ES_INDEX_SHARDS_NUMBER:2}
    indexReplicasNumber: ${SW_STORAGE_ES_INDEX_REPLICAS_NUMBER:0}
    # 关键: 显式声明 jdk-http-client, 避免 Netty HTTP client 冲突
    httpClient: ${SW_STORAGE_ES_HTTP_CLIENT:jdk}
    # ES 7.x 模板
    dayStepHandler: ${SW_STORAGE_DAY_STEP_HANDLER:default}
    indexProvider: ${SW_STORAGE_ES_INDEX_PROVIDER:default}

# 接收 agent 上报 (gRPC port 11800)
agent-analyzer:
  selector: ${SW_AGENT_ANALYZER:default}
  default:
    # Agent 上报采样率 (1.0 = 100%)
    sampleRate: ${SW_AGENT_SAMPLE:10000}

# 接收追踪 (tracing)
receiver-trace:
  selector: ${SW_RECEIVER_TRACE:default}
  default:
    # 追踪数据源
    sampleRate: ${SW_TRACE_SAMPLE:10000}

# UI 入口 (供 skywalking-ui 调)
ui-query:
  selector: ${SW_QUERY:graphql}
  graphql:
    # 路径
    path: /graphql
    # 启用浏览器访问 (UI 通过此查询)
    enableUpdateUITemplate: true

# 报警
alarm-settings:
  selector: ${SW_ALARM:default}
  default:
    # 默认阈值规则
    rules:
      - name: service_resp_time
        expression: "service_resp_time_percentile_75 > 1000"
        period: 10
        tags:
          level: WARNING
        message: "Service P75 response time > 1s"

# 查询
query:
  selector: ${SW_QUERY:default}
  default:
    maxQuerySize: 10000
