# Default values for cloud-infra-auth
replicaCount: 2

image:
  repository: cloud-infra-auth
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8081"
  prometheus.io/path: "/actuator/prometheus"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 8081
  targetPort: 8081

managementService:
  enabled: true
  port: 9301
  targetPort: 9301

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - cloud-infra-auth
          topologyKey: kubernetes.io/hostname

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "k8s"
  - name: NACOS_ADDR
    valueFrom:
      configMapKeyRef:
        name: cloud-infra-config
        key: nacos.addr
  - name: NACOS_CONFIG_ADDR
    valueFrom:
      configMapKeyRef:
        name: cloud-infra-config
        key: nacos.config.addr
  - name: NACOS_DISCOVERY_ADDR
    valueFrom:
      configMapKeyRef:
        name: cloud-infra-config
        key: nacos.discovery.addr
  - name: SPRING_DATASOURCE_HOST
    valueFrom:
      secretKeyRef:
        name: cloud-infra-secrets
        key: postgres.host
  - name: SPRING_DATASOURCE_USERNAME
    valueFrom:
      secretKeyRef:
        name: cloud-infra-secrets
        key: postgres.username
  - name: SPRING_DATASOURCE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: cloud-infra-secrets
        key: postgres.password
  - name: AUTH_JWT_SECRET
    valueFrom:
      secretKeyRef:
        name: cloud-infra-secrets
        key: jwt.secret
  - name: AUTH_JWT_EXPIRE_TIME
    value: "86400000"
  - name: AUTH_JWT_ALGORITHM
    value: "HS256"
  - name: AUTH_JWT_CACHE_ENABLED
    value: "true"
  - name: AUTH_JWT_CACHE_MAX_SIZE
    value: "10000"
  - name: AUTH_JWT_CACHE_TTL
    value: "300"

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 9301
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 9301
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /actuator/health/startup
    port: 9301
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

configMap:
  enabled: true
  data:
    application.yml: |
      spring:
        application:
          name: cloud-auth
        config:
          import: "optional:nacos:auth.yaml"
        cloud:
          nacos:
            config:
              server-addr: ${NACOS_CONFIG_ADDR}
              file-extension: yaml
              shared-configs:
                - data-id: actuator-config.yaml
                  refresh: true
              import-check:
                enabled: false
            discovery:
              server-addr: ${NACOS_DISCOVERY_ADDR}
        # JWT 配置
        auth:
          jwt:
            secret: ${AUTH_JWT_SECRET}
            expire-time: ${AUTH_JWT_EXPIRE_TIME}
            algorithm: ${AUTH_JWT_ALGORITHM}
            cache:
              enabled: ${AUTH_JWT_CACHE_ENABLED}
              max-size: ${AUTH_JWT_CACHE_MAX_SIZE}
              ttl-seconds: ${AUTH_JWT_CACHE_TTL}
      management:
        server:
          port: 9301
        endpoints:
          web:
            base-path: /management
            exposure:
              include: "*"
        tracing:
          sampling:
            probability: 1.0
        otlp:
          tracing:
            endpoint: http://otel-collector:4317
        tracing:
          enabled: true
          sampling:
            probability: 1.0
          zipkin:
            enabled: true
            endpoint: http://zipkin:9411/api/v2/spans
            sender:
              type: web
          otel:
            exporter:
              zipkin:
                endpoint: http://zipkin:9411/api/v2/spans
              otlp:
                endpoint: http://otel-collector:4317

secret:
  enabled: true
  data:
    postgres.host: ""
    postgres.username: ""
    postgres.password: ""
    jwt.secret: ""

serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
networkPolicy:
  allowExternal: false
