# Default values for cloud-infra-auth
replicaCount: 2

image:
  repository: cloud-infra-auth
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  # 管理端口 9301 + base-path=/management —— 原写 8081 + /actuator/prometheus,
  # 两个值都错(业务端口 & 已被 base-path 取代的路径), 注解抓取恒 404。
  prometheus.io/port: "9301"
  prometheus.io/path: "/management/prometheus"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 8081
  targetPort: 8081

managementService:
  enabled: true
  port: 9301
  targetPort: 9301

resources:
  limits:
    cpu: 1000m
    # 与 compose mem_limit(1g) 对齐 —— 512Mi 装不下
    # 堆 256m + 堆外上限 448m, 属会被 cgroup OOM-kill 的组合
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - cloud-infra-auth
          topologyKey: kubernetes.io/hostname

env:
  - name: INTERNAL_CALL_SECRET
    valueFrom:
      secretKeyRef:
        name: cloud-infra-secrets
        key: internalCall.secret
  - name: NACOS_ADDR
    valueFrom:
      configMapKeyRef:
        name: cloud-infra-config
        key: nacos.addr
  - name: NACOS_CONFIG_ADDR
    valueFrom:
      configMapKeyRef:
        name: cloud-infra-config
        key: nacos.config.addr
  - name: NACOS_DISCOVERY_ADDR
    valueFrom:
      configMapKeyRef:
        name: cloud-infra-config
        key: nacos.discovery.addr
  - name: SPRING_DATASOURCE_HOST
    valueFrom:
      secretKeyRef:
        name: cloud-infra-secrets
        key: postgres.host
  - name: SPRING_DATASOURCE_USERNAME
    valueFrom:
      secretKeyRef:
        name: cloud-infra-secrets
        key: postgres.username
  - name: SPRING_DATASOURCE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: cloud-infra-secrets
        key: postgres.password
  - name: AUTH_JWT_SECRET
    valueFrom:
      secretKeyRef:
        name: cloud-infra-secrets
        key: jwt.secret
  - name: AUTH_JWT_EXPIRE_TIME
    value: "86400000"
  - name: AUTH_JWT_ALGORITHM
    value: "HS256"
  - name: AUTH_JWT_CACHE_ENABLED
    value: "true"
  - name: AUTH_JWT_CACHE_MAX_SIZE
    value: "10000"
  - name: AUTH_JWT_CACHE_TTL
    value: "300"
  - name: JAVA_OPTS
    # native 内存四项上限与 compose 逐字一致 —— 缺失时 JVM 默认预留约 2.15GB,
    # 由 deploy/tests/check_jvm_native_memory_bounds.py 与 test_k8s_values_alignment.py 守护
    value: "-XX:+UseG1GC -Xmx256m -Xms128m -XX:+UseCompactObjectHeaders -XX:+ExitOnOutOfMemoryError -XX:+UseContainerSupport -XX:MaxMetaspaceSize=256m -XX:CompressedClassSpaceSize=64m -XX:ReservedCodeCacheSize=64m -XX:MaxDirectMemorySize=64m"

livenessProbe:
  httpGet:
    path: /management/health/liveness
    port: 9301
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /management/health/readiness
    port: 9301
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /management/health/readiness
    port: 9301
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

configMap:
  enabled: true
  data:
    application.yml: |
      spring:
        application:
          name: cloud-auth
        config:
          import: "optional:nacos:auth.yaml"
        cloud:
          nacos:
            config:
              server-addr: ${NACOS_CONFIG_ADDR}
              file-extension: yaml
              shared-configs:
                - data-id: actuator-config.yaml
                  refresh: true
              import-check:
                enabled: false
            discovery:
              server-addr: ${NACOS_DISCOVERY_ADDR}
        # JWT 配置
        auth:
          jwt:
            secret: ${AUTH_JWT_SECRET}
            expire-time: ${AUTH_JWT_EXPIRE_TIME}
            algorithm: ${AUTH_JWT_ALGORITHM}
            cache:
              enabled: ${AUTH_JWT_CACHE_ENABLED}
              max-size: ${AUTH_JWT_CACHE_MAX_SIZE}
              ttl-seconds: ${AUTH_JWT_CACHE_TTL}
      management:
        server:
          port: 9301
        endpoints:
          web:
            base-path: /management
            exposure:
              # 与 Nacos 真源(deploy/config/actuator-config.yaml)一致: env/beans/conditions 不暴露
              include: health,info,prometheus,metrics,refresh
        # ⚠️ 此处原有一处被遮蔽的 `tracing:` 重复键(仅含 sampling.probability),
        # 后面的 tracing 块会静默覆盖它, 使前者的配置从未生效。
        # 已删除 —— 行为完全等价(后一个块同样设了 sampling.probability),
        # 目的只是消除"看起来生效其实被丢弃"的陷阱(2026-10-13 审计)。
        otlp:
          tracing:
            endpoint: http://otel-collector:4317
        tracing:
          enabled: true
          sampling:
            probability: 0.2
          zipkin:
            enabled: true
            endpoint: http://zipkin:9411/api/v2/spans
            sender:
              type: web
          otel:
            exporter:
              zipkin:
                endpoint: http://zipkin:9411/api/v2/spans
              otlp:
                endpoint: http://otel-collector:4317

secret:
  enabled: true
  data:
    postgres.host: ""
    postgres.username: ""
    postgres.password: ""
    jwt.secret: ""

serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
networkPolicy:
  allowExternal: false
pdb:
  enabled: true
  minAvailable: 1
