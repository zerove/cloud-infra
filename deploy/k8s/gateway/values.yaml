# Default values for cloud-infra-gateway
replicaCount: 2

image:
  repository: cloud-infra-gateway
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  # 管理端口 9301 + base-path=/management —— 原写 9000 + /actuator/prometheus,
  # 两个值都错(业务端口 & 已被 base-path 取代的路径), 注解抓取恒 404。
  prometheus.io/port: "9301"
  prometheus.io/path: "/management/prometheus"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 9000
  targetPort: 9000

managementService:
  enabled: true
  port: 9301
  targetPort: 9301

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    - host: gateway.cloud-infra.io
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: cloud-infra-gateway-tls
      hosts:
        - gateway.cloud-infra.io

resources:
  limits:
    cpu: 1000m
    # 与 compose mem_limit(640m) 对齐 —— 512Mi 装不下
    # 堆 256m + 堆外上限 448m, 属会被 cgroup OOM-kill 的组合
    memory: 640Mi
  requests:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - cloud-infra-gateway
          topologyKey: kubernetes.io/hostname

env:
  - name: INTERNAL_CALL_SECRET
    valueFrom:
      secretKeyRef:
        name: cloud-infra-secrets
        key: internalCall.secret
  - name: NACOS_ADDR
    valueFrom:
      configMapKeyRef:
        name: cloud-infra-config
        key: nacos.addr
  - name: NACOS_CONFIG_ADDR
    valueFrom:
      configMapKeyRef:
        name: cloud-infra-config
        key: nacos.config.addr
  - name: NACOS_DISCOVERY_ADDR
    valueFrom:
      configMapKeyRef:
        name: cloud-infra-config
        key: nacos.discovery.addr
  - name: SPRING_DATASOURCE_HOST
    valueFrom:
      secretKeyRef:
        name: cloud-infra-secrets
        key: postgres.host
  - name: SPRING_DATASOURCE_USERNAME
    valueFrom:
      secretKeyRef:
        name: cloud-infra-secrets
        key: postgres.username
  - name: SPRING_DATASOURCE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: cloud-infra-secrets
        key: postgres.password
  - name: AUTH_JWT_SECRET
    valueFrom:
      secretKeyRef:
        name: cloud-infra-secrets
        key: jwt.secret
  - name: AUTH_JWT_EXPIRE_TIME
    value: "86400000"
  - name: AUTH_JWT_ALGORITHM
    value: "HS256"
  - name: AUTH_JWT_CACHE_ENABLED
    value: "true"
  - name: AUTH_JWT_CACHE_MAX_SIZE
    value: "10000"
  - name: AUTH_JWT_CACHE_TTL
    value: "300"
  - name: JAVA_OPTS
    # native 内存四项上限与 compose 逐字一致 —— 缺失时 JVM 默认预留约 2.15GB,
    # 由 deploy/tests/check_jvm_native_memory_bounds.py 与 test_k8s_values_alignment.py 守护
    value: "-XX:+UseG1GC -Xmx256m -Xms128m -XX:+UseCompactObjectHeaders -XX:+ExitOnOutOfMemoryError -XX:+UseContainerSupport -XX:MaxMetaspaceSize=256m -XX:CompressedClassSpaceSize=64m -XX:ReservedCodeCacheSize=64m -XX:MaxDirectMemorySize=64m"

livenessProbe:
  httpGet:
    path: /management/health/liveness
    port: 9301
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /management/health/readiness
    port: 9301
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /management/health/readiness
    port: 9301
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

configMap:
  enabled: true
  data:
    application.yml: |
      spring:
        cloud:
          nacos:
            config:
              server-addr: ${NACOS_CONFIG_ADDR}
              file-extension: yaml
              shared-configs:
                - data-id: actuator-config.yaml
                  refresh: true
              import-check:
                enabled: false
            discovery:
              server-addr: ${NACOS_DISCOVERY_ADDR}
        config:
          import: optional:nacos:gateway.yaml
      autoconfigure:
        exclude:
          - org.springframework.boot.tomcat.autoconfigure.metrics.TomcatMetricsAutoConfiguration
      threads:
        virtual:
          enabled: true
      management:
        server:
          port: 9301
        endpoints:
          web:
            base-path: /management
            exposure:
              # 与 Nacos 真源(deploy/config/actuator-config.yaml)一致: env/beans/conditions 不暴露
              include: health,info,prometheus,metrics,refresh
        tracing:
          sampling:
            probability: 0.2
        otlp:
          tracing:
            endpoint: http://otel-collector:4317

secret:
  enabled: true
  data:
    postgres.host: ""
    postgres.username: ""
    postgres.password: ""
    jwt.secret: ""

serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
networkPolicy:
  allowExternal: false
pdb:
  enabled: true
  minAvailable: 1
