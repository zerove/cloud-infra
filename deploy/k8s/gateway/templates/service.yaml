apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloud-infra-gateway.fullname" . }}
  labels:
    {{- include "cloud-infra-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "cloud-infra-gateway.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloud-infra-gateway.fullname" . }}-management
  labels:
    {{- include "cloud-infra-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: management
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.managementService.port }}
      targetPort: {{ .Values.managementService.targetPort }}
      protocol: TCP
      name: management
  selector:
    {{- include "cloud-infra-gateway.selectorLabels" . | nindent 4 }}