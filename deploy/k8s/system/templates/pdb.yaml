{{- if .Values.pdb.enabled -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "cloud-infra-system.fullname" . }}
  labels:
    {{- include "cloud-infra-system.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "cloud-infra-system.selectorLabels" . | nindent 6 }}
{{- end }}