replicaCount: 2
image:
  repository: cloud-infra-system
  pullPolicy: IfNotPresent
  tag: latest
imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''
serviceAccount:
  create: true
  annotations: {}
  name: ''
podAnnotations:
  prometheus.io/scrape: 'true'
  prometheus.io/port: '9301'
  prometheus.io/path: /management/prometheus
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
service:
  type: ClusterIP
  port: 8082
  targetPort: 8082
managementService:
  enabled: true
  port: 9301
  targetPort: 9301
resources:
  limits:
    cpu: 1000m
    memory: 640Mi
  requests:
    cpu: 500m
    memory: 256Mi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
nodeSelector: {}
tolerations: []
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - cloud-infra-system
        topologyKey: kubernetes.io/hostname
env:
- name: AUTH_JWT_SECRET
  valueFrom:
    secretKeyRef:
      name: cloud-infra-secrets
      key: jwt.secret
- name: INTERNAL_CALL_SECRET
  valueFrom:
    secretKeyRef:
      name: cloud-infra-secrets
      key: internalCall.secret
- name: SPRING_PROFILES_ACTIVE
  value: k8s
- name: NACOS_ADDR
  valueFrom:
    configMapKeyRef:
      name: cloud-infra-config
      key: nacos.addr
- name: NACOS_CONFIG_ADDR
  valueFrom:
    configMapKeyRef:
      name: cloud-infra-config
      key: nacos.config.addr
- name: NACOS_DISCOVERY_ADDR
  valueFrom:
    configMapKeyRef:
      name: cloud-infra-config
      key: nacos.discovery.addr
- name: SPRING_DATASOURCE_HOST
  valueFrom:
    secretKeyRef:
      name: cloud-infra-secrets
      key: postgres.host
- name: SPRING_DATASOURCE_USERNAME
  valueFrom:
    secretKeyRef:
      name: cloud-infra-secrets
      key: postgres.username
- name: SPRING_DATASOURCE_PASSWORD
  valueFrom:
    secretKeyRef:
      name: cloud-infra-secrets
      key: postgres.password
- name: HIKARI_MAX_POOL_SIZE
  value: '20'
- name: HIKARI_MIN_IDLE
  value: '5'
- name: HIKARI_IDLE_TIMEOUT
  value: '30000'
- name: HIKARI_MAX_LIFETIME
  value: '600000'
- name: HIKARI_CONNECTION_TIMEOUT
  value: '30000'
- name: HIKARI_VALIDATION_TIMEOUT
  value: '5000'
- name: HIKARI_LEAK_DETECTION
  value: '60000'
- name: HIKARI_TEST_QUERY
  value: SELECT 1
- name: JAVA_OPTS
  value: "-XX:+UseG1GC -Xmx384m -Xms128m -XX:+UseCompactObjectHeaders -XX:+ExitOnOutOfMemoryError -XX:+UseContainerSupport"
livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 9301
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 9301
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
startupProbe:
  httpGet:
    path: /actuator/health/startup
    port: 9301
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30
configMap:
  enabled: true
  data:
    application.yml: "spring:\n  main:\n    allow-bean-definition-overriding: true\n\
      \  cloud:\n    nacos:\n      discovery:\n        server-addr: ${NACOS_DISCOVERY_ADDR}\n\
      \        enabled: true\n      config:\n        server-addr: ${NACOS_CONFIG_ADDR}\n\
      \      stream:\n        bindings:\n          txMessageOut-out-0:\n         \
      \   destination: sys.tx.message.retry\n            group: cloud-system-group\n\
      \          txMessageConsumer-in-0:\n            destination: sys.tx.message.retry\n\
      \            group: cloud-system-group\n          txMessageDlqConsumer-in-0:\n\
      \            destination: sys.tx.message.dlq\n            group: cloud-system-group\n\
      \        rabbit:\n          bindings:\n            txMessageConsumer-in-0:\n\
      \              consumer:\n                auto-bind-dlq: true\n            \
      \    dlq-name: sys.tx.message.dlq\n                republish-to-dlq: true\n\
      \  seata:\n    enabled: false\n\
      \    tx-service-group: ${spring.application.name}-tx-group\n    service:\n \
      \     vgroup-mapping:\n        cloud-infra-system: default\n    registry:\n\
      \      type: nacos\n      nacos:\n        server-addr: ${NACOS_DISCOVERY_ADDR}\n\
      \        namespace: ${spring.cloud.nacos.discovery.namespace}\n    config:\n\
      \      type: nacos\n      nacos:\n        server-addr: ${NACOS_CONFIG_ADDR}\n\
      \        namespace: ${spring.cloud.nacos.config.namespace}\n    client:\n  \
      \    rm:\n        async-commit-buffer-limit: 1000\n        report-success-enable:\
      \ true\n        lock:\n          retry-interval: 10\n          retry-times:\
      \ 30\n        report-retry-count: 5\n      tm:\n        commit-retry-count:\
      \ 5\n        rollback-retry-count: 5\n        default-global-transaction-timeout:\
      \ 60000\n  threads:\n    virtual:\n      enabled: true\n  data:\n    redis:\n\
      \      host: ${SPRING_DATA_REDIS_HOST}\n      port: 6379\n      database: 0\n\
      \  datasource:\n    driver-class-name: org.postgresql.Driver\n    url: jdbc:postgresql://${SPRING_DATASOURCE_HOST}:5432/cloud_infra\n\
      \    username: ${SPRING_DATASOURCE_USERNAME}\n    password: ${SPRING_DATASOURCE_PASSWORD}\n\
      \    hikari:\n      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE}\n      minimum-idle:\
      \ ${HIKARI_MIN_IDLE}\n      idle-timeout: ${HIKARI_IDLE_TIMEOUT}\n      max-lifetime:\
      \ ${HIKARI_MAX_LIFETIME}\n      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT}\n\
      \      validation-timeout: ${HIKARI_VALIDATION_TIMEOUT}\n      leak-detection-threshold:\
      \ ${HIKARI_LEAK_DETECTION}\n      connection-test-query: ${HIKARI_TEST_QUERY}\n\
      \      pool-name: cloud-infra-hikari-pool\n      read-only: false\n      data-source-properties:\n\
      \        cachePrepStmts: true\n        prepStmtCacheSize: 250\n        prepStmtCacheSqlLimit:\
      \ 2048\n        useServerPrepStmts: true\n        reWriteBatchedInserts: true\n\
      \        ApplicationName: cloud-infra-system\n  threads:\n    virtual:\n   \
      \   enabled: true\n  data:\n    redis:\n      host: ${SPRING_DATA_REDIS_HOST}\n\
      \      port: 6379\n      database: 0\nmanagement:\n  server:\n    port: 9301\n\
      \  endpoints:\n    web:\n      base-path: /management\n      exposure:\n   \
      \     include: \"*\"\n  endpoint:\n    health:\n      show-details: always\n\
      \  metrics:\n    export:\n      prometheus:\n        enabled: true\n  tracing:\n\
      \    sampling:\n      probability: 1.0\n  otlp:\n    tracing:\n      endpoint:\
      \ http://otel-collector:4317\n  tracing:\n    enabled: true\n    sampling:\n\
      \      probability: 1.0\n    zipkin:\n      enabled: true\n      endpoint: http://zipkin:9411/api/v2/spans\n\
      \      sender:\n        type: web\n    otel:\n      exporter:\n        zipkin:\n\
      \          endpoint: http://zipkin:9411/api/v2/spans\n        otlp:\n      \
      \    endpoint: http://otel-collector:4317\n"
secret:
  enabled: true
  data:
    postgres.host: ''
    postgres.username: ''
    postgres.password: ''
serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  networkPolicy:
    allowExternal: false
networkPolicy:
  allowExternal: false
pdb:
  enabled: true
  minAvailable: 1
