replicaCount: 2
image:
  repository: cloud-infra-search
  pullPolicy: IfNotPresent
  tag: latest
imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''
serviceAccount:
  create: true
  annotations: {}
  name: ''
podAnnotations:
  prometheus.io/scrape: 'true'
  # /management/prometheus 在管理端口 9301(原 8085 是业务端口, 抓取恒 404)
  prometheus.io/port: '9301'
  prometheus.io/path: /management/prometheus
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
service:
  type: ClusterIP
  port: 8085
  targetPort: 8085
managementService:
  enabled: true
  port: 9301
  targetPort: 9301
resources:
  limits:
    cpu: 1000m
    # 与 compose mem_limit(640m) 对齐(堆 256m + 堆外上限 448m 需要 >512Mi)
    memory: 640Mi
  requests:
    cpu: 500m
    memory: 256Mi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
nodeSelector: {}
tolerations: []
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - cloud-infra-search
        topologyKey: kubernetes.io/hostname
env:
- name: AUTH_JWT_SECRET
  valueFrom:
    secretKeyRef:
      name: cloud-infra-secrets
      key: jwt.secret
- name: INTERNAL_CALL_SECRET
  valueFrom:
    secretKeyRef:
      name: cloud-infra-secrets
      key: internalCall.secret
- name: NACOS_ADDR
  valueFrom:
    configMapKeyRef:
      name: cloud-infra-config
      key: nacos.addr
- name: NACOS_CONFIG_ADDR
  valueFrom:
    configMapKeyRef:
      name: cloud-infra-config
      key: nacos.config.addr
- name: NACOS_DISCOVERY_ADDR
  valueFrom:
    configMapKeyRef:
      name: cloud-infra-config
      key: nacos.discovery.addr
- name: ELASTICSEARCH_URIS
  valueFrom:
    configMapKeyRef:
      name: cloud-infra-config
      key: elasticsearch.host
- name: SPRING_RABBITMQ_HOST
  valueFrom:
    configMapKeyRef:
      name: cloud-infra-config
      key: rabbitmq.host
- name: JAVA_OPTS
  # native 内存四项上限与 compose 逐字一致(守护: deploy/tests/test_k8s_values_alignment.py)
  value: "-XX:+UseG1GC -Xmx256m -Xms128m -XX:+UseCompactObjectHeaders -XX:+ExitOnOutOfMemoryError -XX:+UseContainerSupport -XX:MaxMetaspaceSize=256m -XX:CompressedClassSpaceSize=64m -XX:ReservedCodeCacheSize=64m -XX:MaxDirectMemorySize=64m"
livenessProbe:
  httpGet:
    path: /management/health/liveness
    port: 9301
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /management/health/readiness
    port: 9301
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
startupProbe:
  httpGet:
    path: /management/health/readiness
    port: 9301
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  # 10 + 40×10 = 410s >= compose start_period 330s
  # (search 实测启动 255.7s, 原 30×10=300s 覆盖不住)
  failureThreshold: 40
configMap:
  enabled: true
  data:
    application.yml: "spring:\n  application:\n    name: cloud-search\n  main:\n \
      \   allow-bean-definition-overriding: true\n  config:\n    import: \"optional:nacos:search-service.yaml\"\
      \n  cloud:\n    nacos:\n      config:\n        server-addr: ${NACOS_CONFIG_ADDR}\n\
      \        file-extension: yaml\n        import-check:\n          enabled: false\n\
      \        shared-configs:\n          - data-id: actuator-config.yaml\n      \
      \      refresh: true\n      discovery:\n        server-addr: ${NACOS_DISCOVERY_ADDR}\n\
      \  elasticsearch:\n    uris: ${ELASTICSEARCH_URIS:http://cloud-elasticsearch:9200}\n  rabbitmq:\n    host:\
      \ ${SPRING_RABBITMQ_HOST}\n    port: 5672\n    username: guest\n    password:\
      \ guest\nmanagement:\n  server:\n    port: 9301\n  endpoints:\n    web:\n  \
      \    base-path: /management\n      exposure:\n        include: health,info,prometheus,metrics,refresh\n  tracing:\n\
      \    sampling:\n      probability: 0.2\n  otlp:\n    tracing:\n      endpoint:\
      \ http://otel-collector:4317\n  tracing:\n    enabled: true\n    sampling:\n\
      \      probability: 0.2\n    zipkin:\n      enabled: true\n      endpoint: http://zipkin:9411/api/v2/spans\n\
      \      sender:\n        type: web\n    otel:\n      exporter:\n        zipkin:\n\
      \          endpoint: http://zipkin:9411/api/v2/spans\n        otlp:\n      \
      \    endpoint: http://otel-collector:4317\n"
secret:
  enabled: true
  data:
    postgres.host: ''
    postgres.username: ''
    postgres.password: ''
serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  networkPolicy:
    allowExternal: false
networkPolicy:
  allowExternal: false
pdb:
  enabled: true
  minAvailable: 1
