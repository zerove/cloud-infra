{{- if .Values.sealedSecrets.enabled }}
# SealedSecret: 使用 Bitnami Sealed Secrets 控制器加密的密钥
# 生成方式:
#   1. 安装 sealed-secrets 控制器: kubectl apply -f https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.27.1/controller.yaml
#   2. 使用 kubeseal 加密: echo -n 'mypassword' | kubeseal --format yaml --name cloud-infra-sealed-secrets
#   3. 将输出的 SealedSecret 粘贴到本文件
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.sealedSecrets.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: cloud-infra
    sealed-secrets: enabled
spec:
  template:
    metadata:
      name: {{ .Values.sealedSecrets.name }}
      namespace: {{ .Release.Namespace }}
      labels:
        app.kubernetes.io/part-of: cloud-infra
    type: Opaque
  encryptedData:
    {{- range $key, $value := .Values.sealedSecrets.encryptedData }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
{{- end }}
