{{- if .Values.alertmanager.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloud-infra-alertmanager-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: cloud-infra
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      # SMTP 邮件告警 (可选, 配置后启用)
      smtp_smarthost: '{{ .Values.alertmanager.smtp.host }}:{{ .Values.alertmanager.smtp.port }}'
      smtp_from: '{{ .Values.alertmanager.smtp.from }}'
      smtp_auth_username: '{{ .Values.alertmanager.smtp.username }}'
      smtp_auth_password: '{{ .Values.alertmanager.smtp.password }}'
      smtp_require_tls: {{ .Values.alertmanager.smtp.requireTLS }}

    # 路由: 按严重级别与标签分发告警
    route:
      group_by: ['alertname', 'severity', 'service']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'default'
      routes:
        - matchers:
            - severity = "critical"
          receiver: 'critical'
          continue: true
        - matchers:
            - severity = "warning"
          receiver: 'warning'
        - matchers:
            - service =~ "gateway|auth"
          receiver: 'platform'
        - matchers:
            - alertname =~ "KubePodCrashLooping|KubePodNotReady|KubeDeploymentReplicasMismatch"
          receiver: 'kubernetes'

    # 抑制规则: 避免告警风暴
    inhibit_rules:
      - source_matchers:
          - severity = "critical"
        target_matchers:
          - severity = "warning"
        equal: ['alertname', 'service']
      - source_matchers:
          - alertname = "KubePodCrashLooping"
        target_matchers:
          - alertname =~ "KubePod.*"
        equal: ['namespace', 'pod']

    receivers:
      - name: 'default'
        webhook_configs:
          - url: 'http://{{ .Values.alertmanager.webhook.host }}:{{ .Values.alertmanager.webhook.port }}/alert'
            send_resolved: true

      - name: 'critical'
        # 钉钉机器人 (可选)
        {{- if .Values.alertmanager.dingtalk.enabled }}
        webhook_configs:
          - url: '{{ .Values.alertmanager.dingtalk.url }}'
            send_resolved: true
        {{- end }}
        # 企业微信机器人 (可选)
        {{- if .Values.alertmanager.wecom.enabled }}
        webhook_configs:
          - url: '{{ .Values.alertmanager.wecom.url }}'
            send_resolved: true
        {{- end }}
        # 邮件 (可选)
        {{- if .Values.alertmanager.email.enabled }}
        email_configs:
          - to: '{{ .Values.alertmanager.email.to }}'
            send_resolved: true
        {{- end }}

      - name: 'warning'
        {{- if .Values.alertmanager.dingtalk.enabled }}
        webhook_configs:
          - url: '{{ .Values.alertmanager.dingtalk.url }}'
            send_resolved: true
        {{- end }}
        {{- if .Values.alertmanager.wecom.enabled }}
        webhook_configs:
          - url: '{{ .Values.alertmanager.wecom.url }}'
            send_resolved: true
        {{- end }}

      - name: 'platform'
        {{- if .Values.alertmanager.dingtalk.enabled }}
        webhook_configs:
          - url: '{{ .Values.alertmanager.dingtalk.url }}'
            send_resolved: true
        {{- end }}

      - name: 'kubernetes'
        {{- if .Values.alertmanager.wecom.enabled }}
        webhook_configs:
          - url: '{{ .Values.alertmanager.wecom.url }}'
            send_resolved: true
        {{- end }}
        {{- if .Values.alertmanager.email.enabled }}
        email_configs:
          - to: '{{ .Values.alertmanager.email.to }}'
            send_resolved: true
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: cloud-infra-alertmanager
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: cloud-infra
spec:
  selector:
    app.kubernetes.io/name: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: 9093
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-infra-alertmanager
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: cloud-infra
spec:
  replicas: {{ .Values.alertmanager.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager
        app.kubernetes.io/part-of: cloud-infra
    spec:
      containers:
        - name: alertmanager
          image: {{ .Values.alertmanager.image }}
          args:
            - '--config.file=/etc/alertmanager/alertmanager.yml'
            - '--storage.path=/alertmanager'
            - '--cluster.listen-address='  # 单实例模式
          ports:
            - name: http
              containerPort: 9093
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: storage
              mountPath: /alertmanager
          resources:
            {{- toYaml .Values.alertmanager.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: cloud-infra-alertmanager-config
        - name: storage
          emptyDir: {}
{{- end }}
