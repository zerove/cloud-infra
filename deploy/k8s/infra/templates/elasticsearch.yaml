apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloud-infra-infra.fullname" . }}-elasticsearch
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: cloud-infra-infra
{{- if .Values.elasticsearch.enabled }}
spec:
  replicas: {{ .Values.elasticsearch.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elasticsearch
        app.kubernetes.io/part-of: cloud-infra-infra
    spec:
      containers:
        - name: elasticsearch
          image: {{ .Values.elasticsearch.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9200
              name: http
            - containerPort: 9300
              name: transport
          env:
            - name: discovery.type
              value: {{ .Values.elasticsearch.singleNode | ternary "single-node" "multi-node" }}
            - name: xpack.security.enabled
              value: {{ .Values.elasticsearch.securityEnabled | quote }}
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          resources:
            {{- toYaml .Values.elasticsearch.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            initialDelaySeconds: 30
            periodSeconds: 15
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
      {{- if .Values.elasticsearch.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "cloud-infra-infra.fullname" . }}-elasticsearch-data
      {{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: cloud-infra-elasticsearch
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: cloud-infra-infra
spec:
  type: ClusterIP
  ports:
    - port: 9200
      targetPort: 9200
      name: http
    - port: 9300
      targetPort: 9300
      name: transport
  selector:
    app.kubernetes.io/name: elasticsearch
{{- if .Values.elasticsearch.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "cloud-infra-infra.fullname" . }}-elasticsearch-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.elasticsearch.persistence.size }}
{{- end }}