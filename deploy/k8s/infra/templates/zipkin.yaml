apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloud-infra-infra.fullname" . }}-zipkin
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: zipkin
    app.kubernetes.io/part-of: cloud-infra-infra
{{- if .Values.zipkin.enabled }}
spec:
  replicas: {{ .Values.zipkin.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: zipkin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zipkin
        app.kubernetes.io/part-of: cloud-infra-infra
    spec:
      containers:
        - name: zipkin
          image: {{ .Values.zipkin.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9411
              name: http
          env:
            - name: STORAGE_TYPE
              value: {{ .Values.zipkin.storage.type }}
            {{- if eq .Values.zipkin.storage.type "elasticsearch" }}
            # Elasticsearch 存储配置
            - name: ES_HOSTS
              value: {{ .Values.zipkin.storage.elasticsearch.hosts | quote }}
            - name: ES_INDEX
              value: {{ .Values.zipkin.storage.elasticsearch.index | default "zipkin" | quote }}
            - name: ES_INDEX_REPLICAS
              value: {{ .Values.zipkin.storage.elasticsearch.indexReplicas | default "0" | quote }}
            - name: ES_INDEX_SHARDS
              value: {{ .Values.zipkin.storage.elasticsearch.indexShards | default "1" | quote }}
            - name: ES_PIPELINE
              value: {{ .Values.zipkin.storage.elasticsearch.pipeline | default "" | quote }}
            {{- if .Values.zipkin.storage.elasticsearch.username }}
            - name: ES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: cloud-infra-secrets
                  key: elasticsearch.username
            {{- end }}
            {{- if .Values.zipkin.storage.elasticsearch.password }}
            - name: ES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloud-infra-secrets
                  key: elasticsearch.password
            {{- end }}
            {{- end }}
            {{- if eq .Values.zipkin.storage.type "mem" }}
            - name: MEM_MAX_SPANS
              value: "500000"
            {{- end }}
          resources:
            {{- toYaml .Values.zipkin.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: 9411
            initialDelaySeconds: 15
            periodSeconds: 10
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: zipkin
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: zipkin
    app.kubernetes.io/part-of: cloud-infra-infra
spec:
  type: ClusterIP
  ports:
    - port: 9411
      targetPort: 9411
      name: http
  selector:
    app.kubernetes.io/name: zipkin
