apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloud-infra-infra.fullname" . }}-otel-collector
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: cloud-infra-infra
{{- if .Values.otelCollector.enabled }}
spec:
  replicas: {{ .Values.otelCollector.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/part-of: cloud-infra-infra
    spec:
      containers:
        - name: otel-collector
          image: {{ .Values.otelCollector.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
          args: ["--config=/etc/otel/config.yaml"]
          resources:
            {{- toYaml .Values.otelCollector.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/otel
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 4318
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: {{ include "cloud-infra-infra.fullname" . }}-otel-config
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: cloud-infra-infra
spec:
  type: ClusterIP
  ports:
    - port: 4317
      targetPort: 4317
      name: otlp-grpc
    - port: 4318
      targetPort: 4318
      name: otlp-http
  selector:
    app.kubernetes.io/name: otel-collector
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cloud-infra-infra.fullname" . }}-otel-config
  namespace: {{ .Release.Namespace }}
data:
  config.yaml: |
    {{- toYaml .Values.otelCollector.config | nindent 4 }}