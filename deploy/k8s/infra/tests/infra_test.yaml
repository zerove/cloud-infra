# Infra Chart Unit Tests

suiteName: "Infra Chart Tests"

tests:
  - it: Should render nacos deployment when enabled
    template: templates/nacos.yaml
    set:
      nacos.enabled: true
    documentIndex: 0
    asserts:
      - isKind:
          of: Deployment
      - matchRegex:
          path: metadata.name
          pattern: ".*nacos.*"

  - it: Should render redis deployment when enabled
    template: templates/redis.yaml
