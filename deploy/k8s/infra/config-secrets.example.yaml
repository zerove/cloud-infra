apiVersion: v1
kind: ConfigMap
metadata:
  name: cloud-infra-config
  namespace: cloud-infra
  labels:
    app.kubernetes.io/part-of: cloud-infra
data:
  nacos.addr: "cloud-infra-nacos:8848"
  nacos.config.addr: "cloud-infra-nacos:8848"
  nacos.discovery.addr: "cloud-infra-nacos:8848"
  rabbitmq.host: "cloud-infra-rabbitmq"
  elasticsearch.host: "cloud-infra-elasticsearch"
  minio.endpoint: "cloud-infra-minio:9000"
  zipkin.endpoint: "http://zipkin:9411/api/v2/spans"
  otel.endpoint: "http://otel-collector:4317"
---
# 模板文件：实际密钥由 CI（GitHub Secrets）或运维注入，禁止提交真实值
apiVersion: v1
kind: Secret
metadata:
  name: cloud-infra-secrets
  namespace: cloud-infra
  labels:
    app.kubernetes.io/part-of: cloud-infra
type: Opaque
stringData:
  postgres.host: "cloud-infra-postgresql"
  postgres.username: "postgres"
  # 通过环境变量注入：kubectl create secret generic cloud-infra-secrets --from-literal=postgres.password=$POSTGRES_PASSWORD ...
  postgres.password: "CHANGE_ME"
  jwt.secret: "CHANGE_ME"
  minio.access-key: "CHANGE_ME"
  minio.secret-key: "CHANGE_ME"