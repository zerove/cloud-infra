# Default values for cloud-infra-infra

nacos:
  enabled: true
  image: nacos/nacos-server:2.3.2
  replicas: 1
  mode: standalone
  authEnabled: false
  resources:
    limits:
      cpu: 1000m
      memory: 768Mi
    requests:
      cpu: 500m
      memory: 512Mi
  service:
    port: 8848
    grpcPort: 9848
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""

redis:
  enabled: true
  image: redis:7-alpine
  replicas: 1
  password: ""
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 250m
      memory: 128Mi
  service:
    port: 6379
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""

postgresql:
  enabled: true
  image: postgres:16-alpine
  replicas: 1
  auth:
    database: cloud_infra
    username: postgres
    password: password
    existingSecret: cloud-infra-secrets
    secretKey: postgres.password
  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 500m
      memory: 256Mi
  service:
    port: 5432
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""

rabbitmq:
  enabled: true
  image: rabbitmq:3-management-alpine
  replicas: 1
  auth:
    username: guest
    password: guest
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  service:
    port: 5672
    managementPort: 15672
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""

elasticsearch:
  enabled: true
  image: elasticsearch:8.12.2
  replicas: 1
  singleNode: true
  securityEnabled: false
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi
  service:
    port: 9200
    transportPort: 9300
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""

zipkin:
  enabled: true
  image: openzipkin/zipkin:latest
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  service:
    port: 9411
  storage:
    type: mem  # mem (内存) 或 elasticsearch (ES 持久化)
    elasticsearch:
      hosts: "http://cloud-infra-elasticsearch:9200"
      index: "zipkin"
      indexReplicas: 0
      indexShards: 1
      pipeline: ""
      username: ""
      password: ""

otelCollector:
  enabled: true
  image: otel/opentelemetry-collector-contrib:latest
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  service:
    grpcPort: 4317
    httpPort: 4318
  config:
    receivers:
      otlp:
        protocols:
          grpc:
          http:
    processors:
      batch:
    exporters:
      otlp:
        endpoint: zipkin:4317
        tls:
          insecure: true
      logging:
        verbosity: basic
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp, logging]

minio:
  enabled: true
  image: minio/minio:latest
  replicas: 1
  auth:
    rootUser: cloud-infra-minio-dev
    rootPassword: CloudInfraMinioDevSecret2024
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  service:
    apiPort: 9000
    consolePort: 9001
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""

prometheus:
  enabled: true
  image: prom/prometheus:latest
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  service:
    port: 9090
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""

configMap:
  enabled: true
  data:
    nacos.addr: "cloud-infra-nacos:8848"
    nacos.config.addr: "cloud-infra-nacos:8848"
    nacos.discovery.addr: "cloud-infra-nacos:8848"
    rabbitmq.host: "cloud-infra-rabbitmq"
    elasticsearch.host: "cloud-infra-elasticsearch"
    minio.endpoint: "cloud-infra-minio:9000"

secret:
  enabled: true
  data:
    postgres.host: "cloud-infra-postgresql"
    postgres.username: "postgres"
    postgres.password: ""
    jwt.secret: ""
    minio.access-key: ""
    minio.secret-key: ""

# Bitnami SealedSecrets 密钥管理
# 生成方式见 deploy/k8s/scripts/seal-secrets.sh
sealedSecrets:
  enabled: false
  name: cloud-infra-sealed-secrets
  # 使用 kubeseal 加密后的密钥数据
  # 示例: echo -n 'password' | kubeseal --raw --name cloud-infra-sealed-secrets --namespace cloud-infra
  encryptedData: {}

# Alertmanager 告警路由
alertmanager:
  enabled: false
  image: prom/alertmanager:v0.27.0
  replicas: 1
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  smtp:
    host: smtp.example.com
    port: 587
    from: alert@cloud-infra.io
    username: ""
    password: ""
    requireTLS: true
  webhook:
    host: cloud-infra-webhook
    port: 8080
  dingtalk:
    enabled: false
    url: "https://oapi.dingtalk.com/robot/send?access_token=YOUR_TOKEN"
  wecom:
    enabled: false
    url: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=YOUR_KEY"
  email:
    enabled: false
    to: "ops@cloud-infra.io"

# PgBouncer 连接池 (PostgreSQL 高可用/连接管理)
pgbouncer:
  enabled: false
  image: edoburu/pgbouncer:1.21.0
  replicas: 1
  maxClientConn: 500
  defaultPoolSize: 50
  minPoolSize: 10
  reservePoolSize: 5
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 200m
      memory: 128Mi

# Loki + Promtail 日志收集
loki:
  enabled: false
  image: grafana/loki:2.9.4
  promtailImage: grafana/promtail:2.9.4
  replicas: 1
  storageSize: 20Gi
  retentionPeriod: 168h
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi
  promtailResources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi