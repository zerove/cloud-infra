replicaCount: 2
image:
  repository: cloud-infra-notification
  pullPolicy: IfNotPresent
  tag: latest
imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''
serviceAccount:
  create: true
  annotations: {}
  name: ''
podAnnotations:
  prometheus.io/scrape: 'true'
  prometheus.io/port: '8084'
  prometheus.io/path: /management/prometheus
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
service:
  type: ClusterIP
  port: 8084
  targetPort: 8084
managementService:
  enabled: true
  port: 9301
  targetPort: 9301
resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 500m
    memory: 256Mi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
nodeSelector: {}
tolerations: []
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - cloud-infra-notification
        topologyKey: kubernetes.io/hostname
env:
- name: AUTH_JWT_SECRET
  valueFrom:
    secretKeyRef:
      name: cloud-infra-secrets
      key: jwt.secret
- name: INTERNAL_CALL_SECRET
  valueFrom:
    secretKeyRef:
      name: cloud-infra-secrets
      key: internalCall.secret
- name: SPRING_PROFILES_ACTIVE
  value: k8s
- name: NACOS_ADDR
  valueFrom:
    configMapKeyRef:
      name: cloud-infra-config
      key: nacos.addr
- name: NACOS_CONFIG_ADDR
  valueFrom:
    configMapKeyRef:
      name: cloud-infra-config
      key: nacos.config.addr
- name: NACOS_DISCOVERY_ADDR
  valueFrom:
    configMapKeyRef:
      name: cloud-infra-config
      key: nacos.discovery.addr
- name: SPRING_DATASOURCE_HOST
  valueFrom:
    secretKeyRef:
      name: cloud-infra-secrets
      key: postgres.host
- name: SPRING_DATASOURCE_USERNAME
  valueFrom:
    secretKeyRef:
      name: cloud-infra-secrets
      key: postgres.username
- name: SPRING_DATASOURCE_PASSWORD
  valueFrom:
    secretKeyRef:
      name: cloud-infra-secrets
      key: postgres.password
- name: SPRING_RABBITMQ_HOST
  valueFrom:
    configMapKeyRef:
      name: cloud-infra-config
      key: rabbitmq.host
- name: SPRING_RABBITMQ_USERNAME
  value: guest
- name: SPRING_RABBITMQ_PASSWORD
  value: guest
- name: JAVA_OPTS
  value: "-XX:+UseG1GC -Xmx320m -Xms128m -XX:+UseCompactObjectHeaders -XX:+ExitOnOutOfMemoryError -XX:+UseContainerSupport"
livenessProbe:
  httpGet:
    path: /management/health/liveness
    port: 9301
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /management/health/readiness
    port: 9301
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
startupProbe:
  httpGet:
    path: /management/health/readiness
    port: 9301
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30
configMap:
  enabled: true
  data:
    application.yml: "spring:\n  application:\n    name: cloud-notification\n  main:\n\
      \    allow-bean-definition-overriding: true\n  config:\n    import: \"optional:nacos:notification-service.yaml\"\
      \n  cloud:\n    nacos:\n      discovery:\n        server-addr: ${NACOS_DISCOVERY_ADDR}\n\
      \        ip: ${POD_IP}\n        prefer-ip-address: true\n      config:\n   \
      \     server-addr: ${NACOS_CONFIG_ADDR}\n        file-extension: yaml\n    \
      \    shared-configs:\n          - data-id: actuator-config.yaml\n          \
      \  refresh: true\n    stream:\n      bindings:\n        user-events-in-0:\n\
      \          destination: user.events\n          group: cloud-notification-group\n\
      \          consumer:\n            max-attempts: 3\n            back-off-initial-interval:\
      \ 1000\n            back-off-multiplier: 2.0\n            back-off-max-interval:\
      \ 10000\n        notification-send-out-0:\n          destination: notification.send\n\
      \          content-type: application/json\n      rabbit:\n        bindings:\n\
      \          user-events-in-0:\n            consumer:\n              auto-bind-dlq:\
      \ true\n              dlq-name: user.events.dlq\n              republish-to-dlq:\
      \ true\n  threads:\n    virtual:\n      enabled: true\n  rabbitmq:\n    host:\
      \ ${SPRING_RABBITMQ_HOST}\n    port: 5672\n    username: ${SPRING_RABBITMQ_USERNAME}\n\
      \    password: ${SPRING_RABBITMQ_PASSWORD}\nmanagement:\n  server:\n    port:\
      \ 9301\n  endpoints:\n    web:\n      base-path: /management\n      exposure:\n\
      \        include: \"*\"\n  tracing:\n    sampling:\n      probability: 1.0\n\
      \  otlp:\n    tracing:\n      endpoint: http://otel-collector:4317\n  tracing:\n\
      \    enabled: true\n    sampling:\n      probability: 1.0\n    zipkin:\n   \
      \   enabled: true\n      endpoint: http://zipkin:9411/api/v2/spans\n      sender:\n\
      \        type: web\n    otel:\n      exporter:\n        zipkin:\n          endpoint:\
      \ http://zipkin:9411/api/v2/spans\n        otlp:\n          endpoint: http://otel-collector:4317\n"
secret:
  enabled: true
  data:
    postgres.host: ''
    postgres.username: ''
    postgres.password: ''
serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  networkPolicy:
    allowExternal: false
networkPolicy:
  allowExternal: false
pdb:
  enabled: true
  minAvailable: 1
