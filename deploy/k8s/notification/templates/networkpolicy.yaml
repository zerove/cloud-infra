apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cloud-infra-notification.fullname" . }}-deny-all
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloud-infra-notification.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cloud-infra-notification.fullname" . }}-allow-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloud-infra-notification.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cloud-infra-notification.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # 允许来自网关的流量
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cloud-infra-gateway
      ports:
        - protocol: TCP
          port: 8084
        - protocol: TCP
          port: 9301
    # 允许来自同命名空间其他服务的流量
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8084
        - protocol: TCP
          port: 9301
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cloud-infra-notification.fullname" . }}-allow-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloud-infra-notification.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cloud-infra-notification.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    # 允许访问 Nacos
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloud-infra
          podSelector:
            matchLabels:
              app.kubernetes.io/name: nacos
      ports:
        - protocol: TCP
          port: 8848
    # 允许访问 Redis
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloud-infra
          podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 6379
    # 允许访问 PostgreSQL
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloud-infra
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - protocol: TCP
          port: 5432
    # 允许访问 RabbitMQ
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloud-infra
          podSelector:
            matchLabels:
              app.kubernetes.io/name: rabbitmq
      ports:
        - protocol: TCP
          port: 5672
    # 允许访问 DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # 允许访问外部 API (如有需要)
    {{- if .Values.networkPolicy.allowExternal }}
    - to: []
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
    {{- end }}