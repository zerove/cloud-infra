      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      no_proxy: "*"
      NO_PROXY: "*"
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: cloud-nacos:8848
      # SkyWalking agent (M7-01: 默认开启)
      SW_AGENT_ENABLED: "true"
      SW_AGENT_OAP: cloud-skywalking-oap:11800
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9301/management/health/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      # start_period 必须覆盖实测启动耗时, 否则会**误判 unhealthy**(真实语义见下)。
      # 实测 auth 启动 147.5s(含 SkyWalking agent 装 transformer),
      # 而 start_period(20s) + interval(5s) * retries(5) = 45s 就判红。
      # 机制: start_period 结束后 Docker 才计数失败, 连续失败达 retries 即转 unhealthy。
      # ⚠️ unhealthy 并**非不可恢复**: 受控实验(临时容器, start_period=10s/interval=5s/retries=3,
      #    探测目标 70s 后才就绪)实测 FailingStreak 3→4→6→7→8, 于 55s 回到 healthy 且计数归零。
      #    故少配 start_period 的代价是"启动期被误标 unhealthy 的一段时间"而非永久卡死;
      #    但依赖 health 状态做门禁的编排会在这段时间拒绝流量, 冷启动越长越易误判, 故仍应配足。
      # 此值 = 实测 147.5s 留约 20% 余量; 调小前先重新读 'Started ... in N seconds'。
      # ⚠️ 实测值随宿主负载波动很大(notification 两次: 130.9s / 304.3s, 差 2.3 倍),
      #    故取最坏观测值并留余量 —— 少配会误判, 多配只是让判定晚点开始。
      start_period: 210s
    networks:
      - cloud-infra
    depends_on:
      nacos:
        condition: service_healthy
      # ⚠️ 必须是 service_started, **不能是 service_healthy** (2026-10-03 实测回退)。
      #   我曾把它改成 service_healthy, 理由是"OAP 起不来业务服务会被带崩",
      #   但那条因果链是**错的**, 实测证伪:
      #     - 应用代码对 OAP **无任何启动期依赖**:
      #       TracingAutoConfiguration 只提供虚拟线程 + MDC 传播, 不碰 OAP;
      #       全仓 `backend_service` 只出现在 agent-entrypoint.sh 一处。
      #     - SkyWalking agent 是 -javaagent 注入的**异步 gRPC 上报**,
