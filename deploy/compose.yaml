services:
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: nacos-server
    environment:
      - PREFER_HOST_MODE=hostname
      - MODE=standalone
      - JVM_XMS=256m
      - JVM_XMX=256m
      - JVM_XMN=128m
    ports:
      - "8848:8848"
      - "9848:9848"
    expose:
      - "9848"
    volumes:
      - nacos_logs:/home/nacos/logs
      - nacos_data:/home/nacos/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/index.html"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  redis:
    image: redis:7.2-alpine
    container_name: redis-server
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  postgres:
    image: postgres:16
    container_name: postgres-server
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=cloud_infra
      - TZ=Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        JAR_FILE: cloud-infra-gateway/target/cloud-infra-gateway-1.0.0-SNAPSHOT.jar
    container_name: cloud-gateway
    ports:
      - "9000:9000"
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./config/gateway-application.yml:/app/config/application.yml:ro
    environment:
      - SPRING_CONFIG_LOCATION=file:/app/config/application.yml
      - SPRING_CLOUD_NACOS_SERVER_ADDR=nacos:8848
      - SPRING_THREADS_VIRTUAL_ENABLED=true
      - SPRING_DATA_REDIS_HOST=redis-server
    deploy:
      resources:
        limits:
          memory: 512M
    labels:
      - "monitoring=true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always

  auth:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        JAR_FILE: cloud-infra-auth/target/cloud-infra-auth-1.0.0-SNAPSHOT.jar
    container_name: cloud-auth
    ports:
      - "9200:9200"
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./config/auth-application.yml:/app/config/application.yml:ro
    environment:
      - SPRING_CONFIG_LOCATION=file:/app/config/application.yml
      - SPRING_CLOUD_NACOS_SERVER_ADDR=nacos:8848
      - SPRING_THREADS_VIRTUAL_ENABLED=true
      - SPRING_DATA_REDIS_HOST=redis-server
    deploy:
      resources:
        limits:
          memory: 512M
    labels:
      - "monitoring=true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always

  system:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        JAR_FILE: cloud-infra-modules/system-module/target/system-module-1.0.0-SNAPSHOT.jar
    container_name: cloud-system
    ports:
      - "9300:9300"
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_started
    volumes:
      - ./config/system-application.yml:/app/config/application.yml:ro
      - ./logs/system:/var/log/system
    environment:
      - SPRING_CONFIG_LOCATION=file:/app/config/application.yml
      - SPRING_CLOUD_NACOS_SERVER_ADDR=nacos:8848
      - SPRING_DATASOURCE_HOST=postgres-server
      - SPRING_DATASOURCE_PORT=5432
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_THREADS_VIRTUAL_ENABLED=true
      - SPRING_DATA_REDIS_HOST=redis-server
    deploy:
      resources:
        limits:
          memory: 768M
    labels:
      - "monitoring=true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9300/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./services.json:/etc/prometheus/services.json
    restart: always

  seata:
    image: seataio/seata-server:2.0.0
    container_name: seata-server
    environment:
      - SEATA_PORT=8091
      - STORE_MODE=file
      - REGISTRY_TYPE=nacos
      - REGISTRY_NACOS_SERVER_ADDR=nacos:8848
      - REGISTRY_NACOS_GROUP=SEATA_GROUP
    ports:
      - "8091:8091"
      - "7091:7091"
    depends_on:
      nacos:
        condition: service_healthy
    restart: always

volumes:
  nacos_logs:
  nacos_data:
  redis_data:
  postgres_data:
