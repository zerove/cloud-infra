    stop_grace_period: 30s
    container_name: cloud-sentinel
    mem_limit: 256m
    ports:
      - "8858:8858"
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      no_proxy: "*"
      NO_PROXY: "*"
      SENTINEL_DASHBOARD_SERVER: ":8858"
      SENTINEL_DASHBOARD_AUTH_USERNAME: sentinel
      SENTINEL_DASHBOARD_AUTH_PASSWORD: sentinel
    networks:
      - cloud-infra
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8858"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

