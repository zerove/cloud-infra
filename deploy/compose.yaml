      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      no_proxy: "*"
      NO_PROXY: "*"
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: cloud-nacos:8848
      # SkyWalking agent (M7-01: 默认开启)
      SW_AGENT_ENABLED: "true"
      SW_AGENT_OAP: cloud-skywalking-oap:11800
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9301/management/health/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      # start_period 必须覆盖实测启动耗时, 否则会**误判 unhealthy**(真实语义见下)。
      # 实测 notification 启动 304.3s(含 SkyWalking agent 装 transformer),
      # 而 start_period(20s) + interval(5s) * retries(5) = 45s 就判红。
      # 机制: start_period 结束后 Docker 才计数失败, 连续失败达 retries 即转 unhealthy。
      # ⚠️ unhealthy 并**非不可恢复**: 受控实验(临时容器, start_period=10s/interval=5s/retries=3,
      #    探测目标 70s 后才就绪)实测 FailingStreak 3→4→6→7→8, 于 55s 回到 healthy 且计数归零。
      #    故少配 start_period 的代价是"启动期被误标 unhealthy 的一段时间"而非永久卡死;
      #    但依赖 health 状态做门禁的编排会在这段时间拒绝流量, 冷启动越长越易误判, 故仍应配足。
      # 此值 = 实测 304.3s 留约 20% 余量; 调小前先重新读 'Started ... in N seconds'。
      # ⚠️ 实测值随宿主负载波动很大(notification 两次: 130.9s / 304.3s, 差 2.3 倍),
      #    故取最坏观测值并留余量 —— 少配会误判, 多配只是让判定晚点开始。
      start_period: 360s
    networks:
      - cloud-infra
    depends_on:
      nacos:
        condition: service_healthy
      # ⚠️ 必须是 service_started, **不能是 service_healthy** (2026-10-03 实测回退)。
      #   我曾把它改成 service_healthy, 理由是"OAP 起不来业务服务会被带崩",
      #   但那条因果链是**错的**, 实测证伪:
      #     - 应用代码对 OAP **无任何启动期依赖**:
      #       TracingAutoConfiguration 只提供虚拟线程 + MDC 传播, 不碰 OAP;
      #       全仓 `backend_service` 只出现在 agent-entrypoint.sh 一处。
      #     - SkyWalking agent 是 -javaagent 注入的**异步 gRPC 上报**,
      #       OAP 不可达只会丢 trace, 不阻塞应用启动。
      #     - 实测: OAP 处于 Exited 时, cloud-system 仍达到 healthy,
      #       /actuator/health 200, /sys/user/list 返回结构化 401 (鉴权正常)。
      #   ⇒ 把可观测性组件的可用性当成业务启动前提, 是我自己造的阻塞。
      #     OAP 崩溃应当**只影响可观测性**, 不影响业务可用性 ——
      #     这正是可观测性组件该有的隔离性。
      #   OAP 自身的真依赖是 postgres (SW_STORAGE=postgresql, 见 skywalking-oap 块)。
      #     2026-10-04 存储切换后本注释仍写 elasticsearch, 已过期。
      skywalking-oap:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    logging: *default-logging

  search:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: cloud-infra-modules/search-service/Dockerfile
    image: localhost/cloud-infra-search:latest
    container_name: cloud-search
    # ⚠️ restart 策略缺失是实测缺陷（2026-10-05）。
    #   六个业务服务原本**都没有** restart 键, 只有 nacos 有
    #   (`restart: unless-stopped`)。实测后果: commit 冲到 ~96% 时
    #   notification 以 exit=1 崩溃(`Native memory allocation (malloc)
    #   failed`, 即 JVM 的 hs_err), 而 `RestartCount=0` —— **不自愈**。
    #
    #   这不是"新功能", 是补齐与 nacos 不一致的行为: 其余 15 个容器
    #   崩溃后都会自动重启, 只有这 6 个静默退出, 观察窗口里表现为
    #   「服务凭空消失」而无任何日志线索。
    #
    #   注意 `unless-stopped` **不会**对抗宿主机资源枯竭: commit 持续
    #   满载时重启循环会立刻再崩(实测 auth 就出现过这种反复)。
    #   因此它只解决"偶发崩溃自愈", 不解决"环境容量不足" ——
    #   后者的正解仍是降低同时运行的服务数。
    restart: unless-stopped
    mem_limit: 640m
    ports:
      - "8085:8085"
      - "9306:9301"   # 管理端口 (ADR-008)
    environment:
      JAVA_OPTS: "-XX:+UseG1GC -Xmx256m -Xms128m -XX:+UseCompactObjectHeaders -XX:+ExitOnOutOfMemoryError -XX:+UseContainerSupport -XX:MaxMetaspaceSize=256m -XX:CompressedClassSpaceSize=64m -XX:ReservedCodeCacheSize=64m -XX:MaxDirectMemorySize=64m"
      SPRING_PROFILES_ACTIVE: dev
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: cloud-nacos:8848
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET 必须在 .env 中设置}
      # 服务间签名密钥，FeignAuthInterceptor 与 HeaderAuthenticationFilter 验签使用
      INTERNAL_CALL_SECRET: ${INTERNAL_CALL_SECRET:?INTERNAL_CALL_SECRET 必须在 .env 中设置}
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      no_proxy: "*"
      NO_PROXY: "*"
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: cloud-nacos:8848
      # SkyWalking agent (M7-01: 默认开启)
      SW_AGENT_ENABLED: "true"
      SW_AGENT_OAP: cloud-skywalking-oap:11800
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9301/management/health/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      # start_period 必须覆盖实测启动耗时, 否则会**误判 unhealthy**(真实语义见下)。
      # 实测 search 启动 255.7s(含 SkyWalking agent 装 transformer),
      # 而 start_period(20s) + interval(5s) * retries(5) = 45s 就判红。
      # 机制: start_period 结束后 Docker 才计数失败, 连续失败达 retries 即转 unhealthy。
      # ⚠️ unhealthy 并**非不可恢复**: 受控实验(临时容器, start_period=10s/interval=5s/retries=3,
      #    探测目标 70s 后才就绪)实测 FailingStreak 3→4→6→7→8, 于 55s 回到 healthy 且计数归零。
      #    故少配 start_period 的代价是"启动期被误标 unhealthy 的一段时间"而非永久卡死;
      #    但依赖 health 状态做门禁的编排会在这段时间拒绝流量, 冷启动越长越易误判, 故仍应配足。
      # 此值 = 实测 255.7s 留约 20% 余量; 调小前先重新读 'Started ... in N seconds'。
      # ⚠️ 实测值随宿主负载波动很大(notification 两次: 130.9s / 304.3s, 差 2.3 倍),
      #    故取最坏观测值并留余量 —— 少配会误判, 多配只是让判定晚点开始。
      start_period: 330s
    networks:
      - cloud-infra
    depends_on:
      nacos:
        condition: service_healthy
      # ⚠️ 必须是 service_started, **不能是 service_healthy** (2026-10-03 实测回退)。
      #   我曾把它改成 service_healthy, 理由是"OAP 起不来业务服务会被带崩",
      #   但那条因果链是**错的**, 实测证伪:
      #     - 应用代码对 OAP **无任何启动期依赖**:
      #       TracingAutoConfiguration 只提供虚拟线程 + MDC 传播, 不碰 OAP;
      #       全仓 `backend_service` 只出现在 agent-entrypoint.sh 一处。
      #     - SkyWalking agent 是 -javaagent 注入的**异步 gRPC 上报**,
      #       OAP 不可达只会丢 trace, 不阻塞应用启动。
      #     - 实测: OAP 处于 Exited 时, cloud-system 仍达到 healthy,
      #       /actuator/health 200, /sys/user/list 返回结构化 401 (鉴权正常)。
      #   ⇒ 把可观测性组件的可用性当成业务启动前提, 是我自己造的阻塞。
      #     OAP 崩溃应当**只影响可观测性**, 不影响业务可用性 ——
      #     这正是可观测性组件该有的隔离性。
      #   OAP 自身的真依赖是 postgres (SW_STORAGE=postgresql, 见 skywalking-oap 块)。
      #     2026-10-04 存储切换后本注释仍写 elasticsearch, 已过期。
      skywalking-oap:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    logging: *default-logging

  minio:
    image: minio/minio:latest
    container_name: cloud-minio
    mem_limit: 512m
    ports:
      - "9010:9000"
      - "9011:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER 必须在 .env 中设置}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD 必须在 .env 中设置}
      # ⚠️ 清空代理变量(2026-10-06 实测)。MinIO 的 S3 客户端对 http_proxy
      #   敏感, 继承无监听的代理会让签名/请求路径出错。
      http_proxy: ''
      https_proxy: ''
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      no_proxy: '*'
      NO_PROXY: '*'
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    networks:
      - cloud-infra
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  redisinsight:
    image: redis/redisinsight:latest
    container_name: cloud-redisinsight
    # ⚠️ 必须标 profiles: ["full"]（2026-10-05 实测）。
    #   它是纯调试 UI，零业务引用、零 depends_on，但**预留 20.76 GiB 虚拟地址空间**
    #   （实测 pid 946577 `node redisinsight/api/dist/src/main`，
    #     VmSize 20.76GB 而 RSS 仅 127MB —— 典型 Node V8 预留）。
    #   这已**单独超过**全局 commit 预算的一半（CommitLimit 20.63GB），
    #   而 vm.overcommit_memory=2 下预留即计入预算。
    #
    #   `mem_limit: 256m` 对它**无效** —— 已实测: cgroup 内存限额管的是
    #   实际使用量，管不住 V8 的虚拟地址空间预留（同第八课:
    #   "提高 mem_limit 只会更快耗尽全局预算"的反面 —— 这里根本调不动）。
    #
    #   业务服务（gateway/auth/system/...）都用 profiles: ["full"] 隔离,
    #   但它没有，于是每次 `podman-compose up -d` 都会被拉起 ——
    #   包括只想启动基础设施时。隔离对它失效的形态与"没人调用"一致：
    #   机制在（同一套 profiles 约定），但没接上。
    profiles: ["full"]
    mem_limit: 256m
    # 显式清空代理变量 (2026-10-06 补)。
    #
    # 理由与其它 18 个服务完全一致, 但此前**漏了本服务** ——
    # deploy/tests/check_proxy_env.py 的配置侧统计因此是 18/19 而非 全量。
    # 该服务属 profiles: ["full"] 且当前未运行, 所以运行侧看不出来,
    # 但配置缺口是真的: 一旦有人带 full profile 启动它, 就会继承宿主 shell
    # 的 http_proxy(AGENTS.md 第六课补记二: rootless podman 会从宿主补齐变量),
    # 而 127.0.0.1:7890 在容器网络里指向容器自身, 必然不可达。
    #
    # no_proxy: '*' 之外的四个必须清空 —— 只设 no_proxy 不够,
    # 因为它只影响"哪些地址不过代理", 不影响"存在代理"。
    environment:
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      http_proxy: ''
      https_proxy: ''
      no_proxy: '*'
      NO_PROXY: '*'
    ports:
      - "5540:5540"
    networks:
      - cloud-infra
    logging: *default-logging

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  esdata:
  grafana-data:
  loki-data:
  miniodata:
  fileuploads:

networks:
  cloud-infra:
    name: cloud-infra
