# Cloud-Infra 全套环境声明
# 基础设施:  podman-compose -f deploy/compose.yaml up -d                    (仅启动 nacos/postgres/redis/rabbitmq/es/prometheus)
# 全套环境:   podman-compose -f deploy/compose.yaml --profile full up -d    (基础设施 + 所有微服务)
# 单微服务:   podman-compose -f deploy/compose.yaml --profile full up gateway
#
# 先构建:  mvn clean package -DskipTests
# podman-compose 直接 build 需要 podman 有 Docker-compatible build 能力

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ========== 注册中心 & 配置中心 ==========
  nacos:
    image: nacos/nacos-server:v3.2.3
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-nacos
    # ⚠️ 堆下限 1g / 上限 2g 不是随手填的, 是**实验收敛**出来的 (2026-10-03)。
    #
    # 现象: Nacos 崩溃重启循环 30+ 次, 每次 exit=0 / oom=false, 报
    #   java.sql.SQLTimeoutException: Login timeout exceeded
    #   ERROR XBDA0: Login timeout exceeded
    #   → load derby-schema.sql error
    # 然后下一轮变成
    #   ERROR XBM0A: The database directory '.../derby-data' exists.
    #   However, it does not contain the expected 'service.properties' file.
    # 于是形成**自锁**: 第一轮建库失败留下半成品目录, 第二轮起再也不会成功。
    #
    # Derby 报错很有迷惑性 —— 它说的是"目录已存在", 看着像环境残留,
    # 但清空目录后**第一轮**照样失败。真实原因在更下面一层:
    # seg0/c10.dat 等段文件其实已写入(非空 8KB), 说明 Derby 真的启动了,
    # 只是在最后写 service.properties 前被拖过了 boot 的 login 超时。
    #
    # 逐项排除的假设(每一项都真跑过, 不是推理):
    #   mem_limit 768m -> 2g          仍失败 ⇒ 不是内存不足
    #   bind mount    -> 命名卷        仍失败 ⇒ 不是 bind 挂载/文件锁
    #   -Xmn512m      -> -Xmn170m      仍失败 ⇒ 不是 -Xmn == -Xmx
    #   -Xms256m/-Xmx512m -> 1g/2g   ✅ service.properties 生成, Nacos 正常启动
    #
    # 即**堆太小, Derby 建库在超时内完不成**。镜像脚本自己拼的是
    # `-Xms256m -Xmx512m -Xmn512m`(见容器日志), 官方默认 -Xms1g —— 本项目此前配的
    # 恰好只有官方的 1/4。
    #
    # 2026-10-05 实测: JVM RSS 1570MB / RssAnon 1541MB, Xmx=2048m 是主体且未打满。
    #   下界由**实测**钉住: 堆不能低于 1g(否则 Derby 建库超时, 见上)。
    #   上界需求 = Xmx(2048m) + Metaspace(镜像内置 JVM_MMS=320m) + 线程栈/Native
    #            ≈ 2.5GB, 故 3g 已留足余量, 由 4g 降为 3g。
    #   ⚠️ 只降 mem_limit(cgroup 上限)不会降低实际占用 —— 实测仍是 ~1.6GB。
    #     真正能降的是 Xmx, 而它已被上面的实测下界钉住。这是**预留**优化, 不是占用优化。
    mem_limit: 3g
    ports:
      - "8848:8848"
      - "9848:9848"
      # Nacos 3.x 控制台独立端口 (nacos.console.port=8080)
      - "8080:8080"
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_TOKEN: c2VjcmV0VG9rZW4xMjM0NTY3ODkwYWJjZGVmMTIzNDU2Nzg5MGFiY2RlZg==
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: security
      # 启用 v1/v2 客户端 API 兼容 (up.sh 配置同步与运维脚本依赖 v1 API)
      # 注: NACOS_CORE_API_* 环境变量不在 docker-startup.sh 白名单, 用 JAVA_TOOL_OPTIONS 注入
      # - 认证关闭时 admin API 仍需登录, 本地开发禁用便于 up.sh 脚本同步配置
      #
      # ⚠️【2026-10-05 P0 修正】这两个 JAVA_TOOL_OPTIONS 曾是**两个独立键**,
      #   YAML 重复键**后者静默覆盖前者** —— 语法合法、不报错、结果与意图相反(第五课)。
      #   实际后果已实测: `-Dnacos.core.auth.admin.enabled=false` 从未生效,
      #   而 deploy/up.sh 的配置同步走 v3 admin API:
      #     GET  /nacos/v3/admin/cs/config → 200 {"code":10001,"message":"access denied",
      #                                              "data":"Code: 401, ... User not found! ..."}
      #   即 **./deploy/up.sh --sync 一直是坏的**, 且现象与因果相隔三层。
      #   今后新增任何 env 键前必须先确认它在本段内**唯一**。
      JAVA_TOOL_OPTIONS: "-Dnacos.core.auth.admin.enabled=false -XX:MaxMetaspaceSize=256m -XX:CompressedClassSpaceSize=128m -XX:ReservedCodeCacheSize=128m -XX:MaxDirectMemorySize=128m"
      JVM_XMS: 1g
      JVM_XMX: 2g
      # ⚠️ 必须显式清空代理变量(2026-10-05)。不写则 rootless podman 会从宿主
      #   shell 继承 http_proxy=http://127.0.0.1:7890, 而宿主该端口无监听,
      #   容器内 127.0.0.1 指向自己 ⇒ 任何走 HTTP 客户端的外网请求都会失败。
      #   ⚠️ 别被 no_proxy 里那串 "127.*" 骗了: curl 不认这种通配写法,
      #   实测同容器内默认走代理 rc=7 失败, 而 --noproxy "*" 直连 code=200。
      # ⚠️ 6 个代理键**必须写全**(2026-10-06 实测): 早先只写了 5 个、漏了 NO_PROXY,
      #   而 rootless podman 会把宿主的 NO_PROXY 补进来 —— 实测容器内同时存在
      #   `no_proxy=*`(本文件设的) 与 `NO_PROXY=172.31.*,...`(继承的)。
      #   危害分级: 漏 http_proxy 是**有害**(会去连无监听的代理);
      #   漏 NO_PROXY 只是状态不干净(没有代理可用时排除表不会被读)。
      #   守护 deploy/tests/check_proxy_env.py 会把两者分别报出。
      http_proxy: ''
      https_proxy: ''
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      no_proxy: '*'
      NO_PROXY: '*'
      # ⚠️ 必须限制 Metaspace 等 native 预留（2026-10-05 实测）。
      #   未加限时 JVM 默认: CompressedClassSpace reserved 1GB + Metaspace 1.15GB。
      #   nacos 是 9 个 JVM 里预留最大的(实测 VmSize 10.5GB), 而
      #   vm.overcommit_memory=2 下**预留即计入全局 commit 预算** ——
      #   实测 Committed_AS 顶到 99.7% 时六个业务服务同秒崩溃,
      #   cgroup 的 oom 计数全为 0, 所以调 mem_limit 治不了。
      #
      # ⚠️【2026-10-05 二次修正】上一版注释写的是"真实可用的扩展点是
      #   JAVA_OPT_EXT" —— **那仍然只验证到"脚本引用了这个变量", 没验证
      #   参数真进了 JVM**。第二次踩的是同一个坑(第三课)。
      #
      #   JAVA_OPT_EXT 确实被 docker-startup.sh 第 152 行读取:
      #     JAVA_OPT="${JAVA_OPT} ${JAVA_OPT_EXT}"
      #   参数也确实出现在 /proc/1/cmdline 里。但**位置在 -jar 之后**,
      #   而 JVM 遇到 -jar 即停止解析选项 —— 其后参数被当作传给
      #   main() 的应用参数, 不是 VM flag。
      #
      #   决定性证据 (-XX:+PrintFlagsFinal 打印真实生效值):
      #     参数在 -jar 之后:  MaxMetaspaceSize = 18446744073709551615 {default}
      #                        CompressedClassSpaceSize = 1073741824    {default}
      #     参数在 -jar 之前:  MaxMetaspaceSize = 268435456 {command line}
      #   标记从 {default} 变 {command line} 才是生效, 光看 cmdline 不算。
      #   旁证: VmSize 只从 10.28GB 降到 10.19GB —— 默认 Metaspace 上限
      #   远大于 256m, 真生效应显著下降。
      #
      #   ⚠️ 为什么不能用报错判定: `java -XX:MaxMetaspaceSize=256m -jar
      #   x.jar` **不报** Unrecognized option, 只报 jarfile 不存在,
      #   即静默接受并丢弃。"没报错" 在这里是假信号。
      #
      #   ✅ 正解是 **JAVA_TOOL_OPTIONS** —— 由 JVM 自己解析, 与命令行
      #   位置无关。受控实验已验证: 同样的 flag 经它注入后标记为
      #   {environment} 且值为 268435456 / 134217728, 真实生效。
      #
      #   故断言必须建立在**数据流**上(compose env → 容器 env →
      #   JVM 生效值), 而不是"脚本里能不能搜到这个变量名"。
      #
      #   ⚠️【2026-10-05 补记】上述四个 -XX 曾单独占一个 JAVA_TOOL_OPTIONS 键,
      #   与上面那个 admin 开关**并存**。YAML 重复键静默取后者, 于是 admin
      #   开关被吞掉。现已合并为**唯一一个**键, 两个用途都在同一行。
      #   ⚠️ 新增 env 键时必须用结构化扫描确认唯一(见
      #   deploy/tests/check_resource_optimization.py 第 8 项)。
    volumes:
      - ./nacos/data:/home/nacos/data
    networks:
      - cloud-infra
    logging: *default-logging
    healthcheck:
      # Nacos 3.2+ 健康检查: Console 独立进程 (8080) 的 v3 readiness 端点
      # v1/v2 API (8848) 在 3.2+ 默认关闭兼容, 不能再作为探测源
      test: ["CMD", "curl", "-f", "http://localhost:8080/v3/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ========== 数据库 ==========
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-postgres
    mem_limit: 512m
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: cloud_infra
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须在 .env 中设置}
      # ⚠️ 必须显式清空代理变量(2026-10-06 实测补齐)。宿主 shell 带
      #   http_proxy=http://127.0.0.1:7890 而该端口无监听; rootless podman 会把它
      #   注入容器, 于是任何走 HTTP 客户端的请求都会指向一个不存在的代理。
      #   本服务当前日志里没有相关报错(客户端不走 http_proxy), 但"没报错"
      #   不是"配置正确" —— 依赖的是客户端实现细节, 换库就可能失效。
      http_proxy: ''
      https_proxy: ''
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      no_proxy: '*'
      NO_PROXY: '*'
      # ⚠️ 刻意**不改** PGDATA: 现有数据在 /var/lib/postgresql/data 下,
      #   改路径会让容器看不见旧数据并当成空库重新初始化 = 丢数据。
    # ⚠️ 2026-10-05 刷盘调优: **性能参数走 apply-postgres-tuning.sh 的
    #   ALTER SYSTEM, 不是 compose 的 command 段**（详见 volumes 处的说明）。
    #
    # 【踩坑记录 —— 两种更直观的方式都试过且都无效】
    #   1. compose `command: [postgres, -c, shared_buffers=192MB, ...]`
    #      容器实际 Cmd = ["postgres"], 5 个 -c **全被丢弃**。
    #   2. 环境变量 `PG_SHARED_BUFFERS=192MB`(官方文档说支持)
    #      实测**同样无效**, 读回仍是 128MB。该镜像 entrypoint 不做这个转换。
    #   ⇒ 两者都是"配置写了但运行时没生效"的假绿(第三条硬规则)。
    #
    # ⚠️ 关于第 1 条的**归因尚未查清, 别再沿用旧说法**:
    #   隔离测试证明 podman-compose 1.6.0 **是支持 `command` 的**(新起容器实测
    #   Cmd 正确带上了参数)。所以"该工具丢弃 command"这个解释**不成立**,
    #   本项目 compose 里参数丢失另有原因、尚未定位。
    #   ⚠️ 教训: 记踩坑记录时, **实测现象与推测原因必须分开写** ——
    #   我把"丢弃"当成了已验证的根因写进注释, 下一个信它的人会去改工具版本。
    #
    # 【根因（这才是已验证的）】postgresql.conf 里是**非注释的**
    #   `shared_buffers = 128MB`, 它在文件内的优先级高于任何外部传入。
    #   所以必须能改到最终生效的那份配置 ⇒ ALTER SYSTEM 最可靠。
    #
    # 【实测依据】两本账分离, 瓶颈在 I/O 不在内存:
    #   MemAvailable 常年 10.4GB; 而 /proc/diskstats 设备忙 48% 饱和,
    #   15 秒却只写 5.1MB → 平均单次写 9.5KB / 每秒 35 次 = 小块同步写。
    #   pg_stat_activity 有会话卡在 wait_event=IO|WALSync,
    #   且 checkpoint_sync_time 三次采样**完全不变** → 元凶是 WAL 同步提交。
    #
    # 【⚠️ 刻意不动 fsync / synchronous_commit】
    #   synchronous_commit=off 能把提交延迟降一个数量级, 但它**允许提交后
    #   立即断电丢数据**。这是耐久性取舍, 属用户决策, 不代选。
    #   需要时在 tuning-postgres.conf 追加一行即可(需 reload 或重启)。
    #
    # 【为什么 shared_buffers 只到 192MB 而不是 512MB】
    #   容器 mem_limit 是 512m, 而 shared_buffers 是**独占**内存。
    #   512m 会吃掉整个容器上限, 堆外(Native/线程栈)无处安放。
    #   192MB 让工作集装得下, 又留足余量。
    volumes:
      - pgdata:/var/lib/postgresql/data
      # ⚠️ postgres-tuning.conf **刻意不挂载进容器**（2026-10-05 运行时纠正）。
      #   它原先挂载在 /etc/postgresql/tuning.conf, 但 postgresql.conf 与
      #   postgresql.auto.conf 里**没有任何 include 指令**（容器内 grep 确认
      #   无输出）⇒ 那个挂载永远不会被读取, 属"机制存在但从未生效"。
      #   上面那句"以 include 方式挂载"是错的, 已删除。
      #
      #   唯一真实生效路径:
      #     up.sh → apply-postgres-tuning.sh → ALTER SYSTEM → postgresql.auto.conf
      #   要改调优参数, 请改 apply-postgres-tuning.sh 的期望值, 改这里无效。
      #   该文件保留为 apply 脚本的**输入源**(单一数据源), 不再是运行时配置。
      # 首次初始化时建 SkyWalking 存储库 (OAP 自 2026-10-04 用 postgresql 存储)。
      #   ⚠️ 该目录**只在数据目录为空时**执行一次 —— 已有 pgdata 卷的环境不会补跑。
      #     本机 pgdata 里 skywalking 库是手工建的, 与本脚本等价。
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - cloud-infra
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== 缓存 ==========
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-redis
    mem_limit: 256m
    ports:
      - "6379:6379"
    # ⚠️ 清空代理变量(2026-10-06 实测): 宿主 http_proxy 会被 rootless podman
    #   注入容器, 而该端口无监听。redis 自身不用它, 但哨兵/集群模式下的
    #   节点互联代码路径可能读得到 —— 依赖"恰好没用"不构成配置正确。
    environment:
      http_proxy: ''
      https_proxy: ''
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      no_proxy: '*'
      NO_PROXY: '*'
    volumes:
      - redisdata:/data
    networks:
      - cloud-infra
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ========== 消息队列 ==========
  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-rabbitmq
    mem_limit: 512m
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER 必须在 .env 中设置}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS 必须在 .env 中设置}
      # ⚠️ 清空代理变量(2026-10-06 实测)。management UI 的部分前端请求
      #   会走 HTTP 客户端, 继承了无监听的代理就会失败。
      http_proxy: ''
      https_proxy: ''
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      no_proxy: '*'
      NO_PROXY: '*'
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    networks:
      - cloud-infra
    logging: *default-logging
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ========== 搜索引擎 ==========
  elasticsearch:
    # ⚠️ 主版本必须与 ES 客户端对齐, 不能随手填。
    #   Spring Boot 4.1.0 的 BOM 指定 elasticsearch-client.version = 9.4.2
    #   （见 ~/.m2/.../spring-boot-dependencies-4.1.0.pom 的 <elasticsearch-client.version>）,
    #   而 9.x 客户端默认发送
    #     Accept/Content-Type: application/vnd.elasticsearch+json; compatible-with=9
    #   ES 8.x 服务端**直接拒绝**该头, 报 400:
    #     media_type_header_exception: Invalid media-type value on headers
    #     [Accept, Content-Type]
    #   然后 search 启动即失败（SimpleElasticsearchRepository 构造时
    #   createIndexAndMappingIfNeeded -> IndicesTemplate.exists）。
    #
    #   这个坑很隐蔽: 同一台 ES, curl HEAD /sys_oper_log 返回正常的 404,
    #   因为 curl 不发这两个头 —— 只有 Java 客户端会踩到。
    #   实测证据: 见 AGENTS.md「第六课补记: ES 版本不匹配伪装成客户端异常」。
    image: elasticsearch:9.0.3
    restart: unless-stopped
    stop_grace_period: 60s
    container_name: cloud-elasticsearch
    mem_limit: 1g
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      # ⚠️ 清空代理变量(2026-10-06 实测)。ES 的 Java 客户端读 http_proxy,
      #   继承宿主那个无监听的 127.0.0.1:7890 会让跨节点/插件请求失败。
      http_proxy: ''
      https_proxy: ''
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      no_proxy: '*'
      NO_PROXY: '*'
      ES_JAVA_OPTS: "-Xms512m -Xmx512m -XX:MaxMetaspaceSize=192m -XX:CompressedClassSpaceSize=96m -XX:ReservedCodeCacheSize=96m"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - cloud-infra
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 15s
      timeout: 10s
      retries: 10
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536

  # ========== 监控 ==========
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-prometheus
    mem_limit: 512m
    ports:
      - "9090:9090"
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      no_proxy: "*"
      NO_PROXY: "*"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus-rules/:/etc/prometheus/rules/:ro
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-lifecycle'
    networks:
      - cloud-infra
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:latest
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-alertmanager
    mem_limit: 128m
    ports:
      - "9093:9093"
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      no_proxy: "*"
      NO_PROXY: "*"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - cloud-infra
    logging: *default-logging

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-grafana
    mem_limit: 384m
    ports:
      - "3000:3000"
    environment:
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
      - no_proxy=*
      - NO_PROXY=*
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - cloud-infra
    logging: *default-logging

  # ========== 日志集中 ==========
  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-loki
    mem_limit: 384m
    ports:
      - "3100:3100"
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      no_proxy: "*"
      NO_PROXY: "*"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    networks:
      - cloud-infra
    logging: *default-logging

  promtail:
    image: grafana/promtail:3.4.2
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-promtail
    mem_limit: 256m
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      no_proxy: "*"
      NO_PROXY: "*"
    volumes:
      # podman rootless socket + 容器日志存储 (json-file)
      - /run/user/1000/podman/podman.sock:/var/run/docker.sock:ro
      - /home/zeron/.local/share/containers/storage/overlay-containers:/var/log/containers:ro
      - ./monitoring/promtail.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - cloud-infra
    logging: *default-logging

  # ========== 链路追踪 ==========
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-otel-collector
    mem_limit: 256m
    ports:
      - "4317:4317"
      - "4318:4318"
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      no_proxy: "*"
      NO_PROXY: "*"
    volumes:
      - ./monitoring/otel-collector.yml:/etc/otel/config.yml:ro
    command: ["--config=/etc/otel/config.yml"]
    networks:
      - cloud-infra
    logging: *default-logging

  jaeger:
    image: jaegertracing/all-in-one:latest
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-jaeger
    mem_limit: 512m
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # Jaeger collector HTTP
    environment:
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
      - no_proxy=*
      - NO_PROXY=*
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - cloud-infra
    logging: *default-logging

  # ========== SkyWalking APM (可选) ==========
  # 应用性能监控: 分布式追踪 + 慢 SQL/慢方法 + 服务拓扑 + 异常聚合
  # 与 Jaeger 并存: Jaeger 用 OTel 协议, SkyWalking 用 agent gRPC 协议
  # 业务模块 JVM agent 通过 SW_AGENT_ENABLED=true 启用
  skywalking-oap:
    # ✅ 2026-10-04: 存储从 elasticsearch 改为 **postgresql**, OAP 首次真正启动成功。
    #
    #   为什么必须换存储 (不是 OAP 版本问题):
    #     SkyWalking 官方文档(main)明确写 "ElasticSearch 7 and 8", **全系不支持 ES 9**。
    #     实测 OAP 10.1.0 + ES 9.0.3 → UnsupportedOperationException:
    #          Unsupported version: ElasticSearch 9.0
    #     而本仓库 ES 必须是 9.x: Spring Boot 4.1.0 的 BOM 指定
    #     elasticsearch-client.version=9.4.2, 9.x 客户端默认发
    #     `compatible-with=9` 头, ES 8.x 服务端直接报 400 media_type_header_exception。
    #     ⇒ **两个需求在版本上互斥**, 且都不能让步(search 降级客户端 = 改业务代码)。
    #
    #   为什么选 PostgreSQL 而不是方案 b (给 SkyWalking 单开一个 ES 8):
    #     方案 b 实测**不可用**(2026-10-04 复测, 推翻 10-03 记录的"技术前提成立"):
    #       OAP 连 ES 8 后版本冲突确实消除(日志 `ElasticSearch version is:
    #       ElasticSearch 8.18`), 但紧接着建 sw_segment-YYYYMMDD 索引时
    #       ResponseTimeoutException —— OAP 的 responseTimeout 是**硬编码 15000ms**,
    #       同一台机器上 load 已降到 5.68、iowait 0%、ES 无线程池拒绝、
    #       磁盘余 652GB, 直连 curl 建索引只要 3~6s (远小于 15s)。
    #       ⇒ 不是"机器慢", 是 OAP 连续 ~10 次模板/映射更新后紧接着的大 PUT
    #         超出了它的超时预算; 预热索引后重启复测**仍然超时**, 排除冷启动。
    #     PostgreSQL 方案实测 100% 通过: 64 张表建齐、gRPC 11800 监听、
    #     /healthcheck 200。且它复用已在运行的 postgres, **不新增容器与内存**。
    #
    #   代价(如实记录): OAP 的 trace/log 全文检索走 PostgreSQL 会比 ES 慢。
    #   本项目 SkyWalking 目前**零业务查询**(agent 注入已生效, 但没有任何人
    #   查过 trace), 该代价当前为零; 若将来接入 trace 查询且出现性能问题,
    #   再评估 BanyanDB(SkyWalking 原生推荐, 但需新增容器)。
    image: apache/skywalking-oap-server:10.1.0
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-skywalking-oap
    # ⚠️ 2026-10-04 调整: 1024m -> 2048m。
    #   依据是**实测事实**: 容器 RSS 长期贴着 98.3% 的原限额运行, 即原配置本身过紧。
    #   注意这不是 malloc 失败的原因 —— 2026-10-05 实测推翻了先前的归因:
    #   cloud-auth 堆外余量 384MB(远超任何合理阈值)照样 malloc 失败,
    #   而真正的原因是**宿主机全局 commit 预算**被多个 JVM 冲破
    #   (见 verify-e2e.sh 的 check_commit_budget 与那里的详细说明)。
    #   本项只消除"OAP 自身余量过紧"这个独立问题, 不声称能防住 malloc 失败。
    #   取 2048m: 与同级的 elasticsearch(1024m 限额 / 512m 堆) 相比留出足够余量,
    #   也与 system-module 的 2048m 同档。
    mem_limit: 2048m
    ports:
      - "11800:11800"  # gRPC agent 接收
      - "12800:12800"  # HTTP REST query
    volumes:
      - ./skywalking/config/application.yml:/skywalking/config/application.yml:ro
    # ✅ healthcheck 修正为 /healthcheck (2026-10-04)。
    #   原值 `/public/graph` 在 SkyWalking 10.x **恒返回 404** —— 该路径属于
    #   已被移除的 Deprecated GraphQL API。所以这个 healthcheck 从加上的
    #   第一天起就永远失败, 与 ES 冲突无关, 是**独立的第二处缺陷**。
    #   (deploy/skywalking/README.md 早就写着"返回 Status: 404",
    #    但没人把它和 compose 的 healthcheck 对上 —— 文档写了, 配置没改。)
    #
    #   `/healthcheck` 来自官方文档 (api/health-check):
    #     "make sure to set necessary configurations required by the health checker
    #      before using this endpoint, otherwise 404 will be returned."
    #   即**必须**同时把 health-checker 模块打开(SW_HEALTH_CHECKER=default),
    #   否则同样 404 —— 这是链上的第三处缺陷, 三个条件缺一不可:
    #       ① 路径是 /healthcheck   ② SW_HEALTH_CHECKER 已启用   ③ 端口 12800
    #   实测: 三者齐备 → 200; 缺 ② → 404。
    #
    #   ⚠️ 这是一个**浅层**探活: 停掉 postgres 后 OAP 日志确实打出
    #      `Health check fails`, 但 HTTP 仍返回 200(score=0 表示"无故障项",
    #      而非"全部检查通过")。故它能证明 **OAP 进程与 HTTP 服务已就绪**,
    #      **不能**证明存储持续可用。存储可用性由 postgres 自己的 healthcheck 负责。
    #      —— 依赖链上是 postgres(healthy) → oap(healthy), 两层各管一段。
    #
    #   探活失败重试 30 次 × 5s = 150s, 覆盖 OAP 首次初始化(建 64 张表)的耗时
    #   (实测冷启动约 100s)。
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:12800/healthcheck || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    environment:
      # ⚠️ 清空代理变量(2026-10-06 实测)。OAP 上报 gRPC/HTTP 与访问
      #   PostgreSQL 都可能经过 HTTP 客户端; 宿主那个无监听的代理是隐患。
      - http_proxy=
      - https_proxy=
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - no_proxy=*
      - NO_PROXY=*
      # SW 10.x 字段名: SW_CORE_GRPC_HOST (替换 9.6 的 SW_NODE_IP)
      # ⚠️ SW_STORAGE 的取值是**存储实现名**, 不是通用词。
      #   曾试 `SW_STORAGE=jdbc` → ProviderNotFoundException:
      #     "no provider found for module storage"。
      #   合法值: elasticsearch / postgresql / mysql / h2(镜像无 provider) / banyandb。
      - SW_STORAGE=postgresql
      - SW_JDBC_URL=jdbc:postgresql://cloud-postgres:5432/skywalking
      - SW_DATA_SOURCE_USER=${POSTGRES_USER:-postgres}
      - SW_DATA_SOURCE_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须在 .env 中设置}
      # 必须显式给地址: application.yml 里 postgresql 的默认值是
      #   jdbc:postgresql://localhost:5432/skywalking —— 那是**官方单机默认**,
      # 在 compose 网络里会连到自己容器内的 5432 → Connection refused。
      # 与 ES 的 SW_STORAGE_ES_CLUSTER_NODES 是同一类坑, 不能靠"默认值刚好对"。
      #
      # 注: 曾试过用 SW_ADMIN_SERVER= / SW_STATUS= ... 禁用 9.7.0 没有的
      # 6 个模块, **实测无效** —— 空值会让 ${VAR:default} 回落 default 而非置空。
      # 真正解法不是禁用, 而是让配置与镜像版本对齐(已改为官方 10.1.0 原版
      # application.yml), 故这些变量已删除。留在这里只会让人以为"配了就能禁用"。
      #
      # 打开 health-checker 模块, 否则 /healthcheck 恒 404(见上方 healthcheck 注释)。
      - SW_HEALTH_CHECKER=default
      - SW_CORE_GRPC_HOST=cloud-skywalking-oap
      - TZ=Asia/Shanghai
      - JAVA_OPTS=-Xms512m -Xmx1024m -XX:MaxMetaspaceSize=192m -XX:CompressedClassSpaceSize=96m -XX:ReservedCodeCacheSize=96m
      # 堆 1024m + 容器限额 2048m = 1024m 堆外余量, 供metaspace 与 300+ 线程栈使用。
    depends_on:
      # ⚠️ 依赖对象已随存储切换改为 postgres。
      #   保留指向 elasticsearch 会让 OAP 在 ES 慢启动时白等,
      #   而它的存储根本不碰 ES —— 依赖必须指向**它真正使用**的服务。
      postgres:
        condition: service_healthy
    networks:
      - cloud-infra
    logging: *default-logging

  skywalking-ui:
    # 与 skywalking-oap 保持同版本 (原为 10.2.0, OAP 是 9.7.0)。
    # OAP 本轮升到 10.1.0 后两者错开, 而 UI↔OAP 的 GraphQL 接口在小版本间
    # 可能有字段变更 —— 不实测就等于把风险留给下一个人。
    # 门禁只校验 OAP 的配置/镜像对齐, UI 版本由本注释 + 下方 verify-e2e.sh 覆盖。
    image: apache/skywalking-ui:10.1.0
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-skywalking-ui
    mem_limit: 512m
    ports:
      - "18080:8080"   # SkyWalking UI
    environment:
      # ⚠️ 清空代理变量(2026-10-06 实测)。UI 通过 HTTP 访问 OAP,
      #   继承宿主那个无监听的代理会直接请求失败。
      - http_proxy=
      - https_proxy=
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - no_proxy=*
      - NO_PROXY=*
      # ⚠️ 必须带 http:// 前缀 (2026-10-04 实测)。
      #   原值 `cloud-skywalking-oap:12800` 让 UI 启动即崩:
      #     Exception in thread "main" java.lang.NullPointerException: authority
      #   即 UI 用 URI 解析这个地址, 无 scheme ⇒ host 为 null ⇒ NPE。
      #   README 早前记的"UI 镜像 Up 但 HTTP 拒绝连接"就是这件事,
      #   当时误判为 "10.x UI 与 10.1 OAP hostname 兼容 issue"。
      #   单变量对照实测: 加 http:// → HTTP 200 / restarts=0;
      #                   不加      → NullPointerException: authority。
      - SW_OAP_ADDRESS=http://cloud-skywalking-oap:12800
      - SW_SERVER_LISTEN_IP=0.0.0.0
      - TZ=Asia/Shanghai
    depends_on:
      skywalking-oap:
        # 由 started 收紧为 healthy: UI 只有 OAP 的 /healthcheck 通过才有意义,
        # 否则会在 OAP 尚未就绪时启动失败并进入重启循环。
        condition: service_healthy
    networks:
      - cloud-infra
    logging: *default-logging

  # ========== 限流熔断控制台 ==========
  sentinel:
    image: bladex/sentinel-dashboard:1.8.9
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-sentinel
    mem_limit: 256m
    ports:
      - "8858:8858"
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      no_proxy: "*"
      NO_PROXY: "*"
      SENTINEL_DASHBOARD_SERVER: ":8858"
      SENTINEL_DASHBOARD_AUTH_USERNAME: sentinel
      SENTINEL_DASHBOARD_AUTH_PASSWORD: sentinel
    networks:
      - cloud-infra
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8858"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ========== 微服务（通过 --profile full 启用）==========
  gateway:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: cloud-infra-gateway/Dockerfile
    image: localhost/cloud-infra-gateway:latest
    container_name: cloud-gateway
    # ⚠️ restart 策略缺失是实测缺陷（2026-10-05）。
    #   六个业务服务原本**都没有** restart 键, 只有 nacos 有
    #   (`restart: unless-stopped`)。实测后果: commit 冲到 ~96% 时
    #   notification 以 exit=1 崩溃(`Native memory allocation (malloc)
    #   failed`, 即 JVM 的 hs_err), 而 `RestartCount=0` —— **不自愈**。
    #
    #   这不是"新功能", 是补齐与 nacos 不一致的行为: 其余 15 个容器
    #   崩溃后都会自动重启, 只有这 6 个静默退出, 观察窗口里表现为
    #   「服务凭空消失」而无任何日志线索。
    #
    #   注意 `unless-stopped` **不会**对抗宿主机资源枯竭: commit 持续
    #   满载时重启循环会立刻再崩(实测 auth 就出现过这种反复)。
    #   因此它只解决"偶发崩溃自愈", 不解决"环境容量不足" ——
    #   后者的正解仍是降低同时运行的服务数。
    restart: unless-stopped
    mem_limit: 640m
    ports:
      - "9000:9000"
      - "9301:9301"   # 管理端口 (ADR-008)
    environment:
      JAVA_OPTS: "-XX:+UseG1GC -Xmx256m -Xms128m -XX:+UseCompactObjectHeaders -XX:+ExitOnOutOfMemoryError -XX:+UseContainerSupport -XX:MaxMetaspaceSize=256m -XX:CompressedClassSpaceSize=64m -XX:ReservedCodeCacheSize=64m -XX:MaxDirectMemorySize=64m"
      SPRING_PROFILES_ACTIVE: dev
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: cloud-nacos:8848
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET 必须在 .env 中设置}
      # 网关对下游服务注入内部调用签名，下游 HeaderAuthenticationFilter 验签
      INTERNAL_CALL_SECRET: ${INTERNAL_CALL_SECRET:?INTERNAL_CALL_SECRET 必须在 .env 中设置}
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      no_proxy: "*"
      NO_PROXY: "*"
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: cloud-nacos:8848
      # SkyWalking agent (M7-01: 默认开启)
      SW_AGENT_ENABLED: "true"
      SW_AGENT_OAP: cloud-skywalking-oap:11800
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9301/management/health/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      # start_period 必须覆盖实测启动耗时, 否则会**误判 unhealthy**(真实语义见下)。
      # 实测 gateway 启动 128.1s(含 SkyWalking agent 装 transformer),
      # 而 start_period(20s) + interval(5s) * retries(5) = 45s 就判红。
      # 机制: start_period 结束后 Docker 才计数失败, 连续失败达 retries 即转 unhealthy。
      # ⚠️ unhealthy 并**非不可恢复**: 受控实验(临时容器, start_period=10s/interval=5s/retries=3,
      #    探测目标 70s 后才就绪)实测 FailingStreak 3→4→6→7→8, 于 55s 回到 healthy 且计数归零。
      #    故少配 start_period 的代价是"启动期被误标 unhealthy 的一段时间"而非永久卡死;
      #    但依赖 health 状态做门禁的编排会在这段时间拒绝流量, 冷启动越长越易误判, 故仍应配足。
      # 此值 = 实测 128.1s 留约 20% 余量; 调小前先重新读 'Started ... in N seconds'。
      # ⚠️ 实测值随宿主负载波动很大(notification 两次: 130.9s / 304.3s, 差 2.3 倍),
      #    故取最坏观测值并留余量 —— 少配会误判, 多配只是让判定晚点开始。
      start_period: 180s
    networks:
      - cloud-infra
    depends_on:
      nacos:
        condition: service_healthy
      # ⚠️ 必须是 service_started, **不能是 service_healthy** (2026-10-03 实测回退)。
      #   我曾把它改成 service_healthy, 理由是"OAP 起不来业务服务会被带崩",
      #   但那条因果链是**错的**, 实测证伪:
      #     - 应用代码对 OAP **无任何启动期依赖**:
      #       TracingAutoConfiguration 只提供虚拟线程 + MDC 传播, 不碰 OAP;
      #       全仓 `backend_service` 只出现在 agent-entrypoint.sh 一处。
      #     - SkyWalking agent 是 -javaagent 注入的**异步 gRPC 上报**,
      #       OAP 不可达只会丢 trace, 不阻塞应用启动。
      #     - 实测: OAP 处于 Exited 时, cloud-system 仍达到 healthy,
      #       /actuator/health 200, /sys/user/list 返回结构化 401 (鉴权正常)。
