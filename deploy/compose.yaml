services:
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: nacos-server
    environment:
      - PREFER_HOST_MODE=hostname
      - MODE=standalone
      - JVM_XMS=256m
      - JVM_XMX=256m
      - JVM_XMN=128m
    ports:
      - "8848:8848"
      - "9848:9848"
    expose:
      - "9848"
    volumes:
      - nacos_logs:/home/nacos/logs
      - nacos_data:/home/nacos/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/index.html"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  redis:
    image: redis:7.2-alpine
    container_name: redis-server
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-server
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: always

  postgres:
    image: postgres:16
    container_name: postgres-server
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=cloud_infra
      - TZ=Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.prod
      args:
        JAR_FILE: cloud-infra-gateway/target/cloud-infra-gateway-1.0.0-SNAPSHOT.jar
    container_name: cloud-gateway
    ports:
      - "9000:9000"
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./config/gateway-application.yml:/app/config/application.yml:ro
    environment:
      - SPRING_CONFIG_LOCATION=file:/app/config/application.yml
      - SPRING_CLOUD_NACOS_SERVER_ADDR=nacos:8848
      - SPRING_THREADS_VIRTUAL_ENABLED=true
      - SPRING_DATA_REDIS_HOST=redis-server
    deploy:
      resources:
        limits:
          memory: 512M
    labels:
      - "monitoring=true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always

  gateway-native:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.native
    container_name: cloud-gateway-native
    ports:
      - "9001:9000"
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./config/gateway-application.yml:/app/config/application.yml:ro
    environment:
      - SPRING_CONFIG_LOCATION=file:/app/config/application.yml
      - SPRING_CLOUD_NACOS_SERVER_ADDR=nacos:8848
      - SPRING_DATA_REDIS_HOST=redis-server
    deploy:
      resources:
        limits:
          memory: 256M
    restart: always

  auth:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.prod
      args:
        JAR_FILE: cloud-infra-auth/target/cloud-infra-auth-1.0.0-SNAPSHOT.jar
    container_name: cloud-auth
    ports:
      - "9201:9200"
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./config/auth-application.yml:/app/config/application.yml:ro
    environment:
      - SPRING_CONFIG_LOCATION=file:/app/config/application.yml
      - SPRING_CLOUD_NACOS_SERVER_ADDR=nacos:8848
      - SPRING_THREADS_VIRTUAL_ENABLED=true
      - SPRING_DATA_REDIS_HOST=redis-server
    deploy:
      resources:
        limits:
          memory: 512M
    labels:
      - "monitoring=true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always

  system:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.prod
      args:
        JAR_FILE: cloud-infra-modules/system-module/target/system-module-1.0.0-SNAPSHOT.jar
    container_name: cloud-system
    ports:
      - "9300:9300"
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_started
    volumes:
      - ./config/system-application.yml:/app/config/application.yml:ro
      - ./logs/system:/var/log/system
    environment:
      - SPRING_CONFIG_LOCATION=file:/app/config/application.yml
      - SPRING_CLOUD_NACOS_SERVER_ADDR=nacos:8848
      - SPRING_DATASOURCE_HOST=postgres-server
      - SPRING_DATASOURCE_PORT=5432
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_THREADS_VIRTUAL_ENABLED=true
      - SPRING_DATA_REDIS_HOST=redis-server
    deploy:
      resources:
        limits:
          memory: 768M
    labels:
      - "monitoring=true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9300/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always

  notification:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.prod
      args:
        JAR_FILE: cloud-infra-modules/notification-service/target/notification-service-1.0.0-SNAPSHOT.jar
    container_name: cloud-notification
    ports:
      - "9400:9400"
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    volumes:
      - ./config/notification-application.yml:/app/config/application.yml:ro
    environment:
      - SPRING_CONFIG_LOCATION=file:/app/config/application.yml
      - SPRING_CLOUD_NACOS_SERVER_ADDR=nacos:8848
      - SPRING_THREADS_VIRTUAL_ENABLED=true
      - SPRING_DATA_REDIS_HOST=redis-server
      - SPRING_RABBITMQ_HOST=rabbitmq-server
    deploy:
      resources:
        limits:
          memory: 512M
    labels:
      - "monitoring=true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9400/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always

  search:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.prod
      args:
        JAR_FILE: cloud-infra-modules/search-service/target/search-service-1.0.0-SNAPSHOT.jar
    container_name: cloud-search
    ports:
      - "9500:9500"
    depends_on:
      nacos:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./config/search-application.yml:/app/config/application.yml:ro
    environment:
      - SPRING_CONFIG_LOCATION=file:/app/config/application.yml
      - SPRING_CLOUD_NACOS_SERVER_ADDR=nacos:8848
      - SPRING_THREADS_VIRTUAL_ENABLED=true
    deploy:
      resources:
        limits:
          memory: 512M
    labels:
      - "monitoring=true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9500/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./services.json:/etc/prometheus/services.json
    restart: always

volumes:
  nacos_logs:
  nacos_data:
  redis_data:
  postgres_data:
