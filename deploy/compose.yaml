  gateway:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: cloud-infra-gateway/Dockerfile
    image: localhost/cloud-infra-gateway:latest
    container_name: cloud-gateway
    mem_limit: 640m
    ports:
      - "9000:9000"
      - "9301:9301"   # 管理端口 (ADR-008)
    environment:
      JAVA_OPTS: "-XX:+UseG1GC -Xmx320m -Xms128m -XX:+UseCompactObjectHeaders -XX:+ExitOnOutOfMemoryError -XX:+UseContainerSupport -XX:MaxMetaspaceSize=128m -XX:CompressedClassSpaceSize=64m -XX:ReservedCodeCacheSize=64m -XX:MaxDirectMemorySize=64m"
      SPRING_PROFILES_ACTIVE: dev
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: cloud-nacos:8848
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET 必须在 .env 中设置}
      # 网关对下游服务注入内部调用签名，下游 HeaderAuthenticationFilter 验签
      INTERNAL_CALL_SECRET: ${INTERNAL_CALL_SECRET:?INTERNAL_CALL_SECRET 必须在 .env 中设置}
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      no_proxy: "*"
      NO_PROXY: "*"
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: cloud-nacos:8848
      # SkyWalking agent (M7-01: 默认开启)
      SW_AGENT_ENABLED: "true"
      SW_AGENT_OAP: cloud-skywalking-oap:11800
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9301/management/health/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - cloud-infra
    depends_on:
      nacos:
        condition: service_healthy
      # ⚠️ 必须是 service_started, **不能是 service_healthy** (2026-10-03 实测回退)。
      #   我曾把它改成 service_healthy, 理由是"OAP 起不来业务服务会被带崩",
      #   但那条因果链是**错的**, 实测证伪:
      #     - 应用代码对 OAP **无任何启动期依赖**:
      #       TracingAutoConfiguration 只提供虚拟线程 + MDC 传播, 不碰 OAP;
      #       全仓 `backend_service` 只出现在 agent-entrypoint.sh 一处。
      #     - SkyWalking agent 是 -javaagent 注入的**异步 gRPC 上报**,
      #       OAP 不可达只会丢 trace, 不阻塞应用启动。
      #     - 实测: OAP 处于 Exited 时, cloud-system 仍达到 healthy,
