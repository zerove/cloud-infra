# Cloud-Infra 全套环境声明
# 基础设施:  podman-compose -f deploy/compose.yaml up -d                    (仅启动 nacos/postgres/redis/rabbitmq/es/prometheus)
# 全套环境:   podman-compose -f deploy/compose.yaml --profile full up -d    (基础设施 + 所有微服务)
# 单微服务:   podman-compose -f deploy/compose.yaml --profile full up gateway
#
# 先构建:  mvn clean package -DskipTests
# podman-compose 直接 build 需要 podman 有 Docker-compatible build 能力

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ========== 注册中心 & 配置中心 ==========
  nacos:
    image: nacos/nacos-server:v3.2.3
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-nacos
    mem_limit: 768m
    ports:
      - "8848:8848"
      - "9848:9848"
      # Nacos 3.x 控制台独立端口 (nacos.console.port=8080)
      - "8080:8080"
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_TOKEN: c2VjcmV0VG9rZW4xMjM0NTY3ODkwYWJjZGVmMTIzNDU2Nzg5MGFiY2RlZg==
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: security
      # 启用 v1/v2 客户端 API 兼容 (up.sh 配置同步与运维脚本依赖 v1 API)
      # 注: NACOS_CORE_API_* 环境变量不在 docker-startup.sh 白名单, 用 JAVA_TOOL_OPTIONS 注入
      # - 认证关闭时 admin API 仍需登录, 本地开发禁用便于 up.sh 脚本同步配置
      JAVA_TOOL_OPTIONS: "-Dnacos.core.auth.admin.enabled=false"
      JVM_XMS: 256m
      JVM_XMX: 512m
    volumes:
      - ./nacos/data:/home/nacos/data
    networks:
      - cloud-infra
    logging: *default-logging
    healthcheck:
      # Nacos 3.2+ 健康检查: Console 独立进程 (8080) 的 v3 readiness 端点
      # v1/v2 API (8848) 在 3.2+ 默认关闭兼容, 不能再作为探测源
      test: ["CMD", "curl", "-f", "http://localhost:8080/v3/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ========== 数据库 ==========
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-postgres
    mem_limit: 512m
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: cloud_infra
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须在 .env 中设置}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - cloud-infra
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== 缓存 ==========
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-redis
    mem_limit: 256m
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - cloud-infra
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ========== 消息队列 ==========
  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-rabbitmq
    mem_limit: 512m
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER 必须在 .env 中设置}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS 必须在 .env 中设置}
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    networks:
      - cloud-infra
    logging: *default-logging
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ========== 搜索引擎 ==========
  elasticsearch:
    image: elasticsearch:8.18.0
    restart: unless-stopped
    stop_grace_period: 60s
    container_name: cloud-elasticsearch
    mem_limit: 1g
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - cloud-infra
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 15s
      timeout: 10s
      retries: 10
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536

  # ========== 监控 ==========
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-prometheus
    mem_limit: 512m
    ports:
      - "9090:9090"
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      no_proxy: "*"
      NO_PROXY: "*"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus-rules/:/etc/prometheus/rules/:ro
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-lifecycle'
    networks:
      - cloud-infra
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:latest
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-alertmanager
    mem_limit: 128m
    ports:
      - "9093:9093"
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      no_proxy: "*"
      NO_PROXY: "*"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - cloud-infra
    logging: *default-logging

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-grafana
    mem_limit: 384m
    ports:
      - "3000:3000"
    environment:
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
      - no_proxy=*
      - NO_PROXY=*
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - cloud-infra
    logging: *default-logging

  # ========== 日志集中 ==========
  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-loki
    mem_limit: 384m
    ports:
      - "3100:3100"
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      no_proxy: "*"
      NO_PROXY: "*"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    networks:
      - cloud-infra
    logging: *default-logging

  promtail:
    image: grafana/promtail:3.4.2
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-promtail
    mem_limit: 256m
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      no_proxy: "*"
      NO_PROXY: "*"
    volumes:
      # podman rootless socket + 容器日志存储 (json-file)
      - /run/user/1000/podman/podman.sock:/var/run/docker.sock:ro
      - /home/zeron/.local/share/containers/storage/overlay-containers:/var/log/containers:ro
      - ./monitoring/promtail.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - cloud-infra
    logging: *default-logging

  # ========== 链路追踪 ==========
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-otel-collector
    mem_limit: 256m
    ports:
      - "4317:4317"
      - "4318:4318"
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      no_proxy: "*"
      NO_PROXY: "*"
    volumes:
      - ./monitoring/otel-collector.yml:/etc/otel/config.yml:ro
    command: ["--config=/etc/otel/config.yml"]
    networks:
      - cloud-infra
    logging: *default-logging

  jaeger:
    image: jaegertracing/all-in-one:latest
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-jaeger
    mem_limit: 512m
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # Jaeger collector HTTP
    environment:
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
      - no_proxy=*
      - NO_PROXY=*
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - cloud-infra
    logging: *default-logging

  # ========== SkyWalking APM (可选) ==========
  # 应用性能监控: 分布式追踪 + 慢 SQL/慢方法 + 服务拓扑 + 异常聚合
  # 与 Jaeger 并存: Jaeger 用 OTel 协议, SkyWalking 用 agent gRPC 协议
  # 业务模块 JVM agent 通过 SW_AGENT_ENABLED=true 启用
  skywalking-oap:
    image: apache/skywalking-oap-server:9.7.0
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-skywalking-oap
    mem_limit: 1024m
    ports:
      - "11800:11800"  # gRPC agent 接收
      - "12800:12800"  # HTTP REST query
    volumes:
      - ./skywalking/config/application.yml:/skywalking/config/application.yml:ro
    environment:
      # SW 10.x 字段名: SW_CORE_GRPC_HOST (替换 9.6 的 SW_NODE_IP)
      - SW_STORAGE=h2
      - SW_CORE_GRPC_HOST=cloud-skywalking-oap
      - TZ=Asia/Shanghai
      - JAVA_OPTS=-Xms512m -Xmx1024m
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - cloud-infra
    logging: *default-logging

  skywalking-ui:
    image: apache/skywalking-ui:10.2.0
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-skywalking-ui
    mem_limit: 512m
    ports:
      - "18080:8080"   # SkyWalking UI
    environment:
      - SW_OAP_ADDRESS=cloud-skywalking-oap:12800
      - SW_SERVER_LISTEN_IP=0.0.0.0
      - TZ=Asia/Shanghai
    depends_on:
      - skywalking-oap
    networks:
      - cloud-infra
    logging: *default-logging

  # ========== 限流熔断控制台 ==========
  sentinel:
    image: bladex/sentinel-dashboard:1.8.9
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-sentinel
    mem_limit: 256m
    ports:
      - "8858:8858"
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      no_proxy: "*"
      NO_PROXY: "*"
      SENTINEL_DASHBOARD_SERVER: ":8858"
      SENTINEL_DASHBOARD_AUTH_USERNAME: sentinel
      SENTINEL_DASHBOARD_AUTH_PASSWORD: sentinel
    networks:
      - cloud-infra
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8858"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ========== 微服务（通过 --profile full 启用）==========
  gateway:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: cloud-infra-gateway/Dockerfile
    image: localhost/cloud-infra-gateway:latest
    container_name: cloud-gateway
    mem_limit: 448m
    ports:
      - "9000:9000"
      - "9301:9301"   # 管理端口 (ADR-008)
    environment:
      JAVA_OPTS: "-XX:+UseG1GC -Xmx320m -Xms128m -XX:+UseCompactObjectHeaders -XX:+ExitOnOutOfMemoryError -XX:+UseContainerSupport"
      SPRING_PROFILES_ACTIVE: dev
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: cloud-nacos:8848
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET 必须在 .env 中设置}
      # 网关对下游服务注入内部调用签名，下游 HeaderAuthenticationFilter 验签
      INTERNAL_CALL_SECRET: ${INTERNAL_CALL_SECRET:?INTERNAL_CALL_SECRET 必须在 .env 中设置}
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      no_proxy: "*"
      NO_PROXY: "*"
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: cloud-nacos:8848
      # SkyWalking agent (M7-01: 默认开启)
      SW_AGENT_ENABLED: "true"
      SW_AGENT_OAP: cloud-skywalking-oap:11800
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9301/management/health/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - cloud-infra
    depends_on:
      nacos:
        condition: service_healthy
      skywalking-oap:
        condition: service_started
      redis:
        condition: service_healthy
    logging: *default-logging

  auth:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: cloud-infra-auth/Dockerfile
    image: localhost/cloud-infra-auth:latest
    container_name: cloud-auth
    mem_limit: 576m
    ports:
      - "8081:8081"
      - "9302:9301"   # 管理端口 (ADR-008)
    environment:
      JAVA_OPTS: "-XX:+UseG1GC -Xmx384m -Xms128m -XX:+UseCompactObjectHeaders -XX:+ExitOnOutOfMemoryError -XX:+UseContainerSupport"
      SPRING_PROFILES_ACTIVE: dev
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: cloud-nacos:8848
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET 必须在 .env 中设置}
      # 服务间签名密钥，FeignAuthInterceptor 调 system 等下游服务时使用
      INTERNAL_CALL_SECRET: ${INTERNAL_CALL_SECRET:?INTERNAL_CALL_SECRET 必须在 .env 中设置}
      # H5: E2E 固定验证码，仅本地 e2e 在 .env 中设为 1234 等值；留空则走真实验证码
      AUTH_CAPTCHA_FIXED_CODE: ${AUTH_CAPTCHA_FIXED_CODE:-}
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      no_proxy: "*"
      NO_PROXY: "*"
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: cloud-nacos:8848
      # SkyWalking agent (M7-01: 默认开启)
      SW_AGENT_ENABLED: "true"
      SW_AGENT_OAP: cloud-skywalking-oap:11800
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9301/management/health/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - cloud-infra
    depends_on:
      nacos:
        condition: service_healthy
      skywalking-oap:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  system:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: cloud-infra-modules/system-module/Dockerfile
    image: localhost/cloud-infra-system:latest
    container_name: cloud-system
    # 2026-09-01 P0-3b 验证: 768m 触发 Spring Boot 4.1 + Caffeine 3.x + JDK 25 ClassLoader 死锁
    # 2GB heap + --enable-native-access=ALL-UNNAMED 实测 86.19s 启动成功
    # 详见 docs/perf/2026-09-01-p0-3b-verify.md
    mem_limit: 2g
    ports:
      - "8082:8082"
    environment:
      JAVA_OPTS: "-XX:+UseG1GC -Xmx1536m -Xms512m -XX:+UseCompactObjectHeaders -XX:+ExitOnOutOfMemoryError -XX:+UseContainerSupport --enable-native-access=ALL-UNNAMED"
      SPRING_PROFILES_ACTIVE: dev
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: cloud-nacos:8848
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET 必须在 .env 中设置}
      # 服务间签名密钥，FeignAuthInterceptor 与 HeaderAuthenticationFilter 验签使用
      INTERNAL_CALL_SECRET: ${INTERNAL_CALL_SECRET:?INTERNAL_CALL_SECRET 必须在 .env 中设置}
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      no_proxy: "*"
      NO_PROXY: "*"
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: cloud-nacos:8848
      # SkyWalking agent (M7-01: 默认开启)
      SW_AGENT_ENABLED: "true"
      SW_AGENT_OAP: cloud-skywalking-oap:11800
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9301/management/health/readiness || exit 1"]
      # 宽松探针: 应用启动需数分钟, 就绪前频繁探测会触发并发类加载(与 Nacos 注册抢 fat jar 锁)导致死锁
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 240s
    networks:
      - cloud-infra
    depends_on:
      nacos:
        condition: service_healthy
      skywalking-oap:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  file:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: cloud-infra-modules/file-service/Dockerfile
    image: localhost/cloud-infra-file:latest
    container_name: cloud-file
    mem_limit: 448m
    ports:
      - "8083:8083"
      - "9304:9301"   # 管理端口 (ADR-008)
    environment:
      JAVA_OPTS: "-XX:+UseG1GC -Xmx320m -Xms128m -XX:+UseCompactObjectHeaders -XX:+ExitOnOutOfMemoryError -XX:+UseContainerSupport"
      SPRING_PROFILES_ACTIVE: dev
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: cloud-nacos:8848
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET 必须在 .env 中设置}
      # 服务间签名密钥，FeignAuthInterceptor 与 HeaderAuthenticationFilter 验签使用
      INTERNAL_CALL_SECRET: ${INTERNAL_CALL_SECRET:?INTERNAL_CALL_SECRET 必须在 .env 中设置}
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      no_proxy: "*"
      NO_PROXY: "*"
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: cloud-nacos:8848
      # SkyWalking agent (M7-01: 默认开启)
      SW_AGENT_ENABLED: "true"
      SW_AGENT_OAP: cloud-skywalking-oap:11800
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9301/management/health/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - cloud-infra
    depends_on:
      nacos:
        condition: service_healthy
      skywalking-oap:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  notification:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: cloud-infra-modules/notification-service/Dockerfile
    image: localhost/cloud-infra-notification:latest
    container_name: cloud-notification
    mem_limit: 448m
    ports:
      - "8084:8084"
      - "9305:9301"   # 管理端口 (ADR-008)
    environment:
      JAVA_OPTS: "-XX:+UseG1GC -Xmx320m -Xms128m -XX:+UseCompactObjectHeaders -XX:+ExitOnOutOfMemoryError -XX:+UseContainerSupport"
      SPRING_PROFILES_ACTIVE: dev
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: cloud-nacos:8848
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET 必须在 .env 中设置}
      # 服务间签名密钥，FeignAuthInterceptor 与 HeaderAuthenticationFilter 验签使用
      INTERNAL_CALL_SECRET: ${INTERNAL_CALL_SECRET:?INTERNAL_CALL_SECRET 必须在 .env 中设置}
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      no_proxy: "*"
      NO_PROXY: "*"
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: cloud-nacos:8848
      # SkyWalking agent (M7-01: 默认开启)
      SW_AGENT_ENABLED: "true"
      SW_AGENT_OAP: cloud-skywalking-oap:11800
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9301/management/health/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - cloud-infra
    depends_on:
      nacos:
        condition: service_healthy
      skywalking-oap:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    logging: *default-logging

  search:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: cloud-infra-modules/search-service/Dockerfile
    image: localhost/cloud-infra-search:latest
    container_name: cloud-search
    mem_limit: 448m
    ports:
      - "8085:8085"
      - "9306:9301"   # 管理端口 (ADR-008)
    environment:
      JAVA_OPTS: "-XX:+UseG1GC -Xmx320m -Xms128m -XX:+UseCompactObjectHeaders -XX:+ExitOnOutOfMemoryError -XX:+UseContainerSupport"
      SPRING_PROFILES_ACTIVE: dev
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: cloud-nacos:8848
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET 必须在 .env 中设置}
      # 服务间签名密钥，FeignAuthInterceptor 与 HeaderAuthenticationFilter 验签使用
      INTERNAL_CALL_SECRET: ${INTERNAL_CALL_SECRET:?INTERNAL_CALL_SECRET 必须在 .env 中设置}
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      no_proxy: "*"
      NO_PROXY: "*"
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: cloud-nacos:8848
      # SkyWalking agent (M7-01: 默认开启)
      SW_AGENT_ENABLED: "true"
      SW_AGENT_OAP: cloud-skywalking-oap:11800
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9301/management/health/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - cloud-infra
    depends_on:
      nacos:
        condition: service_healthy
      skywalking-oap:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    logging: *default-logging

  minio:
    image: minio/minio:latest
    container_name: cloud-minio
    mem_limit: 512m
    ports:
      - "9010:9000"
      - "9011:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER 必须在 .env 中设置}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD 必须在 .env 中设置}
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    networks:
      - cloud-infra
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  redisinsight:
    image: redis/redisinsight:latest
    container_name: cloud-redisinsight
    mem_limit: 256m
    ports:
      - "5540:5540"
    networks:
      - cloud-infra
    logging: *default-logging

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  esdata:
  grafana-data:
  loki-data:
  miniodata:

networks:
  cloud-infra:
    name: cloud-infra
