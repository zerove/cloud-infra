      no_proxy: "*"
      NO_PROXY: "*"
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: cloud-nacos:8848
      # SkyWalking agent (M7-01: 默认开启)
      SW_AGENT_ENABLED: "true"
      SW_AGENT_OAP: cloud-skywalking-oap:11800
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9301/management/health/readiness || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - cloud-infra
    depends_on:
      nacos:
        condition: service_healthy
      # ⚠️ 必须是 service_started, **不能是 service_healthy** (2026-10-03 实测回退)。
      #   我曾把它改成 service_healthy, 理由是"OAP 起不来业务服务会被带崩",
      #   但那条因果链是**错的**, 实测证伪:
      #     - 应用代码对 OAP **无任何启动期依赖**:
      #       TracingAutoConfiguration 只提供虚拟线程 + MDC 传播, 不碰 OAP;
      #       全仓 `backend_service` 只出现在 agent-entrypoint.sh 一处。
      #     - SkyWalking agent 是 -javaagent 注入的**异步 gRPC 上报**,
      #       OAP 不可达只会丢 trace, 不阻塞应用启动。
      #     - 实测: OAP 处于 Exited 时, cloud-system 仍达到 healthy,
      #       /actuator/health 200, /sys/user/list 返回结构化 401 (鉴权正常)。
      #   ⇒ 把可观测性组件的可用性当成业务启动前提, 是我自己造的阻塞。
      #     OAP 崩溃应当**只影响可观测性**, 不影响业务可用性 ——
      #     这正是可观测性组件该有的隔离性。
      #   保留 OAP 自身对 elasticsearch 的 service_healthy (那才是真依赖)。
      skywalking-oap:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    logging: *default-logging

  minio:
    image: minio/minio:latest
    container_name: cloud-minio
    mem_limit: 512m
    ports:
      - "9010:9000"
      - "9011:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER 必须在 .env 中设置}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD 必须在 .env 中设置}
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    networks:
      - cloud-infra
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  redisinsight:
    image: redis/redisinsight:latest
    container_name: cloud-redisinsight
    mem_limit: 256m
    ports:
      - "5540:5540"
    networks:
      - cloud-infra
    logging: *default-logging

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  esdata:
  grafana-data:
  loki-data:
  miniodata:

networks:
  cloud-infra:
    name: cloud-infra
