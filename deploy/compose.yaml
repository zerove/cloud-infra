# Cloud-Infra 全套环境声明
# 基础设施:  podman-compose -f deploy/compose.yaml up -d                    (仅启动 nacos/postgres/redis/rabbitmq/es/prometheus)
# 全套环境:   podman-compose -f deploy/compose.yaml --profile full up -d    (基础设施 + 所有微服务)
# 单微服务:   podman-compose -f deploy/compose.yaml --profile full up gateway
#
# 先构建:  mvn clean package -DskipTests
# podman-compose 直接 build 需要 podman 有 Docker-compatible build 能力

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ========== 注册中心 & 配置中心 ==========
  nacos:
    image: nacos/nacos-server:v3.2.3
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-nacos
    # ⚠️ 堆下限 1g / 上限 2g 不是随手填的, 是**实验收敛**出来的 (2026-10-03)。
    #
    # 现象: Nacos 崩溃重启循环 30+ 次, 每次 exit=0 / oom=false, 报
    #   java.sql.SQLTimeoutException: Login timeout exceeded
    #   ERROR XBDA0: Login timeout exceeded
    #   → load derby-schema.sql error
    # 然后下一轮变成
    #   ERROR XBM0A: The database directory '.../derby-data' exists.
    #   However, it does not contain the expected 'service.properties' file.
    # 于是形成**自锁**: 第一轮建库失败留下半成品目录, 第二轮起再也不会成功。
    #
    # Derby 报错很有迷惑性 —— 它说的是"目录已存在", 看着像环境残留,
    # 但清空目录后**第一轮**照样失败。真实原因在更下面一层:
    # seg0/c10.dat 等段文件其实已写入(非空 8KB), 说明 Derby 真的启动了,
    # 只是在最后写 service.properties 前被拖过了 boot 的 login 超时。
    #
    # 逐项排除的假设(每一项都真跑过, 不是推理):
    #   mem_limit 768m -> 2g          仍失败 ⇒ 不是内存不足
    #   bind mount    -> 命名卷        仍失败 ⇒ 不是 bind 挂载/文件锁
    #   -Xmn512m      -> -Xmn170m      仍失败 ⇒ 不是 -Xmn == -Xmx
    #   -Xms256m/-Xmx512m -> 1g/2g   ✅ service.properties 生成, Nacos 正常启动
    #
    # 即**堆太小, Derby 建库在超时内完不成**。镜像脚本自己拼的是
    # `-Xms256m -Xmx512m -Xmn512m`(见容器日志), 官方默认 -Xms1g —— 本项目此前配的
    # 恰好只有官方的 1/4。mem_limit 必须 >= Xmx + metaspace + 线程栈, 故取 4g。
    mem_limit: 4g
    ports:
      - "8848:8848"
      - "9848:9848"
      # Nacos 3.x 控制台独立端口 (nacos.console.port=8080)
      - "8080:8080"
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_TOKEN: c2VjcmV0VG9rZW4xMjM0NTY3ODkwYWJjZGVmMTIzNDU2Nzg5MGFiY2RlZg==
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: security
      # 启用 v1/v2 客户端 API 兼容 (up.sh 配置同步与运维脚本依赖 v1 API)
      # 注: NACOS_CORE_API_* 环境变量不在 docker-startup.sh 白名单, 用 JAVA_TOOL_OPTIONS 注入
      # - 认证关闭时 admin API 仍需登录, 本地开发禁用便于 up.sh 脚本同步配置
      JAVA_TOOL_OPTIONS: "-Dnacos.core.auth.admin.enabled=false"
      JVM_XMS: 1g
      JVM_XMX: 2g
      # ⚠️ 必须限制 Metaspace 等 native 预留（2026-10-05 实测）。
      #   未加限时 JVM 默认: CompressedClassSpace reserved 1GB + Metaspace 1.15GB。
      #   nacos 是 9 个 JVM 里 RSS 最大的(实测 1.45GiB / VmSize 10.5GB),
      #   而 vm.overcommit_memory=2 下**预留即计入全局 commit 预算** ——
      #   实测 Committed_AS 顶到 99.7% 时六个业务服务同秒崩溃,
      #   cgroup 的 oom 计数全为 0, 所以调 mem_limit 治不了。
      #   JVM_ADJUST 是 nacos 官方 start-up.sh 用来追加额外 JVM 参数的变量。
      JVM_ADJUST: "-XX:MaxMetaspaceSize=256m -XX:CompressedClassSpaceSize=128m -XX:ReservedCodeCacheSize=128m -XX:MaxDirectMemorySize=128m"
    volumes:
      - ./nacos/data:/home/nacos/data
    networks:
      - cloud-infra
    logging: *default-logging
    healthcheck:
      # Nacos 3.2+ 健康检查: Console 独立进程 (8080) 的 v3 readiness 端点
      # v1/v2 API (8848) 在 3.2+ 默认关闭兼容, 不能再作为探测源
      test: ["CMD", "curl", "-f", "http://localhost:8080/v3/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ========== 数据库 ==========
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-postgres
    mem_limit: 512m
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: cloud_infra
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须在 .env 中设置}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 首次初始化时建 SkyWalking 存储库 (OAP 自 2026-10-04 用 postgresql 存储)。
      #   ⚠️ 该目录**只在数据目录为空时**执行一次 —— 已有 pgdata 卷的环境不会补跑。
      #     本机 pgdata 里 skywalking 库是手工建的, 与本脚本等价。
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - cloud-infra
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== 缓存 ==========
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-redis
    mem_limit: 256m
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - cloud-infra
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ========== 消息队列 ==========
  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-rabbitmq
    mem_limit: 512m
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER 必须在 .env 中设置}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS 必须在 .env 中设置}
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    networks:
      - cloud-infra
    logging: *default-logging
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ========== 搜索引擎 ==========
  elasticsearch:
    # ⚠️ 主版本必须与 ES 客户端对齐, 不能随手填。
    #   Spring Boot 4.1.0 的 BOM 指定 elasticsearch-client.version = 9.4.2
    #   （见 ~/.m2/.../spring-boot-dependencies-4.1.0.pom 的 <elasticsearch-client.version>）,
    #   而 9.x 客户端默认发送
    #     Accept/Content-Type: application/vnd.elasticsearch+json; compatible-with=9
    #   ES 8.x 服务端**直接拒绝**该头, 报 400:
    #     media_type_header_exception: Invalid media-type value on headers
    #     [Accept, Content-Type]
    #   然后 search 启动即失败（SimpleElasticsearchRepository 构造时
    #   createIndexAndMappingIfNeeded -> IndicesTemplate.exists）。
    #
    #   这个坑很隐蔽: 同一台 ES, curl HEAD /sys_oper_log 返回正常的 404,
    #   因为 curl 不发这两个头 —— 只有 Java 客户端会踩到。
    #   实测证据: 见 AGENTS.md「第六课补记: ES 版本不匹配伪装成客户端异常」。
    image: elasticsearch:9.0.3
    restart: unless-stopped
    stop_grace_period: 60s
    container_name: cloud-elasticsearch
    mem_limit: 1g
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m -XX:MaxMetaspaceSize=192m -XX:CompressedClassSpaceSize=96m -XX:ReservedCodeCacheSize=96m"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - cloud-infra
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 15s
      timeout: 10s
      retries: 10
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536

  # ========== 监控 ==========
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-prometheus
    mem_limit: 512m
    ports:
      - "9090:9090"
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      no_proxy: "*"
      NO_PROXY: "*"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus-rules/:/etc/prometheus/rules/:ro
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-lifecycle'
    networks:
      - cloud-infra
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:latest
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-alertmanager
    mem_limit: 128m
    ports:
      - "9093:9093"
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      no_proxy: "*"
      NO_PROXY: "*"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - cloud-infra
    logging: *default-logging

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-grafana
    mem_limit: 384m
    ports:
      - "3000:3000"
    environment:
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
      - no_proxy=*
      - NO_PROXY=*
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - cloud-infra
    logging: *default-logging

  # ========== 日志集中 ==========
  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-loki
    mem_limit: 384m
    ports:
      - "3100:3100"
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      no_proxy: "*"
      NO_PROXY: "*"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    networks:
      - cloud-infra
    logging: *default-logging

  promtail:
    image: grafana/promtail:3.4.2
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-promtail
    mem_limit: 256m
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      no_proxy: "*"
      NO_PROXY: "*"
    volumes:
      # podman rootless socket + 容器日志存储 (json-file)
      - /run/user/1000/podman/podman.sock:/var/run/docker.sock:ro
      - /home/zeron/.local/share/containers/storage/overlay-containers:/var/log/containers:ro
      - ./monitoring/promtail.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - cloud-infra
    logging: *default-logging

  # ========== 链路追踪 ==========
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-otel-collector
    mem_limit: 256m
    ports:
      - "4317:4317"
      - "4318:4318"
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      no_proxy: "*"
      NO_PROXY: "*"
    volumes:
      - ./monitoring/otel-collector.yml:/etc/otel/config.yml:ro
    command: ["--config=/etc/otel/config.yml"]
    networks:
      - cloud-infra
    logging: *default-logging

  jaeger:
    image: jaegertracing/all-in-one:latest
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-jaeger
    mem_limit: 512m
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # Jaeger collector HTTP
    environment:
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
      - no_proxy=*
      - NO_PROXY=*
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - cloud-infra
    logging: *default-logging

  # ========== SkyWalking APM (可选) ==========
  # 应用性能监控: 分布式追踪 + 慢 SQL/慢方法 + 服务拓扑 + 异常聚合
  # 与 Jaeger 并存: Jaeger 用 OTel 协议, SkyWalking 用 agent gRPC 协议
  # 业务模块 JVM agent 通过 SW_AGENT_ENABLED=true 启用
  skywalking-oap:
    # ✅ 2026-10-04: 存储从 elasticsearch 改为 **postgresql**, OAP 首次真正启动成功。
    #
    #   为什么必须换存储 (不是 OAP 版本问题):
    #     SkyWalking 官方文档(main)明确写 "ElasticSearch 7 and 8", **全系不支持 ES 9**。
    #     实测 OAP 10.1.0 + ES 9.0.3 → UnsupportedOperationException:
    #          Unsupported version: ElasticSearch 9.0
    #     而本仓库 ES 必须是 9.x: Spring Boot 4.1.0 的 BOM 指定
    #     elasticsearch-client.version=9.4.2, 9.x 客户端默认发
    #     `compatible-with=9` 头, ES 8.x 服务端直接报 400 media_type_header_exception。
    #     ⇒ **两个需求在版本上互斥**, 且都不能让步(search 降级客户端 = 改业务代码)。
    #
    #   为什么选 PostgreSQL 而不是方案 b (给 SkyWalking 单开一个 ES 8):
    #     方案 b 实测**不可用**(2026-10-04 复测, 推翻 10-03 记录的"技术前提成立"):
    #       OAP 连 ES 8 后版本冲突确实消除(日志 `ElasticSearch version is:
    #       ElasticSearch 8.18`), 但紧接着建 sw_segment-YYYYMMDD 索引时
    #       ResponseTimeoutException —— OAP 的 responseTimeout 是**硬编码 15000ms**,
    #       同一台机器上 load 已降到 5.68、iowait 0%、ES 无线程池拒绝、
    #       磁盘余 652GB, 直连 curl 建索引只要 3~6s (远小于 15s)。
    #       ⇒ 不是"机器慢", 是 OAP 连续 ~10 次模板/映射更新后紧接着的大 PUT
    #         超出了它的超时预算; 预热索引后重启复测**仍然超时**, 排除冷启动。
    #     PostgreSQL 方案实测 100% 通过: 64 张表建齐、gRPC 11800 监听、
    #     /healthcheck 200。且它复用已在运行的 postgres, **不新增容器与内存**。
    #
    #   代价(如实记录): OAP 的 trace/log 全文检索走 PostgreSQL 会比 ES 慢。
    #   本项目 SkyWalking 目前**零业务查询**(agent 注入已生效, 但没有任何人
    #   查过 trace), 该代价当前为零; 若将来接入 trace 查询且出现性能问题,
    #   再评估 BanyanDB(SkyWalking 原生推荐, 但需新增容器)。
    image: apache/skywalking-oap-server:10.1.0
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-skywalking-oap
    # ⚠️ 2026-10-04 调整: 1024m -> 2048m。
    #   依据是**实测事实**: 容器 RSS 长期贴着 98.3% 的原限额运行, 即原配置本身过紧。
    #   注意这不是 malloc 失败的原因 —— 2026-10-05 实测推翻了先前的归因:
    #   cloud-auth 堆外余量 384MB(远超任何合理阈值)照样 malloc 失败,
    #   而真正的原因是**宿主机全局 commit 预算**被多个 JVM 冲破
    #   (见 verify-e2e.sh 的 check_commit_budget 与那里的详细说明)。
    #   本项只消除"OAP 自身余量过紧"这个独立问题, 不声称能防住 malloc 失败。
    #   取 2048m: 与同级的 elasticsearch(1024m 限额 / 512m 堆) 相比留出足够余量,
    #   也与 system-module 的 2048m 同档。
    mem_limit: 2048m
    ports:
      - "11800:11800"  # gRPC agent 接收
      - "12800:12800"  # HTTP REST query
    volumes:
      - ./skywalking/config/application.yml:/skywalking/config/application.yml:ro
    # ✅ healthcheck 修正为 /healthcheck (2026-10-04)。
    #   原值 `/public/graph` 在 SkyWalking 10.x **恒返回 404** —— 该路径属于
    #   已被移除的 Deprecated GraphQL API。所以这个 healthcheck 从加上的
    #   第一天起就永远失败, 与 ES 冲突无关, 是**独立的第二处缺陷**。
    #   (deploy/skywalking/README.md 早就写着"返回 Status: 404",
    #    但没人把它和 compose 的 healthcheck 对上 —— 文档写了, 配置没改。)
    #
    #   `/healthcheck` 来自官方文档 (api/health-check):
    #     "make sure to set necessary configurations required by the health checker
    #      before using this endpoint, otherwise 404 will be returned."
    #   即**必须**同时把 health-checker 模块打开(SW_HEALTH_CHECKER=default),
    #   否则同样 404 —— 这是链上的第三处缺陷, 三个条件缺一不可:
    #       ① 路径是 /healthcheck   ② SW_HEALTH_CHECKER 已启用   ③ 端口 12800
    #   实测: 三者齐备 → 200; 缺 ② → 404。
    #
    #   ⚠️ 这是一个**浅层**探活: 停掉 postgres 后 OAP 日志确实打出
    #      `Health check fails`, 但 HTTP 仍返回 200(score=0 表示"无故障项",
    #      而非"全部检查通过")。故它能证明 **OAP 进程与 HTTP 服务已就绪**,
    #      **不能**证明存储持续可用。存储可用性由 postgres 自己的 healthcheck 负责。
    #      —— 依赖链上是 postgres(healthy) → oap(healthy), 两层各管一段。
    #
    #   探活失败重试 30 次 × 5s = 150s, 覆盖 OAP 首次初始化(建 64 张表)的耗时
    #   (实测冷启动约 100s)。
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:12800/healthcheck || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    environment:
      # SW 10.x 字段名: SW_CORE_GRPC_HOST (替换 9.6 的 SW_NODE_IP)
      # ⚠️ SW_STORAGE 的取值是**存储实现名**, 不是通用词。
      #   曾试 `SW_STORAGE=jdbc` → ProviderNotFoundException:
      #     "no provider found for module storage"。
      #   合法值: elasticsearch / postgresql / mysql / h2(镜像无 provider) / banyandb。
      - SW_STORAGE=postgresql
      - SW_JDBC_URL=jdbc:postgresql://cloud-postgres:5432/skywalking
      - SW_DATA_SOURCE_USER=${POSTGRES_USER:-postgres}
      - SW_DATA_SOURCE_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须在 .env 中设置}
      # 必须显式给地址: application.yml 里 postgresql 的默认值是
      #   jdbc:postgresql://localhost:5432/skywalking —— 那是**官方单机默认**,
      # 在 compose 网络里会连到自己容器内的 5432 → Connection refused。
      # 与 ES 的 SW_STORAGE_ES_CLUSTER_NODES 是同一类坑, 不能靠"默认值刚好对"。
      #
      # 注: 曾试过用 SW_ADMIN_SERVER= / SW_STATUS= ... 禁用 9.7.0 没有的
      # 6 个模块, **实测无效** —— 空值会让 ${VAR:default} 回落 default 而非置空。
      # 真正解法不是禁用, 而是让配置与镜像版本对齐(已改为官方 10.1.0 原版
      # application.yml), 故这些变量已删除。留在这里只会让人以为"配了就能禁用"。
      #
      # 打开 health-checker 模块, 否则 /healthcheck 恒 404(见上方 healthcheck 注释)。
      - SW_HEALTH_CHECKER=default
      - SW_CORE_GRPC_HOST=cloud-skywalking-oap
      - TZ=Asia/Shanghai
      - JAVA_OPTS=-Xms512m -Xmx1024m -XX:MaxMetaspaceSize=192m -XX:CompressedClassSpaceSize=96m -XX:ReservedCodeCacheSize=96m
      # 堆 1024m + 容器限额 2048m = 1024m 堆外余量, 供metaspace 与 300+ 线程栈使用。
    depends_on:
      # ⚠️ 依赖对象已随存储切换改为 postgres。
      #   保留指向 elasticsearch 会让 OAP 在 ES 慢启动时白等,
      #   而它的存储根本不碰 ES —— 依赖必须指向**它真正使用**的服务。
      postgres:
        condition: service_healthy
    networks:
      - cloud-infra
    logging: *default-logging

  skywalking-ui:
    # 与 skywalking-oap 保持同版本 (原为 10.2.0, OAP 是 9.7.0)。
    # OAP 本轮升到 10.1.0 后两者错开, 而 UI↔OAP 的 GraphQL 接口在小版本间
    # 可能有字段变更 —— 不实测就等于把风险留给下一个人。
    # 门禁只校验 OAP 的配置/镜像对齐, UI 版本由本注释 + 下方 verify-e2e.sh 覆盖。
    image: apache/skywalking-ui:10.1.0
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-skywalking-ui
    mem_limit: 512m
    ports:
      - "18080:8080"   # SkyWalking UI
    environment:
      # ⚠️ 必须带 http:// 前缀 (2026-10-04 实测)。
      #   原值 `cloud-skywalking-oap:12800` 让 UI 启动即崩:
      #     Exception in thread "main" java.lang.NullPointerException: authority
      #   即 UI 用 URI 解析这个地址, 无 scheme ⇒ host 为 null ⇒ NPE。
      #   README 早前记的"UI 镜像 Up 但 HTTP 拒绝连接"就是这件事,
      #   当时误判为 "10.x UI 与 10.1 OAP hostname 兼容 issue"。
      #   单变量对照实测: 加 http:// → HTTP 200 / restarts=0;
      #                   不加      → NullPointerException: authority。
      - SW_OAP_ADDRESS=http://cloud-skywalking-oap:12800
      - SW_SERVER_LISTEN_IP=0.0.0.0
      - TZ=Asia/Shanghai
    depends_on:
      skywalking-oap:
        # 由 started 收紧为 healthy: UI 只有 OAP 的 /healthcheck 通过才有意义,
        # 否则会在 OAP 尚未就绪时启动失败并进入重启循环。
        condition: service_healthy
    networks:
      - cloud-infra
    logging: *default-logging

