# Cloud-Infra 全套环境声明
# 基础设施:  podman-compose -f deploy/compose.yaml up -d                    (仅启动 nacos/postgres/redis/rabbitmq/es/prometheus)
# 全套环境:   podman-compose -f deploy/compose.yaml --profile full up -d    (基础设施 + 所有微服务)
# 单微服务:   podman-compose -f deploy/compose.yaml --profile full up gateway
#
# 先构建:  mvn clean package -DskipTests
# podman-compose 直接 build 需要 podman 有 Docker-compatible build 能力

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ========== 注册中心 & 配置中心 ==========
  nacos:
    image: nacos/nacos-server:v3.2.3
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-nacos
    # ⚠️ 堆下限 1g / 上限 2g 不是随手填的, 是**实验收敛**出来的 (2026-10-03)。
    #
    # 现象: Nacos 崩溃重启循环 30+ 次, 每次 exit=0 / oom=false, 报
    #   java.sql.SQLTimeoutException: Login timeout exceeded
    #   ERROR XBDA0: Login timeout exceeded
    #   → load derby-schema.sql error
    # 然后下一轮变成
    #   ERROR XBM0A: The database directory '.../derby-data' exists.
    #   However, it does not contain the expected 'service.properties' file.
    # 于是形成**自锁**: 第一轮建库失败留下半成品目录, 第二轮起再也不会成功。
    #
    # Derby 报错很有迷惑性 —— 它说的是"目录已存在", 看着像环境残留,
    # 但清空目录后**第一轮**照样失败。真实原因在更下面一层:
    # seg0/c10.dat 等段文件其实已写入(非空 8KB), 说明 Derby 真的启动了,
    # 只是在最后写 service.properties 前被拖过了 boot 的 login 超时。
    #
    # 逐项排除的假设(每一项都真跑过, 不是推理):
    #   mem_limit 768m -> 2g          仍失败 ⇒ 不是内存不足
    #   bind mount    -> 命名卷        仍失败 ⇒ 不是 bind 挂载/文件锁
    #   -Xmn512m      -> -Xmn170m      仍失败 ⇒ 不是 -Xmn == -Xmx
    #   -Xms256m/-Xmx512m -> 1g/2g   ✅ service.properties 生成, Nacos 正常启动
    #
    # 即**堆太小, Derby 建库在超时内完不成**。镜像脚本自己拼的是
    # `-Xms256m -Xmx512m -Xmn512m`(见容器日志), 官方默认 -Xms1g —— 本项目此前配的
    # 恰好只有官方的 1/4。mem_limit 必须 >= Xmx + metaspace + 线程栈, 故取 4g。
    mem_limit: 4g
    ports:
      - "8848:8848"
      - "9848:9848"
      # Nacos 3.x 控制台独立端口 (nacos.console.port=8080)
      - "8080:8080"
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-}
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: security
      # 启用 v1/v2 客户端 API 兼容 (up.sh 配置同步与运维脚本依赖 v1 API)
      # 注: NACOS_CORE_API_* 环境变量不在 docker-startup.sh 白名单, 用 JAVA_TOOL_OPTIONS 注入
      # - 认证关闭时 admin API 仍需登录, 本地开发禁用便于 up.sh 脚本同步配置
      JAVA_TOOL_OPTIONS: "-Dnacos.core.auth.admin.enabled=false"
      JVM_XMS: 1g
      JVM_XMX: 2g
    volumes:
      - ./nacos/data:/home/nacos/data
    networks:
      - cloud-infra
    logging: *default-logging
    healthcheck:
      # Nacos 3.2+ 健康检查: Console 独立进程 (8080) 的 v3 readiness 端点
      # v1/v2 API (8848) 在 3.2+ 默认关闭兼容, 不能再作为探测源
      test: ["CMD", "curl", "-f", "http://localhost:8080/v3/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ========== 数据库 ==========
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-postgres
    mem_limit: 512m
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: cloud_infra
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须在 .env 中设置}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - cloud-infra
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== 缓存 ==========
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-redis
    mem_limit: 256m
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - cloud-infra
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ========== 消息队列 ==========
  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-rabbitmq
    mem_limit: 512m
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER 必须在 .env 中设置}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS 必须在 .env 中设置}
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    networks:
      - cloud-infra
    logging: *default-logging
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ========== 搜索引擎 ==========
  elasticsearch:
    # ⚠️ 主版本必须与 ES 客户端对齐, 不能随手填。
    #   Spring Boot 4.1.0 的 BOM 指定 elasticsearch-client.version = 9.4.2
    #   （见 ~/.m2/.../spring-boot-dependencies-4.1.0.pom 的 <elasticsearch-client.version>）,
    #   而 9.x 客户端默认发送
    #     Accept/Content-Type: application/vnd.elasticsearch+json; compatible-with=9
    #   ES 8.x 服务端**直接拒绝**该头, 报 400:
    #     media_type_header_exception: Invalid media-type value on headers
    #     [Accept, Content-Type]
    #   然后 search 启动即失败（SimpleElasticsearchRepository 构造时
    #   createIndexAndMappingIfNeeded -> IndicesTemplate.exists）。
    #
    #   这个坑很隐蔽: 同一台 ES, curl HEAD /sys_oper_log 返回正常的 404,
    #   因为 curl 不发这两个头 —— 只有 Java 客户端会踩到。
    #   实测证据: 见 AGENTS.md「第六课补记: ES 版本不匹配伪装成客户端异常」。
    image: elasticsearch:9.0.3
    restart: unless-stopped
    stop_grace_period: 60s
    container_name: cloud-elasticsearch
    mem_limit: 1g
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - cloud-infra
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 15s
      timeout: 10s
      retries: 10
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536

  # ========== 监控 ==========
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-prometheus
    mem_limit: 512m
    ports:
      - "9090:9090"
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      no_proxy: "*"
      NO_PROXY: "*"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus-rules/:/etc/prometheus/rules/:ro
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-lifecycle'
    networks:
      - cloud-infra
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:latest
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-alertmanager
    mem_limit: 128m
    ports:
      - "9093:9093"
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      no_proxy: "*"
      NO_PROXY: "*"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - cloud-infra
    logging: *default-logging

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-grafana
    mem_limit: 384m
    ports:
      - "3000:3000"
    environment:
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
      - no_proxy=*
      - NO_PROXY=*
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - cloud-infra
    logging: *default-logging

  # ========== 日志集中 ==========
  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-loki
    mem_limit: 384m
    ports:
      - "3100:3100"
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      no_proxy: "*"
      NO_PROXY: "*"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    networks:
      - cloud-infra
    logging: *default-logging

  promtail:
    # 可观测性日志采集组件, 非微服务启动/健康前置依赖。
    # 默认 infra 启动不包含它, 避免宿主机特定路径(/run/user/1000, /home/zeron/...)
    # 在 CI 等环境不存在时阻塞整个 compose up。
    profiles: ["observability"]
    image: grafana/promtail:3.4.2
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-promtail
    mem_limit: 256m
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      no_proxy: "*"
      NO_PROXY: "*"
    volumes:
      # podman rootless socket + 容器日志存储 (json-file)
      - /run/user/1000/podman/podman.sock:/var/run/docker.sock:ro
      - /home/zeron/.local/share/containers/storage/overlay-containers:/var/log/containers:ro
      - ./monitoring/promtail.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - cloud-infra
    logging: *default-logging

  # ========== 链路追踪 ==========
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-otel-collector
    mem_limit: 256m
    ports:
      - "4317:4317"
      - "4318:4318"
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      no_proxy: "*"
      NO_PROXY: "*"
    volumes:
      - ./monitoring/otel-collector.yml:/etc/otel/config.yml:ro
    command: ["--config=/etc/otel/config.yml"]
    networks:
      - cloud-infra
    logging: *default-logging

  jaeger:
    image: jaegertracing/all-in-one:latest
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-jaeger
    mem_limit: 512m
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # Jaeger collector HTTP
    environment:
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
      - no_proxy=*
      - NO_PROXY=*
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - cloud-infra
    logging: *default-logging

  # ========== SkyWalking APM (可选) ==========
  # 应用性能监控: 分布式追踪 + 慢 SQL/慢方法 + 服务拓扑 + 异常聚合
  # 与 Jaeger 并存: Jaeger 用 OTel 协议, SkyWalking 用 agent gRPC 协议
  # 业务模块 JVM agent 通过 SW_AGENT_ENABLED=true 启用
  skywalking-oap:
    # ⚠️ 版本选择受 ES 版本钳制, 且当前存在**未解冲突** (2026-10-03 实测)。
    #
    #   已确认的事实:
    #     OAP 10.1.0 + ES 9.0.3 → java.lang.UnsupportedOperationException:
    #                                Unsupported version: ElasticSearch 9.0
    #     官方文档(main 分支)明确写: "ElasticSearch 7 and 8"
    #     即 **SkyWalking 全系不支持 ES 9**, 与 OAP 版本无关。
    #
    #   冲突面: 本仓库 ES 升到 9.0.3 是为了对齐 search 服务的
    #   Spring Data ES 9.x 客户端(探针实测发 compatible-with=9, 对 ES 8 报 400),
    #   而 SkyWalking 只吃 ES 7/8 —— **两者无法共用同一个 ES 实例**。
    #
    #   ⚠️ 不要仅凭本注释下调镜像 tag 试: 9.7.0 实测同样抛该异常
    #   (先前有"9.7.0 报错、10.1.0 不报错"的中间结论, 后被用 10.1.0 官方配置
    #   复测推翻 —— 差异来自配置文件版本, 不是 OAP 版本)。
    #
    #   解法需在以下三者中选一, 见 docs/decisions/ 下的 ES 版本决策记录:
    #     a) SkyWalking 改用非 ES 存储 (BanyanDB / PostgreSQL)
    #     b) search 与 SkyWalking 各用一个 ES 实例
    #     c) search 降级到 ES 8 客户端
    image: apache/skywalking-oap-server:10.1.0
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-skywalking-oap
    mem_limit: 1024m
    ports:
      - "11800:11800"  # gRPC agent 接收
      - "12800:12800"  # HTTP REST query
    volumes:
      - ./skywalking/config/application.yml:/skywalking/config/application.yml:ro
    # ⚠️ 这个 healthcheck 不能省 (2026-10-03)。
    #   6 个业务服务全部用 SW_AGENT_OAP=cloud-skywalking-oap:11800 连 OAP,
    #   而它们对 oap 的依赖原先只写 `condition: service_started` ——
    #   那只保证**进程存在**, 不保证 gRPC 11800 已在监听。
    #   容器一多(system/file/search/notification/auth 同时起)就会踩到启动竞争:
    #     Caused by: java.net.UnknownHostException: cloud-skywalking-oap: Name does not resolve
    #   报错发生在业务服务自己的日志里, 且**间歇出现**(gateway/search 常常正常),
    #   很容易被误判成"偶发环境问题"而不去查依赖条件。
    #
    #   判据用 12800(HTTP query 端口)而不是 11800: OAP 镜像里 curl 不可靠,
    #   而 12800 走 HTTP, wget 即可探活。探活失败重试 30 次 × 5s = 150s,
    #   覆盖 OAP 首次初始化(连 ES 建索引)的耗时。
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:12800/public/graph || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    environment:
      # SW 10.x 字段名: SW_CORE_GRPC_HOST (替换 9.6 的 SW_NODE_IP)
      # ⚠️ SW_STORAGE 必须是 elasticsearch, **不能是 h2** (2026-10-03 实测)。
      #   原值 h2 一直配在这里, 但镜像 apache/skywalking-oap-server:9.7.0 里
      #   只有 h2-2.1.212.jar(驱动), **没有** storage-h2-plugin(provider),
      #   于是启动直接失败:
      #     ProviderNotFoundException: no provider found for module storage,
      #     if you're sure it's not required module and want to remove it,
      #     set the selector to -
      #   崩溃循环, restarts 一路涨到 51。
      #
      #   为什么此前一直没暴露: OAP 容器从未被真正重建过 —— 本机上跑的是
      #   几个月前的旧镜像。而 depends_on 用 service_started,
      #   只等进程存在, 不等它健康, 于是依赖它的 6 个业务服务照样"启动成功"。
      #   即 **一个从未成功运行的服务, 被当成了已就绪的依赖**。
      #   这次给 OAP 补上 healthcheck 并把 6 处依赖改成 service_healthy,
      #   才把它暴露出来 —— 门禁变严后立刻抓到既有缺陷, 这是预期行为。
      - SW_STORAGE=elasticsearch
      # ⚠️ 必须显式给 ES 地址。application.yml 的默认值是 localhost:9200,
      #   那是**官方单机默认**, 在 compose 网络里会连到自己容器内的 9200 →
      #   Connection refused: localhost/127.0.0.1:9200, OAP 起不来。
      #   实测: 同一份配置, 传 SW_STORAGE_ES_CLUSTER_NODES 时正常 listening 11800,
      #        不传则必崩 —— 所以不能靠"配置默认值刚好对"。
      - SW_STORAGE_ES_CLUSTER_NODES=cloud-elasticsearch:9200
      # 注: 曾试过用 SW_ADMIN_SERVER= / SW_STATUS= ... 禁用 9.7.0 没有的
      # 6 个模块(admin-server/status/inspect/ui-management/dsl-debugging/
      # receiver-runtime-rule), **实测无效** —— 空值会让 ${VAR:default} 回落
      # default 而非置空, 仍报 "no provider found for module admin-server"。
      # 真正解法不是禁用, 而是让配置与镜像版本对齐(已改为官方 10.1.0 原版
      # application.yml), 故这些变量已删除。留在这里只会让人以为"配了就能禁用"。
      #
      # 该 6 个模块本项目零业务引用; 若将来确需 admin API, 应升级到含
      # 这些 provider 的镜像版本, 而不是靠环境变量硬压。
      - SW_CORE_GRPC_HOST=cloud-skywalking-oap
      - TZ=Asia/Shanghai
      - JAVA_OPTS=-Xms512m -Xmx1024m
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - cloud-infra
    logging: *default-logging

  skywalking-ui:
    # 与 skywalking-oap 保持同版本 (原为 10.2.0, OAP 是 9.7.0)。
    # OAP 本轮升到 10.1.0 后两者错开, 而 UI↔OAP 的 GraphQL 接口在小版本间
    # 可能有字段变更 —— 不实测就等于把风险留给下一个人。
    # 门禁只校验 OAP 的配置/镜像对齐, UI 版本由本注释 + 下方 verify-e2e.sh 覆盖。
    image: apache/skywalking-ui:10.1.0
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-skywalking-ui
    mem_limit: 512m
    ports:
      - "18080:8080"   # SkyWalking UI
    environment:
      - SW_OAP_ADDRESS=cloud-skywalking-oap:12800
      - SW_SERVER_LISTEN_IP=0.0.0.0
      - TZ=Asia/Shanghai
    depends_on:
      - skywalking-oap
    networks:
      - cloud-infra
    logging: *default-logging

  # ========== 限流熔断控制台 ==========
  sentinel:
    image: bladex/sentinel-dashboard:1.8.9
    restart: unless-stopped
    stop_grace_period: 30s
    container_name: cloud-sentinel
    mem_limit: 256m
    ports:
      - "8858:8858"
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      no_proxy: "*"
      NO_PROXY: "*"
      SENTINEL_DASHBOARD_SERVER: ":8858"
      SENTINEL_DASHBOARD_AUTH_USERNAME: sentinel
      SENTINEL_DASHBOARD_AUTH_PASSWORD: sentinel
    networks:
      - cloud-infra
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8858"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ========== 微服务（通过 --profile full 启用）==========
  gateway:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: cloud-infra-gateway/Dockerfile
    image: localhost/cloud-infra-gateway:latest
    container_name: cloud-gateway
    mem_limit: 448m
