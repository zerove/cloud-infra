# Cloud-Infra 全套环境声明
# 基础设施:  podman-compose -f deploy/compose.yaml up -d                    (仅启动 nacos/postgres/redis/rabbitmq/es/prometheus)
# 全套环境:   podman-compose -f deploy/compose.yaml --profile full up -d    (基础设施 + 所有微服务)
# 单微服务:   podman-compose -f deploy/compose.yaml --profile full up gateway
#
# 先构建:  mvn clean package -DskipTests
# podman-compose 直接 build 需要 podman 有 Docker-compatible build 能力

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ========== 注册中心 & 配置中心 ==========
  nacos:
    image: nacos/nacos-server:v3.0.2
    container_name: cloud-nacos
    mem_limit: 768m
    ports:
      - "8848:8848"
      - "9848:9848"
      # Nacos 3.x 控制台独立端口 (nacos.console.port=8080)
      - "8080:8080"
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_TOKEN: c2VjcmV0VG9rZW4xMjM0NTY3ODkwYWJjZGVmMTIzNDU2Nzg5MGFiY2RlZg==
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: security
      JVM_XMS: 256m
      JVM_XMX: 512m
    volumes:
      - ./nacos/data:/home/nacos/data
    networks:
      - cloud-infra
    logging: *default-logging
    healthcheck:
      # Nacos v3 的 /nacos/ 首页与 v1 console 端点不返回 200（410 Gone 或 404），
      # 使用命名服务 list API 作为真实可用性探测（返回 200 JSON）
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/ns/service/list?pageNo=1&pageSize=10"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ========== 数据库 ==========
  postgres:
    image: postgres:16-alpine
    container_name: cloud-postgres
    mem_limit: 512m
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: cloud_infra
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - cloud-infra
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== 缓存 ==========
  redis:
    image: redis:7-alpine
    container_name: cloud-redis
    mem_limit: 256m
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - cloud-infra
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ========== 消息队列 ==========
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: cloud-rabbitmq
    mem_limit: 512m
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    networks:
      - cloud-infra
    logging: *default-logging
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ========== 搜索引擎 ==========
  elasticsearch:
    image: elasticsearch:9.0.2
    container_name: cloud-elasticsearch
    mem_limit: 1g
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - cloud-infra
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 15s
      timeout: 10s
      retries: 10
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536

  # ========== 监控 ==========
  prometheus:
    image: prom/prometheus:latest
    container_name: cloud-prometheus
    mem_limit: 512m
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - cloud-infra
    logging: *default-logging

  # ========== 限流熔断控制台 ==========
  sentinel:
    image: bladex/sentinel-dashboard:1.8.9
    container_name: cloud-sentinel
    mem_limit: 256m
    ports:
      - "8858:8858"
    environment:
      SENTINEL_DASHBOARD_SERVER: ":8858"
      SENTINEL_DASHBOARD_AUTH_USERNAME: sentinel
      SENTINEL_DASHBOARD_AUTH_PASSWORD: sentinel
    networks:
      - cloud-infra
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8858"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ========== 微服务（通过 --profile full 启用）==========
  gateway:
    profiles: ["full"]
    build:
      context: ../cloud-infra-gateway
      dockerfile: Dockerfile
    image: localhost/cloud-infra-gateway:latest
    container_name: cloud-gateway
    mem_limit: 384m
    ports:
      - "9000:9000"
      - "9301:9301"   # 管理端口 (ADR-008)
    environment:
      JAVA_OPTS: "-XX:+UseSerialGC -Xmx256m -Xms128m -XX:+UseContainerSupport"
      SPRING_PROFILES_ACTIVE: dev
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: cloud-nacos:8848
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-sNU5JnRxwBiHxl7k5j1ZWKxhpeOKNCV4Y5wBdTeGbQMakSouGdvjDKmGWtpNXqpu}
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      no_proxy: "*"
      NO_PROXY: "*"
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: cloud-nacos:8848
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9301/management/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    networks:
      - cloud-infra
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  auth:
    profiles: ["full"]
    build:
      context: ../cloud-infra-auth
      dockerfile: Dockerfile
    image: localhost/cloud-infra-auth:latest
    container_name: cloud-auth
    mem_limit: 384m
    ports:
      - "8081:8081"
      - "9302:9301"   # 管理端口 (ADR-008)
    environment:
      JAVA_OPTS: "-XX:+UseSerialGC -Xmx256m -Xms128m -XX:+UseContainerSupport"
      SPRING_PROFILES_ACTIVE: dev
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: cloud-nacos:8848
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-sNU5JnRxwBiHxl7k5j1ZWKxhpeOKNCV4Y5wBdTeGbQMakSouGdvjDKmGWtpNXqpu}
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      no_proxy: "*"
      NO_PROXY: "*"
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: cloud-nacos:8848
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9301/management/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    networks:
      - cloud-infra
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  system:
    profiles: ["full"]
    build:
      context: ../cloud-infra-modules/system-module
      dockerfile: Dockerfile
    image: localhost/cloud-infra-system:latest
    container_name: cloud-system
    mem_limit: 384m
    ports:
      - "8082:8082"
      - "9303:9301"   # 管理端口 (ADR-008)
    environment:
      JAVA_OPTS: "-XX:+UseSerialGC -Xmx256m -Xms128m -XX:+UseContainerSupport"
      SPRING_PROFILES_ACTIVE: dev
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: cloud-nacos:8848
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      no_proxy: "*"
      NO_PROXY: "*"
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: cloud-nacos:8848
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9301/management/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    networks:
      - cloud-infra
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  file:
    profiles: ["full"]
    build:
      context: ../cloud-infra-modules/file-service
      dockerfile: Dockerfile
    image: localhost/cloud-infra-file:latest
    container_name: cloud-file
    mem_limit: 384m
    ports:
      - "8083:8083"
      - "9304:9301"   # 管理端口 (ADR-008)
    environment:
      JAVA_OPTS: "-XX:+UseSerialGC -Xmx256m -Xms128m -XX:+UseContainerSupport"
      SPRING_PROFILES_ACTIVE: dev
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: cloud-nacos:8848
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      no_proxy: "*"
      NO_PROXY: "*"
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: cloud-nacos:8848
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9301/management/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    networks:
      - cloud-infra
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  notification:
    profiles: ["full"]
    build:
      context: ../cloud-infra-modules/notification-service
      dockerfile: Dockerfile
    image: localhost/cloud-infra-notification:latest
    container_name: cloud-notification
    mem_limit: 384m
    ports:
      - "8084:8084"
      - "9305:9301"   # 管理端口 (ADR-008)
    environment:
      JAVA_OPTS: "-XX:+UseSerialGC -Xmx256m -Xms128m -XX:+UseContainerSupport"
      SPRING_PROFILES_ACTIVE: dev
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: cloud-nacos:8848
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      no_proxy: "*"
      NO_PROXY: "*"
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: cloud-nacos:8848
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9301/management/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    networks:
      - cloud-infra
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    logging: *default-logging

  search:
    profiles: ["full"]
    build:
      context: ../cloud-infra-modules/search-service
      dockerfile: Dockerfile
    image: localhost/cloud-infra-search:latest
    container_name: cloud-search
    mem_limit: 384m
    ports:
      - "8085:8085"
      - "9306:9301"   # 管理端口 (ADR-008)
    environment:
      JAVA_OPTS: "-XX:+UseSerialGC -Xmx256m -Xms128m -XX:+UseContainerSupport"
      SPRING_PROFILES_ACTIVE: dev
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: cloud-nacos:8848
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      no_proxy: "*"
      NO_PROXY: "*"
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: cloud-nacos:8848
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9301/management/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    networks:
      - cloud-infra
    depends_on:
      nacos:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    logging: *default-logging

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  esdata:

networks:
  cloud-infra:
    name: cloud-infra
