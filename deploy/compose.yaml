services:
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: nacos-server
    environment:
      - SPRING_DATA_ELASTICSEARCH_CLIENT_REACTIVE_ENDPOINTS=elasticsearch:9200
      - PREFER_HOST_MODE=hostname
      - MODE=standalone
      - JVM_XMS=256m
      - JVM_XMX=256m
      - JVM_XMN=128m
    ports:
      - "8848:8848"
      - "9848:9848"
    expose:
      - "9848"
    volumes:
      - nacos_logs:/home/nacos/logs
      - nacos_data:/home/nacos/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/index.html"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  redis:
    image: redis:7.2-alpine
    container_name: redis-server
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-server
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: always

  postgres:
    image: postgres:16
    container_name: postgres-server
    environment:
      - SPRING_DATA_ELASTICSEARCH_CLIENT_REACTIVE_ENDPOINTS=elasticsearch:9200
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=cloud_infra
      - TZ=Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.22
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  nginx:
    image: nginx:alpine
    container_name: nginx-lb
    ports:
      - "9000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      gateway1:
        condition: service_healthy
      gateway2:
        condition: service_healthy


  gateway1:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.prod
      args:
        JAR_FILE: cloud-infra-gateway/target/cloud-infra-gateway-1.0.0-SNAPSHOT.jar
    container_name: cloud-gateway-1
    volumes:
      - ./config/gateway-application.yml:/app/config/application.yml:ro
    environment:
      - SPRING_CONFIG_LOCATION=file:/app/config/application.yml
      - SPRING_CLOUD_NACOS_SERVER_ADDR=nacos:8848
      - SPRING_THREADS_VIRTUAL_ENABLED=true
      - SPRING_DATA_REDIS_HOST=redis-server
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always

  gateway2:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.prod
      args:
        JAR_FILE: cloud-infra-gateway/target/cloud-infra-gateway-1.0.0-SNAPSHOT.jar
    container_name: cloud-gateway-2
    volumes:
      - ./config/gateway-application.yml:/app/config/application.yml:ro
    environment:
      - SPRING_CONFIG_LOCATION=file:/app/config/application.yml
      - SPRING_CLOUD_NACOS_SERVER_ADDR=nacos:8848
      - SPRING_THREADS_VIRTUAL_ENABLED=true
      - SPRING_DATA_REDIS_HOST=redis-server
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always

  auth:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.prod
      args:
        JAR_FILE: cloud-infra-auth/target/cloud-infra-auth-1.0.0-SNAPSHOT.jar
    container_name: cloud-auth
    ports:
      - "9201:9200"
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./config/auth-application.yml:/app/config/application.yml:ro
    environment:
      - SPRING_DATA_ELASTICSEARCH_CLIENT_REACTIVE_ENDPOINTS=elasticsearch:9200
      - SPRING_CONFIG_LOCATION=file:/app/config/application.yml
      - SPRING_CLOUD_NACOS_SERVER_ADDR=nacos:8848
      - SPRING_THREADS_VIRTUAL_ENABLED=true
      - SPRING_DATA_REDIS_HOST=redis-server
      - SPRING_RABBITMQ_HOST=rabbitmq-server
      - SPRING_DATASOURCE_HOST=postgres-server
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SW_AGENT_NAME=cloud-auth
      - SW_AGENT_COLLECTOR_BACKEND_SERVICES=skywalking-oap:11800
    deploy:
      resources:
        limits:
          memory: 512M
    labels:
      - "monitoring=true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always

  system:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.prod
      args:
        JAR_FILE: cloud-infra-modules/system-module/target/system-module-1.0.0-SNAPSHOT.jar
    container_name: cloud-system
    ports:
      - "9300:9300"
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_started
    volumes:
      - ./config/system-application.yml:/app/config/application.yml:ro
      - ./logs/system:/var/log/system
    environment:
      - SPRING_DATA_ELASTICSEARCH_CLIENT_REACTIVE_ENDPOINTS=elasticsearch:9200
      - SPRING_CONFIG_LOCATION=file:/app/config/application.yml
      - SPRING_CLOUD_NACOS_SERVER_ADDR=nacos:8848
      - SPRING_DATASOURCE_HOST=postgres-server
      - SPRING_DATASOURCE_PORT=5432
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_THREADS_VIRTUAL_ENABLED=true
      - SPRING_DATA_ELASTICSEARCH_CLUSTER_NODES=elasticsearch:9200
      - SPRING_DATA_REDIS_HOST=redis-server
      - SPRING_RABBITMQ_HOST=rabbitmq-server
      - SW_AGENT_NAME=cloud-system
      - SW_AGENT_COLLECTOR_BACKEND_SERVICES=skywalking-oap:11800
    deploy:
      resources:
        limits:
          memory: 768M
    labels:
      - "monitoring=true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9300/management/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: always

  notification:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.prod
      args:
        JAR_FILE: cloud-infra-modules/notification-service/target/notification-service-1.0.0-SNAPSHOT.jar
    container_name: cloud-notification
    ports:
      - "9400:9400"
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    volumes:
      - ./config/notification-application.yml:/app/config/application.yml:ro
    environment:
      - JAVA_OPTS=-XX:+UseZGC -Xmx512m -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom -Ddebug=true
      - SPRING_DATA_ELASTICSEARCH_CLIENT_REACTIVE_ENDPOINTS=elasticsearch:9200
    deploy:
      resources:
        limits:
          memory: 512M
    labels:
      - "monitoring=true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9400/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: always

  search:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.prod
      args:
        JAR_FILE: cloud-infra-modules/search-service/target/search-service-1.0.0-SNAPSHOT.jar
    container_name: cloud-search
    ports:
      - "9500:9500"
    depends_on:
      nacos:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./config/search-application.yml:/app/config/application.yml:ro
    environment:
      - SPRING_DATA_ELASTICSEARCH_CLIENT_REACTIVE_ENDPOINTS=elasticsearch:9200
      - SPRING_CONFIG_LOCATION=file:/app/config/application.yml
      - SPRING_CLOUD_NACOS_SERVER_ADDR=nacos:8848
      - SPRING_THREADS_VIRTUAL_ENABLED=true
      - SPRING_DATA_REDIS_HOST=redis-server
      - SPRING_RABBITMQ_HOST=rabbitmq-server
      - SPRING_DATASOURCE_HOST=postgres-server
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_DATA_ELASTICSEARCH_CLUSTER_NODES=elasticsearch:9200
      - SW_AGENT_NAME=cloud-search
      - SW_AGENT_COLLECTOR_BACKEND_SERVICES=skywalking-oap:11800
    deploy:
      resources:
        limits:
          memory: 512M
    labels:
      - "monitoring=true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9500/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: always

  skywalking-oap:
    image: apache/skywalking-oap-server:9.4.0
    container_name: skywalking-oap
    ports:
      - "11800:11800"
      - "12800:12800"
    restart: always

  skywalking-ui:
    image: apache/skywalking-ui:9.4.0
    container_name: skywalking-ui
    ports:
      - "8080:8080"
    environment:
      - SW_OAP_ADDRESS=http://skywalking-oap:12800
    depends_on:
      - skywalking-oap
    restart: always

volumes:
  nacos_logs:
  nacos_data:
  redis_data:
  postgres_data:
