networks:
  default:
    name: cloud-infra-net

services:
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: nacos-server
    networks:
      - default
    environment:
      - MODE=standalone
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=mysql-nacos
      - MYSQL_SERVICE_PORT=3306
      - MYSQL_SERVICE_DB_NAME=nacos_config
      - MYSQL_SERVICE_USER=nacos
      - MYSQL_SERVICE_PASSWORD=nacos
      - NACOS_DB_URL=jdbc:mysql://mysql-nacos:3306/nacos_config?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2B8
      - NACOS_DB_USER=nacos
      - NACOS_DB_PASSWORD=nacos
      - NACOS_JDBC_URL=jdbc:mysql://mysql-nacos:3306/nacos_config?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2B8
    ports:
      - "8848:8848"
      - "9848:9848"
      - "7848:7848"
    depends_on:
      mysql-nacos:
        condition: service_healthy

  mysql-nacos:
    image: mysql:8.0
    container_name: mysql-nacos
    command: --bind-address=0.0.0.0 --default-authentication-plugin=mysql_native_password
    networks:
      - default
    environment:
      - MYSQL_DATABASE=nacos_config
      - MYSQL_USER=nacos
      - MYSQL_PASSWORD=nacos
      - MYSQL_ROOT_PASSWORD=root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
  
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    networks:
      - default
    environment:
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=cloud_infra
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: redis
    networks:
      - default
    ports:
      - "6379:6379"

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.jre
      args:
        JAR_FILE: cloud-infra-gateway/target/cloud-infra-gateway-1.0.0-SNAPSHOT.jar
    container_name: cloud-gateway-1
    networks:
      - default
    ports:
      - "9000:9000"
    environment:
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=nacos-server:8848
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=nacos-server:8848
      - SPRING_CONFIG_IMPORT=optional:nacos:gateway.yaml
      - SPRING_CLOUD_NACOS_CONFIG_IMPORT_CHECK_ENABLED=false
    depends_on:
      nacos:
        condition: service_healthy

  auth:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.jre
      args:
        JAR_FILE: cloud-infra-auth/target/cloud-infra-auth-1.0.0-SNAPSHOT.jar
    container_name: auth-service
    networks:
      - default
    ports:
      - "9200:9200"
    environment:
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=nacos-server:8848
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=nacos-server:8848
      - SPRING_CONFIG_IMPORT=optional:nacos:auth.yaml
      - SPRING_CLOUD_NACOS_CONFIG_IMPORT_CHECK_ENABLED=false
    depends_on:
      nacos:
        condition: service_healthy

  system:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.jre
      args:
        JAR_FILE: cloud-infra-modules/system-module/target/system-module-1.0.0-SNAPSHOT.jar
    container_name: system-service
    networks:
      - default
    ports:
      - "9300:9300"
    environment:
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/cloud_infra
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=nacos-server:8848
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=nacos-server:8848
      - SPRING_CONFIG_IMPORT=optional:nacos:system-module.yaml
      - SPRING_CLOUD_NACOS_CONFIG_IMPORT_CHECK_ENABLED=false
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_started
      redis:
        condition: service_started

  notification:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.jre
      args:
        JAR_FILE: cloud-infra-modules/notification-service/target/notification-service-1.0.0-SNAPSHOT.jar
    container_name: notification-service
    networks:
      - default
    environment:
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=nacos-server:8848
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=nacos-server:8848
      - SPRING_CONFIG_IMPORT=optional:nacos:notification.yaml
      - SPRING_CLOUD_NACOS_CONFIG_IMPORT_CHECK_ENABLED=false
    depends_on:
      - nacos

  search:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.jre
      args:
        JAR_FILE: cloud-infra-modules/search-service/target/search-service-1.0.0-SNAPSHOT.jar
    container_name: search-service
    networks:
      - default
    environment:
      - SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR=nacos-server:8848
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR=nacos-server:8848
      - SPRING_CONFIG_IMPORT=optional:nacos:search.yaml
      - SPRING_CLOUD_NACOS_CONFIG_IMPORT_CHECK_ENABLED=false
    depends_on:
      - nacos
