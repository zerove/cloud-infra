# PostgreSQL 调优参数 —— cloud-infra 本地开发环境
#
# 挂载到 /etc/postgresql/tuning.conf，由 postgresql.conf 的 include_dir 引用。
# 独立成文件而非直接改 postgresql.conf，是为了让"哪些是本项目调优的"一目了然、便于回退。
#
# ⚠️ 生效前提（两条都是实测踩过的坑，见 deploy/compose.yaml postgres 段注释）:
#   1. 必须被 postgresql.conf **include**, 光挂载没用。
#   2. postgresql.conf 里第 130 行 `shared_buffers = 128MB` 是**非注释**的,
#      它在文件内优先级高于任何外部传入 —— 所以 include 必须放在它**之后**。
#      本项目通过 `include_dir = 'conf.d'`(PG12+ 默认) 追加, 实测生效。
#
# 【为什么调这些】2026-10-05 实测, 不是照抄调优模板:
#   两本账分离 —— MemAvailable 常年 10.4GB(内存不紧张),
#   而 /proc/diskstats 设备忙 48% 饱和、15 秒只写 5.1MB
#   → 平均单次写 9.5KB / 每秒 35 次 = 小块同步写, 是 fsync 型不是吞吐型。
#   pg_stat_activity 有会话卡在 wait_event=IO|WALSync,
#   且 checkpoint_sync_time 三次采样完全不变 → 元凶是 WAL 同步提交。
#   同期三轮全量 IT 失败规模随磁盘负载变化 5 倍(7 vs 36 ERROR), 互相印证。
#
# 【⚠️ 刻意不动 fsync / synchronous_commit】
#   synchronous_commit=off 能把提交延迟降一个数量级, 是本地环境最有效的一招,
#   但它**允许提交后立即断电丢数据**。这是耐久性取舍, 属用户决策, 不代选。
#   需要时在下方追加一行即可(需 reload 或重启)。

# 工作集缓冲。实测 128MB 装不下, buffers_backend 在涨而 buffers_checkpoint 不涨
#   → backend 直接写数据页, 绕过 checkpoint。
# 只到 192MB 而非 512MB: 容器 mem_limit 是 512m, 而该值是**独占**内存,
#   给满会让堆外(Native/线程栈)无处安放。
shared_buffers = 192MB

# WAL 写满即强制 checkpoint, 放大 fsync 次数。缓冲变大后允许积累更多 WAL。
max_wal_size = 2GB
min_wal_size = 256MB

# 直接减少 WAL 写入量。
wal_compression = on

# 数据都在本地 SSD/overlay, 4.0 是机械盘假设, 会让优化器高估随机读代价。
random_page_cost = 1.1
