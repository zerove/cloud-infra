# OTel Collector 配置: 接收 OTLP 链路追踪
#
# 2026-10-07: Jaeger 已下线(见 deploy/compose.yaml 的 skywalking-oap 块说明),
#   原 otlp/jaeger exporter 一并移除。
#
# ⚠️ 重要: collector **仍在接收**业务服务的 OTLP 上报 —— 删掉 Jaeger 只是
#   少了一个下游。业务侧的 OTLP_TRACING_ENDPOINT 全部保持原样, 不受影响。
#
# ⚠️ 但 traces 管道现在**只接 debug exporter** —— 即 trace 数据只打印到
#   collector 自己的日志, 不落任何持久化存储。这是**有意的过渡态**:
#   链路追踪的正式后端是 SkyWalking(JVM agent → OAP → PostgreSQL),
#   与这条 OTLP 管道是两套独立机制。OTLP 管道保留是为了将来接 Tempo
#   或其他后端时不必改业务配置。
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]