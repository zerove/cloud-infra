apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloud-infra-gateway
  namespace: argocd
  labels:
    app.kubernetes.io/name: cloud-infra-gateway
    app.kubernetes.io/part-of: cloud-infra
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/zerove/cloud-infra.git
    targetRevision: main
    path: deploy/k8s/gateway
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: cloud-infra
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
---
