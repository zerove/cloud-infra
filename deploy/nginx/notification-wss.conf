# Nginx 终止 WebSocket TLS 配置 (M7-03 Phase B)
# 仅限已鉴权可信代理访问。详见 ../ssl/notification/README.md。

upstream notification_backend {
    server notification:8084;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name notification.example.com;

    # 证书路径 (生产环境用 Let's Encrypt / 企业 CA)
    ssl_certificate     /etc/nginx/ssl/notification/server.crt;
    ssl_certificate_key /etc/nginx/ssl/notification/server.key;

    # TLS 安全配置 (M7-03 强制要求)
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256:TLS_CHACHA20_POLY1305_SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS (强制 HTTPS)
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";

    # WebSocket 端点 - 核心配置
    location /notification/ws {
        proxy_pass http://notification_backend;
        proxy_http_version 1.1;

        # WebSocket 必需
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 透传 Gateway 注入的鉴权 Header (M7-03 鉴权依赖)
        proxy_set_header X-User-Id $http_x_user_id;
        proxy_set_header X-User-Name $http_x_user_name;
        proxy_set_header X-Tenant-Id $http_x_tenant_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 长连接超时 (与 NotificationWebSocketHandler 30min idle 对齐)
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_connect_timeout 60s;

        # 关闭缓冲 (实时推送)
        proxy_buffering off;
    }

    # HTTP 强制 HTTPS
    error_page 497 https://$host$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name notification.example.com;
    return 301 https://$host$request_uri;
}
