# Cloud-Infra 本地开发 Prometheus 抓取配置
# 各服务容器内管理端口统一 9301，指标路径 /management/prometheus (ADR-008)
# 注意：prometheus 运行在容器内，targets 必须用容器名（compose 网络 DNS）而非宿主机端口
scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'cloud-infra-gateway'
    metrics_path: /management/prometheus
    static_configs:
      - targets: ['cloud-gateway:9301']

  - job_name: 'cloud-infra-auth'
    metrics_path: /management/prometheus
    static_configs:
      - targets: ['cloud-auth:9301']

  - job_name: 'cloud-infra-system'
    metrics_path: /management/prometheus
    static_configs:
      - targets: ['cloud-system:9301']

  - job_name: 'cloud-infra-file'
    metrics_path: /management/prometheus
    static_configs:
      - targets: ['cloud-file:9301']

  - job_name: 'cloud-infra-notification'
    metrics_path: /management/prometheus
    static_configs:
      - targets: ['cloud-notification:9301']

  - job_name: 'cloud-infra-search'
    metrics_path: /management/prometheus
    static_configs:
      - targets: ['cloud-search:9301']

  - job_name: 'nacos'
    metrics_path: /nacos/actuator/prometheus
    static_configs:
      - targets: ['cloud-nacos:8848']

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # 宽匹配 yml/yaml: 此前写死 *.yml, 导致同目录的 gateway-alerts.yaml 从未被加载。
  # 由 deploy/tests/test_prometheus_rule_files.py 守护 —— 该目录下的每个文件都必须命中此 glob。
  - /etc/prometheus/rules/*.y*ml