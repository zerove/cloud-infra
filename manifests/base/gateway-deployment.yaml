apiVersion: apps/v1
kind: Deployment
metadata:
    name: gateway-service
spec:
    replicas: 1
    selector:
        matchLabels:
            app: gateway
    template:
        metadata:
            labels:
                app: gateway
        spec:
            containers:
                - name: gateway
                  image: localhost/cloud-infra-gateway:latest
                  imagePullPolicy: IfNotPresent
                  env:
                      - name: SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR
                        value: "nacos-service:8848"
                      - name: SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR
                        value: "nacos-service:8848"
                      - name: JAVA_OPTS
                        value: "-XX:+UseSerialGC -Xmx256m -Xms128m -XX:+UseContainerSupport"
                  ports:
                      - containerPort: 9000
                  resources:
                      requests:
                          cpu: 250m
                          memory: 256Mi
                      limits:
                          cpu: 500m
                          memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
    name: gateway-service
spec:
    type: NodePort
    ports:
        - port: 9000
          targetPort: 9000
          nodePort: 30000
    selector:
        app: gateway
