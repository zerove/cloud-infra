apiVersion: apps/v1
kind: Deployment
metadata:
  name: nacos
  labels:
    app: nacos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nacos
  template:
    metadata:
      labels:
        app: nacos
    spec:
      containers:
      - name: nacos
        image: nacos/nacos-server:v2.3.2
        imagePullPolicy: IfNotPresent
        env:
        - name: MODE
          value: standalone
        - name: NACOS_SERVER_PORT
          value: "8848"
        - name: NACOS_SERVER_GRPC_PORT
          value: "9848"
        ports:
        - containerPort: 8848
        - containerPort: 9848
        - containerPort: 9849
---
apiVersion: v1
kind: Service
metadata:
  name: nacos-service
spec:
  ports:
  - port: 8848
    name: http
    targetPort: 8848
  - port: 9848
    name: grpc
    targetPort: 9848
  selector:
    app: nacos
