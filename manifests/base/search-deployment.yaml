apiVersion: apps/v1
kind: Deployment
metadata:
    name: search-service
spec:
    replicas: 1
    selector:
        matchLabels:
            app: search
    template:
        metadata:
            labels:
                app: search
        spec:
            containers:
                - name: search
                  image: localhost/cloud-infra-search:latest
                  imagePullPolicy: IfNotPresent
                  env:
                      - name: SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR
                        value: "nacos-service:8848"
                      - name: SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR
                        value: "nacos-service:8848"
                      - name: SPRING_ELASTICSEARCH_URIS
                        value: "elasticsearch:9200"
                      - name: JAVA_OPTS
                        value: "-XX:+UseSerialGC -Xmx256m -Xms128m -XX:+UseContainerSupport"
                  ports:
                      - containerPort: 9304
                  resources:
                      requests:
                          cpu: 250m
                          memory: 256Mi
                      limits:
                          cpu: 500m
                          memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
    name: search-service
spec:
    ports:
        - port: 9304
          targetPort: 9304
    selector:
        app: search
