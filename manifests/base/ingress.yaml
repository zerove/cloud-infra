apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloud-infra-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: api.cloud-infra.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gateway-service
            port:
              number: 9000
