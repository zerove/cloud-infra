apiVersion: apps/v1
kind: Deployment
metadata:
    name: system-service
spec:
    replicas: 1
    selector:
        matchLabels:
            app: system
    template:
        metadata:
            labels:
                app: system
        spec:
            containers:
                - name: system
                  image: localhost/cloud-infra-system:latest
                  imagePullPolicy: IfNotPresent
                  env:
                      - name: SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR
                        value: "nacos-service:8848"
                      - name: SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR
                        value: "nacos-service:8848"
                      - name: JAVA_OPTS
                        value: "-XX:+UseSerialGC -Xmx256m -Xms128m -XX:+UseContainerSupport"
                  ports:
                      - containerPort: 9300
                  resources:
                      requests:
                          cpu: 250m
                          memory: 256Mi
                      limits:
                          cpu: 500m
                          memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
    name: system-service
spec:
    ports:
        - port: 9300
          targetPort: 9300
    selector:
        app: system
