apiVersion: apps/v1
kind: Deployment
metadata:
    name: system-service
spec:
    replicas: 1
    selector:
        matchLabels:
            app: system
    template:
        metadata:
            labels:
                app: system
        spec:
            containers:
                - name: system
                  image: localhost/cloud-infra-system:latest
                  imagePullPolicy: IfNotPresent
                  env:
                      - name: SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR
                        value: "nacos-service:8848"
                      - name: SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR
                        value: "nacos-service:8848"
                      - name: JAVA_TOOL_OPTIONS
                        value: "-XX:+UseZGC -Xms256m -Xmx512m -Dspring.threads.virtual.enabled=true"
                      - name: SPRING_CONFIG_ADDITIONAL-LOCATION
                        value: "file:/app/config/"
                      - name: SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING
                        value: "true"
                  ports:
                      - containerPort: 9300
                  volumeMounts:
                      - name: config-volume
                        mountPath: /app/config
                   resources:
                       requests:
                           cpu: 250m
                           memory: 512Mi
                       limits:
                           cpu: 1000m
                           memory: 2Gi
            volumes:
                - name: config-volume
                  configMap:
                      name: cloud-infra-config
---
apiVersion: v1
kind: Service
metadata:
    name: system-service
spec:
    ports:
        - port: 9300
          targetPort: 9300
    selector:
        app: system
