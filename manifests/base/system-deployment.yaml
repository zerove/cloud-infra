apiVersion: apps/v1
kind: Deployment
metadata:
  name: system-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: system
  template:
    metadata:
      labels:
        app: system
    spec:
      containers:
      - name: system
        image: localhost/cloud-infra-system:jre
        envFrom:
        - configMapRef:
            name: cloud-infra-config
        ports:
        - containerPort: 9300
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 9300
          initialDelaySeconds: 20
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 9300
          initialDelaySeconds: 40
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: system-service
spec:
  ports:
  - port: 9300
    targetPort: 9300
  selector:
    app: system
