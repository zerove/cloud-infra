apiVersion: apps/v1
kind: Deployment
metadata:
    name: notification-service
spec:
    replicas: 1
    selector:
        matchLabels:
            app: notification
    template:
        metadata:
            labels:
                app: notification
        spec:
            containers:
                - name: notification
                  image: localhost/cloud-infra-notification:latest
                  imagePullPolicy: IfNotPresent
                  env:
                      - name: SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR
                        value: "nacos-service:8848"
                      - name: SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR
                        value: "nacos-service:8848"
                      - name: SPRING_CONFIG_ADDITIONAL-LOCATION
                        value: "file:/app/config/"
                      - name: SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING
                        value: "true"
                  volumeMounts:
                      - name: config-volume
                        mountPath: /app/config
                  ports:
                      - containerPort: 9400
                  resources:
                      requests:
                          memory: 512Mi
                      limits:
                          memory: 2Gi
            volumes:
                - name: config-volume
                  configMap:
                      name: cloud-infra-config
---
apiVersion: v1
kind: Service
metadata:
    name: notification-service
spec:
    ports:
        - port: 9400
          targetPort: 9400
    selector:
        app: notification
