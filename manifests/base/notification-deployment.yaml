apiVersion: apps/v1
kind: Deployment
metadata:
    name: notification-service
spec:
    replicas: 1
    selector:
        matchLabels:
            app: notification
    template:
        metadata:
            labels:
                app: notification
        spec:
            containers:
                - name: notification
                  image: localhost/cloud-infra-notification:latest
                  imagePullPolicy: IfNotPresent
                  env:
                      - name: AUTH_JWT_SECRET
                        valueFrom:
                            secretKeyRef:
                                name: cloud-infra-secrets
                                key: jwt.secret
                      - name: INTERNAL_CALL_SECRET
                        valueFrom:
                            secretKeyRef:
                                name: cloud-infra-secrets
                                key: internalCall.secret
                      - name: SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR
                        value: "nacos-service:8848"
                      - name: SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR
                        value: "nacos-service:8848"
                      - name: JAVA_OPTS
                        value: "-XX:+UseSerialGC -Xmx256m -Xms128m -XX:+UseContainerSupport"
                  ports:
                      - name: app
                        containerPort: 8084
                      - name: management
                        containerPort: 9301
                  startupProbe:
                      httpGet:
                          path: /management/health/readiness
                          port: 9301
                      periodSeconds: 5
                      timeoutSeconds: 5
                      failureThreshold: 60
                  livenessProbe:
                      httpGet:
                          path: /management/health/liveness
                          port: 9301
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 6
                  readinessProbe:
                      httpGet:
                          path: /management/health/readiness
                          port: 9301
                      periodSeconds: 5
                      timeoutSeconds: 3
                      failureThreshold: 3
                  resources:
                      requests:
                          cpu: 250m
                          memory: 256Mi
                      limits:
                          cpu: 500m
                          memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
    name: notification-service
spec:
    ports:
        - port: 8084
          targetPort: 8084
    selector:
        app: notification
