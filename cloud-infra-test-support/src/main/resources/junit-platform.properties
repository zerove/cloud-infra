# 自动检测并注册所有 Testcontainers 失败诊断扩展。
#
# ⚠️ 为什么用 auto-detection 而不是 @ExtendWith 逐个标注:
#   本项目 19 个 IT 文件引用 InfrastructureContainers, 逐个标注意味着
#   新增 IT 时**可能忘记** —— 而漏掉的那个恰好不会打印诊断,
#   于是"看起来有诊断", 实则对新测试无效(假门禁, AGENTS.md 第八课补记三)。
#   auto-detection 是声明式的: 扩展一旦存在, 所有 IT 自动生效, 无需逐个标注。
#
# ⚠️ 作用域: 本文件在 test-support 模块的 resources 下, 只有依赖该模块的
#    模块才继承它。各业务模块的 pom 需确实依赖 cloud-infra-test-models。
#
# ⚠️ 这个开关是**全局**的: 任何在 classpath 上有本文件的模块都会启用
#    扩展的自动检测。若某模块因此加载了意料之外的扩展,
#    症状是测试行为变化而非编译错误 —— 故此处显式记录意图。
junit.jupiter.extensions.autodetection.enabled=true
