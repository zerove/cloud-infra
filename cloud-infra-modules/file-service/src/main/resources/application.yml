spring:
  application:
    name: cloud-file
  main:
    allow-bean-definition-overriding: true
  config:
    import: "optional:nacos:file-service.yaml"
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_CONFIG_ADDR:${NACOS_ADDR:nacos-service:8848}}
        file-extension: yaml
        import-check:
          enabled: false
        shared-configs:
          - data-id: actuator-config.yaml
            refresh: true
      discovery:
        server-addr: ${NACOS_DISCOVERY_ADDR:${NACOS_ADDR:nacos-service:8848}}

# Zipkin/OpenTelemetry 追踪配置
tracing:
  enabled: true
  sampling:
    probability: 1.0
  zipkin:
    enabled: true
    endpoint: http://zipkin:9411/api/v2/spans
    sender:
      type: web
  otel:
    exporter:
      zipkin:
        endpoint: http://zipkin:9411/api/v2/spans
      otlp:
        endpoint: http://otel-collector:4317

management:
  server:
    port: 9301
  endpoints:
    web:
      base-path: /management
      exposure:
        include: "*"
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://otel-collector:4317