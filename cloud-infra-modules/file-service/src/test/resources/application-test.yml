spring:
  application:
    name: file-service
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false
    discovery:
      enabled: false
    service-registry:
      auto-registration:
        enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  data:
    redis:
      host: ${TEST_REDIS_HOST:localhost}
      port: ${TEST_REDIS_PORT:6379}
      database: 0
  mybatis-plus:
    mapper-locations: classpath:/mapper/**/*.xml
    type-aliases-package: com.cloudinfra.**.domain
    global-config:
      banner: false
---
spring:
  config:
    activate:
      on-profile: test
