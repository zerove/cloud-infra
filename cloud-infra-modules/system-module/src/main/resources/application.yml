spring:
  application:
    name: system-module
  main:
    allow-bean-definition-overriding: true
  # 默认数据源配置（供自动配置启动，Nacos 配置会覆盖）
  datasource:
    url: jdbc:postgresql://cloud-postgres:5432/cloud_infra
    username: postgres
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 30000
      validation-timeout: 5000
      leak-detection-threshold: 60000
      connection-test-query: SELECT 1
      pool-name: cloud-infra-system-hikari-pool
      read-only: false
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
        reWriteBatchedInserts: true
        ApplicationName: cloud-infra-system

  # 默认 Redis 配置
  data:
    redis:
      host: cloud-redis
      port: 6379
      database: 0

  cloud:
    nacos:
      config:
        server-addr: ${NACOS_CONFIG_ADDR:${NACOS_ADDR:cloud-nacos:8848}}
        import-check:
          enabled: false
      discovery:
        server-addr: ${NACOS_DISCOVERY_ADDR:${NACOS_ADDR:cloud-nacos:8848}}
    stream:
      # 显式声明函数定义：binding 名（txMessageConsumer-in-0）无法推断出 bean 名（txMessageConsumerFunction），
      # 不声明则 Consumer binding 永不激活（消息发到无消费者的 exchange 直接丢失）
      function:
        definition: txMessageConsumerFunction;txMessageDlqConsumerFunction
      bindings:
        # 事务消息
        txMessageConsumerFunction-in-0:
          destination: sys.tx.message.retry
          group: cloud-system-group
        txMessageDlqConsumerFunction-in-0:
          destination: sys.tx.message.dlq
          group: cloud-system-group
        # 用户事件
        user-events-out-0:
          destination: user.events
          content-type: application/json
          producer:
            required-groups: notification-service
        user-events-in-0:
          destination: user.events
          group: cloud-system-group
        # 数据变更事件
        data-change-events-out-0:
          destination: data.change.events
          content-type: application/json
        data-change-events-in-0:
          destination: data.change.events
          group: cloud-system-group
        # 操作日志事件（搜索服务）
        search-operlog-out-0:
          destination: search.operlog
          content-type: application/json
      rabbit:
        bindings:
          txMessageConsumerFunction-in-0:
            consumer:
              auto-bind-dlq: true
              # DLQ 拓扑对齐：republish 目标与 DLQ 消费者监听须一致
              # （dlq-name 非有效属性，会被静默忽略，导致消息丢失）
              dead-letter-queue-name: sys.tx.message.dlq
              dead-letter-exchange: sys.tx.message.dlq
              dead-letter-exchange-type: topic
              dead-letter-routing-key: sys.tx.message.dlq
              republish-to-dlq: true

  # Flyway 数据库迁移配置
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    baseline-description: "Initial schema"
    locations: classpath:db/migration
    encoding: UTF-8
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false

  # gRPC 服务配置
  grpc:
    server:
      port: 9090
      reflection: true
      max-inbound-message-size: 10485760
      max-inbound-metadata-size: 8192
      keep-alive-time: 30
      keep-alive-timeout: 10
      permit-keep-alive-time: 10
      max-connection-idle: 300
      max-connection-age: 3600
      max-connection-age-grace: 120
      flow-control-window: 1048576
      min-time-between-keep-alive: 10
    client:
      max-inbound-message-size: 10485760
      keep-alive-time: 30
      keep-alive-timeout: 10
      keep-alive-without-calls: true

# 追踪配置由 management.tracing 与 management.otlp 统一管理

management:
  server:
    port: 9301
  endpoints:
    web:
      base-path: /management
      exposure:
        include: health,info,prometheus,metrics,env,beans,conditions,refresh
  tracing:
    sampling:
      probability: 1.0