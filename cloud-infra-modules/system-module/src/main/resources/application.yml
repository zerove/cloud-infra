server:
  port: 9300
  shutdown: graceful

spring:
  application:
    name: system-module
  lifecycle:
    timeout-per-shutdown-phase: 30s
  config:
    import: "optional:nacos:system-module.yaml"
  main:
    allow-bean-definition-overriding: true
  datasource:
    driver-class-name: org.postgresql.Driver
    type: org.postgresql.ds.PGSimpleDataSource
    url: jdbc:postgresql://${SPRING_DATASOURCE_HOST:127.0.0.1}:${SPRING_DATASOURCE_PORT:5432}/cloud_infra
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis-server}
      port: 6379
      database: 0
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
    stream:
      bindings:
        txMessageOut-out-0:
          destination: tx.message.exchange
          content-type: application/json
        search-operlog-out-0:
          destination: search-operlog-topic
      rabbit:
        binder:
          brokers: ${SPRING_RABBITMQ_HOST:rabbitmq-server}
        bindings:
          txMessageOut-out-0:
            producer:
              confirm-type: correlated
          search-operlog-out-0:
            producer:
              routing-key-expression: "'search-operlog-key'"

management:
  server:
    port: 9301
  endpoints:
    web:
      base-path: /management
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true


mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
