spring:
  main:
    allow-bean-definition-overriding: true
  cloud:
    stream:
      bindings:
        # 事务消息
        txMessageOut-out-0:
          destination: sys.tx.message.retry
          group: cloud-system-group
        txMessageConsumer-in-0:
          destination: sys.tx.message.retry
          group: cloud-system-group
        txMessageDlqConsumer-in-0:
          destination: sys.tx.message.dlq
          group: cloud-system-group
        # 用户事件
        user-events-out-0:
          destination: user.events
          content-type: application/json
          producer:
            required-groups: notification-service
        user-events-in-0:
          destination: user.events
          group: cloud-system-group
        # 数据变更事件
        data-change-events-out-0:
          destination: data.change.events
          content-type: application/json
        data-change-events-in-0:
          destination: data.change.events
          group: cloud-system-group
        # 操作日志事件（搜索服务）
        search-operlog-out-0:
          destination: search.operlog
          content-type: application/json
      rabbit:
        bindings:
          txMessageConsumer-in-0:
            consumer:
              auto-bind-dlq: true
              dlq-name: sys.tx.message.dlq
              republish-to-dlq: true

  # Seata 分布式事务配置
  seata:
    enabled: true
    application-id: ${spring.application.name}
    tx-service-group: ${spring.application.name}-tx-group
    service:
      vgroup-mapping:
        cloud-infra-system: default
    registry:
      type: nacos
      nacos:
        server-addr: ${NACOS_DISCOVERY_ADDR:${NACOS_ADDR:nacos-service:8848}}
        namespace: ${spring.cloud.nacos.discovery.namespace}
    config:
      type: nacos
      nacos:
        server-addr: ${NACOS_CONFIG_ADDR:${NACOS_ADDR:nacos-service:8848}}
        namespace: ${spring.cloud.nacos.config.namespace}
    client:
      rm:
        async-commit-buffer-limit: 1000
        report-success-enable: true
        lock:
          retry-interval: 10
          retry-times: 30
        report-retry-count: 5
      tm:
        commit-retry-count: 5
        rollback-retry-count: 5
        default-global-transaction-timeout: 60000

  # Flyway 数据库迁移配置
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    baseline-description: "Initial schema"
    locations: classpath:db/migration
    encoding: UTF-8
    validate-on-migrate: true
    clean-disabled: false
    out-of-order: false

  # gRPC 服务配置
  grpc:
    server:
      port: 9090
      reflection: true
      max-inbound-message-size: 10485760
      max-inbound-metadata-size: 8192
      keep-alive-time: 30
      keep-alive-timeout: 10
      permit-keep-alive-time: 10
      max-connection-idle: 300
      max-connection-age: 3600
      max-connection-age-grace: 120
      flow-control-window: 1048576
      min-time-between-keep-alive: 10
    client:
      max-inbound-message-size: 10485760
      keep-alive-time: 30
      keep-alive-timeout: 10
      keep-alive-without-calls: true

# Zipkin/OpenTelemetry 追踪配置
# tracing: (removed dead zipkin/otel config)
  enabled: true
  sampling:
    probability: 1.0
  zipkin:
    enabled: true
    endpoint: http://zipkin:9411/api/v2/spans
    sender:
      type: web
  otel:
    exporter:
      zipkin:
        endpoint: http://zipkin:9411/api/v2/spans
      otlp:
        endpoint: http://otel-collector:4317

management:
  server:
    port: 9301
  endpoints:
    web:
      base-path: /management
      exposure:
        include: "*"
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://otel-collector:4317