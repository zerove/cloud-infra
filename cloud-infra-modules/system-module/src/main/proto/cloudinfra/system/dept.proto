syntax = "proto3";

package cloudinfra.system;

option java_package = "com.cloudinfra.system.grpc";
option java_multiple_files = true;
option java_outer_classname = "DeptProto";

// 实验性接口：默认禁用，鉴权未完成，禁止生产开启。
service SysDeptService {
  // 获取部门详情
  rpc GetDept(GetDeptRequest) returns (DeptResponse);
  // 分页查询部门列表
  rpc ListDepts(ListDeptsRequest) returns (ListDeptsResponse);
  // 创建部门
  rpc CreateDept(CreateDeptRequest) returns (DeptResponse);
  // 更新部门
  rpc UpdateDept(UpdateDeptRequest) returns (DeptResponse);
  // 删除部门
  rpc DeleteDept(DeleteDeptRequest) returns (DeleteDeptResponse);
  // 获取部门树
  rpc GetDeptTree(GetDeptTreeRequest) returns (DeptTreeResponse);
}

// ===== Request/Response Messages =====

message GetDeptRequest {
  int64 dept_id = 1;
}

message ListDeptsRequest {
  // 0 使用默认第 1 页，范围 1..100000。
  int32 page_num = 1;
  // 0 使用默认 20 条，范围 1..100。
  int32 page_size = 2;
  string dept_name = 3;
  string status = 4;
}

message CreateDeptRequest {
  int64 parent_id = 1;
  string dept_name = 2;
  int32 order_num = 3;
  string leader = 4;
  string phone = 5;
  string email = 6;
  string status = 7;
}

message UpdateDeptRequest {
  int64 dept_id = 1;
  optional int64 parent_id = 2;
  optional string dept_name = 3;
  optional int32 order_num = 4;
  optional string leader = 5;
  optional string phone = 6;
  optional string email = 7;
  optional string status = 8;
}

message DeleteDeptRequest {
  int64 dept_id = 1;
}

message GetDeptTreeRequest {
  // 0 返回完整树，大于 0 返回指定根节点及其后代，找不到返回 NOT_FOUND。
  int64 root_id = 1;
}

message DeptResponse {
  int64 dept_id = 1;
  int64 parent_id = 2;
  string dept_name = 3;
  int32 order_num = 4;
  string leader = 5;
  string phone = 6;
  string email = 7;
  string status = 8;
  int64 create_time = 9;
  int64 update_time = 10;
  repeated DeptResponse children = 11;
}

message ListDeptsResponse {
  repeated DeptResponse records = 1;
  int64 total = 2;
  int32 page_num = 3;
  int32 page_size = 4;
}

message DeptTreeResponse {
  repeated DeptResponse nodes = 1;
}

message DeleteDeptResponse {
  bool success = 1;
  string message = 2;
}