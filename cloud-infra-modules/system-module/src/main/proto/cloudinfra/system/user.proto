syntax = "proto3";

package cloudinfra.system;

option java_package = "com.cloudinfra.system.grpc";
option java_multiple_files = true;
option java_outer_classname = "UserProto";

// 实验性接口：默认禁用，鉴权未完成，禁止生产开启。
service SysUserService {
  // 获取用户详情
  rpc GetUser(GetUserRequest) returns (UserResponse);
  // 分页查询用户列表
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  // 创建用户
  rpc CreateUser(CreateUserRequest) returns (UserResponse);
  // 更新用户
  rpc UpdateUser(UpdateUserRequest) returns (UserResponse);
  // 删除用户
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
  // 尚未实现，固定返回 UNIMPLEMENTED，等待 P2 鉴权专项
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);
}

// ===== Request/Response Messages =====

message GetUserRequest {
  int64 user_id = 1;
}

message ListUsersRequest {
  // 0 使用默认第 1 页，范围 1..100000。
  int32 page_num = 1;
  // 0 使用默认 20 条，范围 1..100。
  int32 page_size = 2;
  string username = 3;
  string status = 4;
  string dept_id = 5;
}

message CreateUserRequest {
  string username = 1;
  string password = 2;
  string nickname = 3;
  string email = 4;
  string phone = 5;
  // 暂不支持，创建请求必须为空，响应固定为空。
  string sex = 6;
  int64 dept_id = 7;
  // 当前仅支持单角色，多个值会被拒绝，更新时空列表表示不修改。
  repeated int64 role_ids = 8;
  // 当前仅支持单岗位，多个值会被拒绝，更新时空列表表示不修改。
  repeated int64 post_ids = 9;
}

message UpdateUserRequest {
  int64 user_id = 1;
  optional string nickname = 2;
  optional string email = 3;
  optional string phone = 4;
  // 暂不支持，更新请求不得提供。
  optional string sex = 5;
  optional string status = 6;
  optional int64 dept_id = 7;
  // 当前仅支持单角色，多个值会被拒绝，更新时空列表表示不修改。
  repeated int64 role_ids = 8;
  // 当前仅支持单岗位，多个值会被拒绝，更新时空列表表示不修改。
  repeated int64 post_ids = 9;
}

message DeleteUserRequest {
  repeated int64 user_ids = 1;
}

message ResetPasswordRequest {
  int64 user_id = 1;
  string password = 2;
}

message UserResponse {
  int64 user_id = 1;
  string username = 2;
  string nickname = 3;
  string email = 4;
  string phone = 5;
  // 暂不支持，创建请求必须为空，响应固定为空。
  string sex = 6;
  string status = 7;
  int64 dept_id = 8;
  string dept_name = 9;
  repeated string role_keys = 10;
  repeated string role_names = 11;
  repeated string post_codes = 12;
  repeated string post_names = 13;
  int64 create_time = 14;
  int64 update_time = 15;
}

message ListUsersResponse {
  repeated UserResponse records = 1;
  int64 total = 2;
  int32 page_num = 3;
  int32 page_size = 4;
}

message DeleteUserResponse {
  int32 affected_rows = 1;
}

message ResetPasswordResponse {
  bool success = 1;
  string message = 2;
}