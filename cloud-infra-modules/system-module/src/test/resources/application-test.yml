spring:
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false
  config:
    import: "optional:classpath:application-test.yml"
  datasource:
    url: jdbc:postgresql://${SPRING_DATASOURCE_HOST:localhost}:${SPRING_DATASOURCE_PORT:5432}/cloud_infra
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  sql:
    init:
      mode: always
  data:
    redis:
      host: localhost
      port: 6379
      enabled: false
