server:
  port: 8099

spring:
  application:
    name: demo-service
  config:
    import: "optional:nacos:demo-service.yaml"
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_CONFIG_ADDR:${NACOS_ADDR:nacos-service:8848}}
        file-extension: yaml
        shared-configs:
          - data-id: actuator-config.yaml
            refresh: true
        import-check:
          enabled: false
      discovery:
        server-addr: ${NACOS_DISCOVERY_ADDR:${NACOS_ADDR:nacos-service:8848}}
  main:
    allow-bean-definition-overriding: true

# 平台能力配置
cloud-infra:
  tenant:
    enabled: false
    require-tenant: false
  outbox:
    enabled: true
    poll-interval-ms: 1000
    batch-size: 100
    cleanup-days: 7

management:
  server:
    port: 9301
  endpoints:
    web:
      base-path: /management
      exposure:
        include: "*"
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://otel-collector:4317
