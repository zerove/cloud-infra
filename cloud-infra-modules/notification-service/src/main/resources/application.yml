server:
  port: 9400

spring:
  application:
    name: cloud-notification
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_DISCOVERY_ADDR:${NACOS_ADDR:nacos-service:8848}}
        ip: ${POD_IP:127.0.0.1}
        prefer-ip-address: true
      config:
        server-addr: ${NACOS_CONFIG_ADDR:${NACOS_ADDR:nacos-service:8848}}
        file-extension: yaml
        shared-configs:
          - data-id: actuator-config.yaml
            refresh: true
  config:
    import: "optional:nacos:notification-service.yaml"
  threads:
    virtual:
      enabled: true
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${SPRING_DATASOURCE_HOST:postgres-server}:5432/cloud_infra
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  main:
    allow-bean-definition-overriding: true

management:
  server:
    port: 9301
  endpoints:
    web:
      base-path: /management
      exposure:
        include: "*"
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://otel-collector:4317
