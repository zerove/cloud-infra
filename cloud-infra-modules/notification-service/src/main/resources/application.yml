spring:
  application:
    name: cloud-notification
  autoconfigure:
    exclude:
      - com.cloudinfra.framework.mybatis.config.MybatisPlusConfig
      - com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration
      - org.mybatis.spring.boot.autoconfigure.MybatisAutoConfiguration
  config:
    import: "optional:nacos:notification-service.yaml"
  cloud:
    nacos:
      config:
        enabled: false
        server-addr: ${SPRING_CLOUD_NACOS_SERVER_ADDR:nacos:8848}
        file-extension: yaml
        import-check:
          enabled: false
        fail-fast: false
      discovery:
        server-addr: ${SPRING_CLOUD_NACOS_SERVER_ADDR:nacos:8848}
  threads:
    virtual:
      enabled: true
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${SPRING_DATASOURCE_HOST:postgres-server}:5432/cloud_infra
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.cloudinfra.notification.domain


