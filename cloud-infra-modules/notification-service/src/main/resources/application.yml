spring:
  application:
    name: notification-service
  threads:
    virtual:
      enabled: true
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
    function:
      definition: notificationConsumer
    stream:
      bindings:
        "[notificationConsumer-in-0]":
          destination: tx.message.exchange
          group: notification-group
      rabbit:
        bindings:
          "notificationConsumer-in-0":
            consumer:
              bind-queue: true
              queue-name: notification-queue
              exchange-type: topic
              routing-key: "#"

server:
  port: 8083

logging:
  level:
    com.cloudinfra: info
