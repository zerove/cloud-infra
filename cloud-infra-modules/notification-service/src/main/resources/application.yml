server:
  port: 8084

spring:
  application:
    name: notification-service

  # 默认 Redis 配置
  data:
    redis:
      host: cloud-redis
      port: 6379
      database: 0

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_DISCOVERY_ADDR:${NACOS_ADDR:cloud-nacos:8848}}
      config:
        server-addr: ${NACOS_CONFIG_ADDR:${NACOS_ADDR:cloud-nacos:8848}}
        file-extension: yaml
        import-check:
          enabled: false
    stream:
      bindings:
        user-events-in-0:
          destination: user.events
          group: cloud-notification-group
          consumer:
            max-attempts: 3
            back-off-initial-interval: 1000
            back-off-multiplier: 2.0
            back-off-max-interval: 10000
      rabbit:
        bindings:
          user-events-in-0:
            consumer:
              auto-bind-dlq: true
              dlq-name: user.events.dlq
              republish-to-dlq: true
    threads:
      virtual:
        enabled: true
    task:
      scheduling:
        # Spring Boot 默认 pool.size=1, 即全模块共用一个调度线程。
        # NotificationDispatchRecoveryTask 的扫描会 join() 等待整批 MQ 投递完成,
        # broker 不可达时单条可阻塞到连接超时, 于是补扫一旦卡住就会连带
        # 拖住本模块所有其他 @Scheduled 任务。给两个线程让它们互不阻塞。
        pool:
          size: 2
        thread-name-prefix: notif-sched-
    datasource:
      driver-class-name: org.postgresql.Driver
      url: jdbc:postgresql://${SPRING_DATASOURCE_HOST:cloud-postgres}:${SPRING_DATASOURCE_PORT:5432}/cloud_infra
      username: ${SPRING_DATASOURCE_USERNAME:postgres}
      password: ${SPRING_DATASOURCE_PASSWORD:password}
    main:
      allow-bean-definition-overriding: true
  config:
    import:
      - optional:nacos:actuator-config.yaml

management:
  server:
    port: 9301
  endpoints:
    web:
      base-path: /management
      exposure:
        include: health,info,prometheus,metrics,env,beans,conditions,refresh
  tracing:
    sampling:
      probability: 1.0