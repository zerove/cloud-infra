server:
  port: 9400

spring:
  application:
    name: cloud-notification
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_DISCOVERY_ADDR:${NACOS_ADDR:nacos-service:8848}}
        ip: ${POD_IP:127.0.0.1}
        prefer-ip-address: true
      config:
        server-addr: ${NACOS_CONFIG_ADDR:${NACOS_ADDR:nacos-service:8848}}
        file-extension: yaml
        shared-configs:
          - data-id: actuator-config.yaml
            refresh: true
    stream:
      bindings:
        user-events-in-0:
          destination: user.events
          group: cloud-notification-group
          consumer:
            max-attempts: 3
            back-off-initial-interval: 1000
            back-off-multiplier: 2.0
            back-off-max-interval: 10000
        notification-send-out-0:
          destination: notification.send
          content-type: application/json
      rabbit:
        bindings:
          user-events-in-0:
            consumer:
              auto-bind-dlq: true
              dlq-name: user.events.dlq
              republish-to-dlq: true
  config:
    import: "optional:nacos:notification-service.yaml"
  threads:
    virtual:
      enabled: true
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${SPRING_DATASOURCE_HOST:postgres-server}:5432/cloud_infra
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  main:
    allow-bean-definition-overriding: true

management:
  server:
    port: 9301
  endpoints:
    web:
      base-path: /management
      exposure:
        include: "*"
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://otel-collector:4317