mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

spring:
  datasource:
    url: jdbc:h2:mem:notification_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
  data:
    redis:
      host: ${TEST_REDIS_HOST:localhost}
      port: ${TEST_REDIS_PORT:6379}
      database: 0
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false
      service-registry:
        auto-registration:
          enabled: false
  config:
    import: "optional:classpath:application.yml"

auth:
  jwt:
    secret: "test-secret-key-for-integration-testing-minimum-32-chars"