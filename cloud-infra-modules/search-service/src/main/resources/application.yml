spring:
  application:
    name: cloud-search
  config:
    import: "optional:nacos:search-service.yaml"
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_CONFIG_ADDR:${NACOS_ADDR:nacos-service:8848}}
        file-extension: yaml
        import-check:
          enabled: false
        shared-configs:
          - data-id: actuator-config.yaml
            refresh: true
      discovery:
        server-addr: ${NACOS_DISCOVERY_ADDR:${NACOS_ADDR:nacos-service:8848}}
  main:
    allow-bean-definition-overriding: true

management:
  server:
    port: 9301
  endpoints:
    web:
      base-path: /management
      exposure:
        include: "*"
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://otel-collector:4317
