spring:
  application:
    name: search-service
  config:
    import:
      - optional:nacos:actuator-config.yaml
  # 默认数据源配置（供自动配置启动，Nacos 配置会覆盖）
  datasource:
    url: jdbc:postgresql://cloud-postgres:5432/cloud_infra
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 30000
      validation-timeout: 5000
      leak-detection-threshold: 60000
      connection-test-query: SELECT 1
      pool-name: cloud-infra-search-hikari-pool
      read-only: false
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
        reWriteBatchedInserts: true
        ApplicationName: cloud-infra-search

  # 默认 Redis 配置
  data:
    redis:
      host: cloud-redis
      port: 6379
      database: 0

  cloud:
    nacos:
      config:
        server-addr: ${NACOS_CONFIG_ADDR:${NACOS_ADDR:cloud-nacos:8848}}
        file-extension: yaml
        import-check:
          enabled: false
      discovery:
        server-addr: ${NACOS_DISCOVERY_ADDR:${NACOS_ADDR:cloud-nacos:8848}}
  main:
    allow-bean-definition-overriding: true

# 追踪配置由 management.tracing 与 management.otlp 统一管理

management:
  server:
    port: 9301
  endpoints:
    web:
      base-path: /management
      exposure:
        include: health,info,prometheus,metrics,env,beans,conditions,refresh
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://otel-collector:4317