syntax = "proto3";

option java_package = "com.cloudinfra.api.system.grpc";
option java_multiple_files = true;
option java_outer_classname = "UserServiceProto";

package com.cloudinfra.api.system.grpc;

// 用户数据传输对象
message UserDTO {
  int64 userId = 1;
  string username = 2;
  string realName = 3;
  string email = 4;
  string phone = 5;
  string avatar = 6;
  int32 status = 7;
  int64 deptId = 8;
  int64 roleId = 9;
  repeated string permissions = 10;
  string createTime = 11;
  string updateTime = 12;
}

// 通用响应
message Result {
  int32 code = 1;
  string message = 2;
  bool success = 3;
  bytes data = 4;  // 使用 bytes 存储序列化后的数据
}

// 请求消息
message GetUserByIdRequest {
  int64 userId = 1;
}

message GetUserByUsernameRequest {
  string username = 1;
}

message GetPermissionsByUserIdRequest {
  int64 userId = 1;
}

message RegisterUserRequest {
  UserDTO userDTO = 1;
}

// 响应消息
message GetUserByIdResponse {
  Result result = 1;
  UserDTO user = 2;
}

message GetUserByUsernameResponse {
  Result result = 1;
  UserDTO user = 2;
}

message GetPermissionsByUserIdResponse {
  Result result = 1;
  repeated string permissions = 2;
}

message RegisterUserResponse {
  Result result = 1;
}

// 用户 gRPC 服务定义
service UserService {
  // 根据 ID 获取用户
  rpc GetUserById(GetUserByIdRequest) returns (GetUserByIdResponse);
  
  // 根据用户名获取用户
  rpc GetUserByUsername(GetUserByUsernameRequest) returns (GetUserByUsernameResponse);
  
  // 根据用户 ID 获取权限列表
  rpc GetPermissionsByUserId(GetPermissionsByUserIdRequest) returns (GetPermissionsByUserIdResponse);
  
  // 注册用户
  rpc RegisterUser(RegisterUserRequest) returns (RegisterUserResponse);
}