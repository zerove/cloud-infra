kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  extraPortMappings:
  - containerPort: 9000
    hostPort: 9000
    listenAddress: "0.0.0.0"
  - containerPort: 9200
    hostPort: 9200
    listenAddress: "0.0.0.0"
  - containerPort: 15672
    hostPort: 15672
    listenAddress: "0.0.0.0"
  - containerPort: 8848
    hostPort: 8848
    listenAddress: "0.0.0.0"
