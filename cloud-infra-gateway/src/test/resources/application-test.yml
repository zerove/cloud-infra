spring:
  application:
    name: gateway
  data:
    redis:
      host: ${TEST_REDIS_HOST:localhost}
      port: ${TEST_REDIS_PORT:6379}
      database: 0
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false
---
spring:
  config:
    activate:
      on-profile: test
