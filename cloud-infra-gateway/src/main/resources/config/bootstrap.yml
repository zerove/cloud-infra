spring:
  cloud:
    nacos:
      config:
        server-addr: nacos-service:8848
        file-extension: yaml
        shared-configs:
          - data-id: actuator-config.yaml
            refresh: true
        import-check:
          enabled: false
      discovery:
        server-addr: nacos-service:8848
  config:
    import: optional:nacos:gateway.yaml
