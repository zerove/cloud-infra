spring:
  config:
    import:
      - optional:nacos:gateway.yaml?group=DEFAULT_GROUP
      - optional:nacos:actuator-config.yaml?group=DEFAULT_GROUP
      - optional:nacos:auth-white-list.yaml?group=DEFAULT_GROUP
  cloud:
    nacos:
      config:
        fail-fast: false

# 开发环境：放宽 Nacos 依赖，允许本地直启
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,env,beans,conditions,refresh