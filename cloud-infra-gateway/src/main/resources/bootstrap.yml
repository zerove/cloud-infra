spring:
  application:
    name: gateway-module
  cloud:
    nacos:
      discovery:
        server-addr: ${SPRING_CLOUD_NACOS_SERVER_ADDR:127.0.0.1:8848}
      config:
        server-addr: ${SPRING_CLOUD_NACOS_SERVER_ADDR:127.0.0.1:8848}
        file-extension: yaml
        namespace: public
        group: DEFAULT_GROUP
        refresh-enabled: true
        shared-configs:
          - data-id: actuator-config.yaml
            group: DEFAULT_GROUP
            refresh: true
    sentinel:
      datasource:
        gateway-flow-rules:
          nacos:
            server-addr: ${SPRING_CLOUD_NACOS_SERVER_ADDR:127.0.0.1:8848}
            data-id: gateway-flow-rules
            group-id: SENTINEL_GROUP
            data-type: json
            rule-type: gw-flow


