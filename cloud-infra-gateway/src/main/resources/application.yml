spring:
  application:
    name: cloud-gateway
  config:
    import: "optional:nacos:gateway.yaml"
  cloud:
    nacos:
      config:
        server-addr: ${SPRING_CLOUD_NACOS_SERVER_ADDR:nacos:8848}
        file-extension: yaml
        import-check:
          enabled: false
      discovery:
        server-addr: ${SPRING_CLOUD_NACOS_SERVER_ADDR:nacos:8848}
