server:
  port: 9000

auth:
  white-list:
    - /auth/

spring:
  threads:
    virtual:
      enabled: true
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      mvc:
        routes:
          - id: system-module
            uri: lb://system-module
            predicates:
              - Path=/system/**
            filters:
              - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,info
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
        step: 15s

logging:
  level:
    com.cloudinfra.cloudinfra.gateway.filter: DEBUG

spring:
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
