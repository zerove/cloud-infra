spring:
    cloud:
        refresh:
            enabled: false
        nacos:
            config:
                import-check:
                    enabled: false
                fail-fast: false
                shared-configs:
                  - data-id: actuator-config.yaml
                    refresh: true
    autoconfigure:
        exclude:
          - org.springframework.boot.tomcat.autoconfigure.metrics.TomcatMetricsAutoConfiguration
    config:
        import: optional:nacos:gateway.yaml

management:
  server:
    port: 9301
  endpoints:
    web:
      base-path: /management
      exposure:
        include: "*"
  metrics:
    binders:
      tomcat:
        enabled: false
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://otel-collector:4317
