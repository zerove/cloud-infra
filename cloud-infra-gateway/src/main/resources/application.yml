spring:
  application:
    name: cloud-infra-gateway
  cloud:
    refresh:
      enabled: false
    nacos:
      config:
        import-check:
          enabled: false
        shared-configs:
          - data-id: actuator-config.yaml
            refresh: true
      discovery:
        server-addr: ${NACOS_DISCOVERY_ADDR:${NACOS_ADDR:cloud-nacos:8848}}

  # 默认 Redis 配置（虚拟线程需要）
  data:
    redis:
      host: cloud-redis
      port: 6379
      database: 0

# Sentinel 配置（本地默认值，Nacos 配置会覆盖）
sentinel:
  transport:
    dashboard: cloud-sentinel:8858
    port: 8719
  datasource:
    flow:
      nacos:
        server-addr: cloud-nacos:8848
        data-id: cloud-infra-gateway-sentinel-flow
        group-id: DEFAULT_GROUP
        data-type: json
        rule-type: flow
        enabled: true
    degrade:
      nacos:
        server-addr: cloud-nacos:8848
        data-id: cloud-infra-gateway-sentinel-degrade
        group-id: DEFAULT_GROUP
        data-type: json
        rule-type: degrade
        enabled: true
    param-flow:
      nacos:
        server-addr: cloud-nacos:8848
        data-id: cloud-infra-gateway-sentinel-param-flow
        group-id: DEFAULT_GROUP
        data-type: json
        rule-type: param-flow
        enabled: true
    system:
      nacos:
        server-addr: cloud-nacos:8848
        data-id: cloud-infra-gateway-sentinel-system
        group-id: DEFAULT_GROUP
        data-type: json
        rule-type: system
        enabled: true
    authority:
      nacos:
        server-addr: cloud-nacos:8848
        data-id: cloud-infra-gateway-sentinel-authority
        group-id: DEFAULT_GROUP
        data-type: json
        rule-type: authority
        enabled: true

# 认证白名单（本地直启默认值，Nacos 配置会覆盖）
auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:***REMOVED-LEAKED-DEV-JWT-SECRET***}
    expire-time: ${AUTH_JWT_EXPIRE_TIME:86400000}
  white-list:
    - /auth/login
    - /auth/refresh
    - /auth/register
    - /auth/captchaImage
    - /actuator/health
    - /actuator/info
    - /actuator/prometheus
    - /v3/api-docs
    - /swagger-ui/
    - /webjars/

server:
  compression:
    enabled: true
    mime-types:
      - text/html
      - text/xml
      - text/plain
      - text/css
      - text/javascript
      - application/javascript
      - application/json
      - application/xml
      - application/rss+xml
      - image/svg+xml
    min-response-size: 1024

management:
  server:
    port: 9301
  endpoints:
    web:
      base-path: /management
      exposure:
        include: "*"
  metrics:
    binders:
      tomcat:
        enabled: false
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://otel-collector:4317