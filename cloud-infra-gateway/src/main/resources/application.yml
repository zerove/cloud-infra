spring:
   cloud:
       refresh:
           enabled: false
       nacos:
           config:
               import-check:
                   enabled: false
               fail-fast: false
               shared-configs:
                 - data-id: actuator-config.yaml
                   refresh: true
   autoconfigure:
       exclude:
         - org.springframework.boot.tomcat.autoconfigure.metrics.TomcatMetricsAutoConfiguration
   config:
       import: optional:nacos:gateway.yaml

server:
  compression:
    enabled: true
    mime-types:
      - text/html
      - text/xml
      - text/plain
      - text/css
      - text/javascript
      - application/javascript
      - application/json
      - application/xml
      - application/rss+xml
      - image/svg+xml
    min-response-size: 1024

# Zipkin/OpenTelemetry 追踪配置
tracing:
  enabled: true
  sampling:
    probability: 1.0
  zipkin:
    enabled: true
    endpoint: http://zipkin:9411/api/v2/spans
    sender:
      type: web
  otel:
    exporter:
      zipkin:
        endpoint: http://zipkin:9411/api/v2/spans
      otlp:
        endpoint: http://otel-collector:4317

management:
  server:
    port: 9301
  endpoints:
    web:
      base-path: /management
      exposure:
        include: "*"
  metrics:
    binders:
      tomcat:
        enabled: false
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://otel-collector:4317