# Dependabot 自动依赖更新
# 支持 Maven (pom.xml) 与 GitHub Actions
version: 2
updates:
  # Maven 依赖更新 (每周一检查)
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "maven"
    commit-message:
      prefix: "build"
      include: "scope"
    ignore:
      # 主要版本升级需人工评估
      - dependency-name: "org.springframework.boot"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springframework.cloud"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.alibaba.cloud"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.mybatis"
        update-types: ["version-update:semver-major"]

  # GitHub Actions 更新 (每周二检查)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    ignore:
      # actions/checkout v4 是最新稳定版，v7 不存在（dependabot 误报）
      - dependency-name: "actions/checkout"
        update-types: ["version-update:semver-major"]
      # docker/login-action v4 可能有 breaking changes，暂不升级
      - dependency-name: "docker/login-action"
        update-types: ["version-update:semver-major"]
      # actions/setup-java v4 稳定，v5 暂不升级
      - dependency-name: "actions/setup-java"
        update-types: ["version-update:semver-major"]
      # azure/setup-helm v4 稳定，v5 暂不升级
      - dependency-name: "azure/setup-helm"
        update-types: ["version-update:semver-major"]
      # actions/cache v4 稳定
      - dependency-name: "actions/cache"
        update-types: ["version-update:semver-major"]
      # actions/upload-artifact v4 稳定
      - dependency-name: "actions/upload-artifact"
        update-types: ["version-update:semver-major"]
      # azure/k8s-set-context v3 稳定
      - dependency-name: "azure/k8s-set-context"
        update-types: ["version-update:semver-major"]
      # codecov/codecov-action v4 稳定
      - dependency-name: "codecov/codecov-action"
        update-types: ["version-update:semver-major"]
      # docker/build-push-action v5 稳定
      - dependency-name: "docker/build-push-action"
        update-types: ["version-update:semver-major"]
      # docker/metadata-action v5 稳定
      - dependency-name: "docker/metadata-action"
        update-types: ["version-update:semver-major"]
      # github/codeql-action v3 稳定
      - dependency-name: "github/codeql-action"
        update-types: ["version-update:semver-major"]
      # graalvm/setup-graalvm v1 稳定
      - dependency-name: "graalvm/setup-graalvm"
        update-types: ["version-update:semver-major"]
      # dorny/test-reporter v1 稳定
      - dependency-name: "dorny/test-reporter"
        update-types: ["version-update:semver-major"]
      # returntocorp/semgrep-action v1 稳定
      - dependency-name: "returntocorp/semgrep-action"
        update-types: ["version-update:semver-major"]
      # slackapi/slack-github-action v1 稳定
      - dependency-name: "slackapi/slack-github-action"
        update-types: ["version-update:semver-major"]
