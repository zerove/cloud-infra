name: Codegen Template Regression

# 守护代码生成框架的模板不被无意修改。
# 模板回归测试：编译 codegen 模块 + 运行单元测试 + 验证生成代码可编译。

on:
  push:
    branches: [master, main]
    paths:
      - 'cloud-infra-codegen/**'
      - '.github/workflows/codegen-template-regression.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'cloud-infra-codegen/**'

env:
  MAVEN_OPTS: "-Xmx1G -Xms256m"
  JAVA_VERSION: "25"
  GRAALVM_VERSION: "25.0.1"

jobs:
  template-regression:
    name: Template Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25 (GraalVM)
        uses: graalvm/setup-graalvm@v1
        with:
          version: ${{ env.GRAALVM_VERSION }}
          java-version: ${{ env.JAVA_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('cloud-infra-codegen/**/pom.xml', 'pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 单元测试 (集成测试在下一个 job)
      - name: Run codegen-core unit tests
        run: mvn test -pl cloud-infra-codegen/cloud-infra-codegen-core -am --batch-mode

      # 2. maven-plugin 模块编译 (确保 plugin 可被加载)
      - name: Verify maven-plugin build
        run: mvn install -pl cloud-infra-codegen/cloud-infra-codegen-maven-plugin -am -DskipTests --batch-mode

      # 3. 验证 plugin 可被 Maven 解析
      - name: Verify plugin descriptor
        run: mvn help:describe -Dplugin=com.cloudinfra:cloud-infra-codegen-maven-plugin -Ddetail=true --batch-mode

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codegen-test-reports
          path: |
            cloud-infra-codegen/**/target/surefire-reports/
          retention-days: 7

  template-integration:
    name: Template Integration (Testcontainers PG)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: template-regression
    # CI 才有 Docker, 集成测试跑端到端
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25 (GraalVM)
        uses: graalvm/setup-graalvm@v1
        with:
          version: ${{ env.GRAALVM_VERSION }}
          java-version: ${{ env.JAVA_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('cloud-infra-codegen/**/pom.xml', 'pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run codegen integration test (requires Docker + -DrunCodegenIT=true)
        run: |
          mvn test -pl cloud-infra-codegen/cloud-infra-codegen-core \
            -Dtest=CodegenIntegrationTest -DrunCodegenIT=true --batch-mode

      - name: Upload generated code samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-code-samples
          path: |
            cloud-infra-codegen/**/target/generated-samples/
          retention-days: 7
