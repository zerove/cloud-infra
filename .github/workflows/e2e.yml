name: E2E Verify

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# E2E 跑全链路: mvn + podman build + compose 启动 + e2e 验收,
# 需要 Linux runner + podman + podman-compose + Java 25 + 充足磁盘 (>=10GB 镜像层)
# 单 PR 跑 1 次, 防止资源滥用; push 到 master 时多并发 (按服务拆分)
jobs:
  e2e:
    name: End-to-End Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Verify E2E gate integrity (negative control)
        # 2026-10-02 新增。
        #
        # 本仓库已记录 6 例"门禁看起来在守护, 实际从未生效", 其中 E2E 占了两处:
        #   ① verify-e2e.sh 的镜像构建上下文用服务目录, 6 个镜像全部构建失败,
        #      失败被 `| tail -3` 吞掉后仍打印 "PASS 6 个镜像构建完成";
        #   ② `podman-compose --profile full ... | tail -3` 报 invalid choice 也判 PASS。
        # 两者都只有"人肉读日志"才看得出来 —— 所以这里给门禁本身加一道负向对照:
        # 用假 podman 强制 build 失败, 断言脚本真的会判 FAIL。
        #
        # 若这一步变红, 说明有人把"吞掉错误"的写法改回来了。
        run: bash verify-e2e.sh --self-test
        # 注意: GitHub Actions 的**默认** shell 是 `bash -e {0}` —— **不含** `-o pipefail`;
        # 只有显式声明 `shell: bash` 才会变成 `bash --noprofile --norc -eo pipefail {0}`。
        # 本项目多个步骤用 `... | tee /tmp/x.log`, 一旦漏掉 pipefail,
        # 管道退出码取自 tee(恒 0), 脚本失败会被整个吞掉。
        shell: bash

      - name: Verify Dockerfile packaging integrity
        # 2026-10-02 新增。
        #
        # 起因: cloud-infra-gateway/Dockerfile 长期写着 `COPY target/*.jar app.jar`,
        # 而 spring-boot-maven-plugin 的 repackage 会在 target/ 留下两个 jar:
        #   xxx-exec.jar  106MB  Main-Class: JarLauncher  ← 该复制这个
        #   xxx.jar        54KB  无 Main-Class             ← 多源 COPY 取最后一个, 即这个
        # 于是镜像里打进的是那个 54KB 的库 jar, 容器启动即
        #   no main manifest attribute, in /app/app.jar  →  Exited (1)
        #
        # ⚠️ 为什么需要单独一道门禁: **podman build 对两种写法都 exit=0**。
        # 实测(2026-10-02)两种写法构建都"成功", 差别只在容器启动时才暴露 ——
        # 而镜像构建是 CI 里唯一覆盖 Dockerfile 的步骤, 缺陷就这么一路溜过去了。
        #
        # 本步自带负向对照(守护 2/2): 造一个改回 *.jar 的样本, 断言判定规则会判 FAIL。
        # 若这一步变红, 说明 Dockerfile 的 jar 写法退回了, 或守护本身失效了。
        run: bash verify-dockerfiles.sh
        shell: bash

      - name: Install Podman + podman-compose
        run: |
          sudo apt-get update
          sudo apt-get install -y podman podman-compose
          podman --version
          podman-compose --version

      - name: Gate integrity self-check (up.sh)
        # 2026-10-02 新增。
        #
        # 本仓库已记录 8 例"门禁看起来在守护, 实际从未生效"。本次 E2E 红灯本身
        # 就是第 9 例的原料: 548b9bc 为修 E2E 加的 up.sh --self-test 有三重失效 ——
        #   ① 它调用的是**本地/CI 各自安装的** podman-compose (本地 1.6.0, CI 1.0.6),
        #      因此从不演练 CI 真正会走的那条分支;
        #   ② `podman-compose --dry-run up -d` 在 1.6.0 下输出为空 (实测 stdout/stderr
        #      均 0 行), 探测不到任何东西, 退出码也不可靠 (正确顺序 exit=1);
        #   ③ 它比对的是"命令能否被解析", 而当时的 FULL_SERVICES 用的是**镜像名**
        #      (cloud-infra-gateway) 而非 compose 服务名 (gateway)。
        #
        # 现在的 up.sh --self-test 改为两件真能失败的事: 用 awk 解析 compose.yaml
        # 核对服务名集合 + 用 1.0.6 行为桩校验参数顺序, 并自带负向对照。
        # (2026-10-02 修正: 原先用 `podman-compose config --services`, 但 CI 的
        #  1.0.6 无此子命令 → 自检恒定报 FAIL。本地 1.6.0 有, 故本地绿、CI 红。)
        #
        # ⚠️ 必须排在 "Install Podman + podman-compose" **之后**: self_test 在
        # podman-compose 缺失时是直接 return 0 的 (本地无该命令时属正常),
        # 放到安装步骤之前就等于在 CI 上静默跳过 —— 那正是本次要消灭的那类假门禁。
        run: |
          # 显式断言工具存在, 避免 self_test 的"跳过即通过"分支掩盖未安装的情况
          command -v podman-compose >/dev/null 2>&1 || { echo "::error::podman-compose 未安装, 自检会被静默跳过"; exit 1; }
          bash deploy/up.sh --self-test
        shell: bash

      - name: Gate integrity self-check (config sync ordering)
        # 2026-10-03 新增, 守护 E2E run 37050526759 的根因。
        #
        # 那次红灯的真实异常是
        #   PlaceholderResolutionException: Could not resolve placeholder 'spring.datasource.url'
        # 根因是 up.sh 一次性 `up -d` 拉起微服务, 而 Nacos 配置同步排在最后。
        # 本地因 deploy/nacos/data 保留残留配置而长期不复现 —— 只靠本地跑是发现不了的。
        #
        # ⚠️ 上一条 self-check 查不出这类问题: 它验证的是"参数能不能被解析",
        #    而本缺陷的 up.sh 参数完全合法, 只是**执行顺序**错了。
        #    两个守护查的是不同维度, 不能相互替代。
        run: python3 deploy/tests/test_config_sync_order.py
        shell: bash

      - name: Guard Nacos config readability
        # 根因: 顺序对了 ≠ 服务能读到。
        #   CI run 37070818024 里 6 个容器全创建成功, gateway/auth/system/file
        #   四个 healthy, 只有 notification/search 挂。真实日志:
        #     WARN  config[dataId=notification-service.yaml] is empty
        #     ERROR Could not resolve placeholder 'spring.datasource.url'
        #
        #   NacosConfigDataLoader 启动期只拉一次, 读到空就当"dataId 不存在"
        #   继续启动且**不重试** —— 于是反复重启也读不到。
        #   本地长期不复现, 因为 deploy/nacos/data 保留了上次运行的配置残留。
        #
        # ⚠️ 为什么上面的顺序守护抓不到:
        #   它在上一轮**判定为通过**, 而缺陷依旧命中。顺序是**必要条件**,
        #   代码只满足了必要条件就宣称完成。本守护盯充分性:
        #   上传后必须回读确认非空, 且读不到要 exit 而非硬启动。
        run: python3 deploy/tests/test_config_readback_gate.py
        shell: bash

      - name: Guard ES diagnostics index names
        # es_diagnostics() 探的索引名必须与 @Document(indexName=...) 一致。
        # 我第一版写 oper_log/search_log、第二版按**类名**猜成 device_telemetry,
        # 两者都不存在 —— 探不存在的索引恒返回 404, 看起来"ES 正常",
        # 是**看起来正常的错误信息**, 比报错更危险。
        # 在拿到 ES 服务端日志之前这套诊断是唯一取证手段, 探错对象则结论不可信。
        run: python3 deploy/tests/test_es_diagnostics_index_names.py
        shell: bash

      - name: Guard ES version alignment
        # ES 服务端主版本必须与客户端一致（Spring Boot 4.1.0 BOM = 9.4.2）。
        # 8.x 服务端 + 9.x 客户端 -> 400 media_type_header_exception
        # -> search 启动失败（run 37077332251 / 37079433594）。
        #
        # 这个守护放在**编译之前**是安全的：它只读 Maven BOM 与 YAML，
        # 不需要字节码，也不依赖 ~/.m2 里有完整依赖树（有 BOM 降级路径）。
        run: python3 deploy/tests/test_es_version_alignment.py
        shell: bash

      - name: Guard image tag expansion
        # 根因: verify-e2e.sh 用 ${entry##*:} 拆 tag, 而 SERVICE_IMAGES 的元素
        #   含**两个**冒号（"路径:Dockerfile" + 镜像引用里的 ":latest"）,
        #   ## 取最长前缀 ⇒ 6 个镜像全被打成 localhost/latest:latest, 互相覆盖。
        #   compose 随后按名字找镜像 → "error code: 125", 6 个容器全部 absent。
        #
        # ⚠️ 为什么现有的 build 失败守护抓不到:
        #   `podman build -t latest` 本身**成功**（标签合法、退出码 0）,
        #   build_images 打印 ok 并返回 0, verify-e2e.sh 判 "PASS 6 个镜像构建完成"。
        #   即缺陷不是"构建失败", 而是"构建了错误的东西" ——
        #   任何只断言退出码的门禁都看不见, 只有比对 tag 字面值才能发现。
        run: python3 deploy/tests/test_image_tag_expansion.py
        shell: bash

      - name: Gate self-tests (deploy/tests/test_*)
        # 2026-10-05 实测缺口: 21 个 deploy/tests 脚本里**只有 6 个**在 CI 里被调用,
        # 其余 15 个从未执行 —— 包括守护"执行器注入二义"那个缺陷的
        # test_executor_injection_qualifier.py。
        #
        # 这**直接解释了**一个长期 puzzled 现象: CI 反复以
        #   "Parameter N of constructor ... required a single bean, but 2 were found"
        # 报同一个根因（AGENTS.md 第五课补记二）, 每次只报一个类, 逐个修。
        # 若那个守护在 CI 里跑过, 第一轮就会把**全仓**的注入点报出来。
        #
        # ⚠️ 本步骤**不放** check_*.py（判定门禁, 由 verify-e2e.sh 在运行期调）,
        #   也不放 classify_gh_run.sh（需 gh 登录, 属诊断工具）。
        #   这里跑的是 test_*.{sh,py} —— 守护的守护, 全部纯静态/桩数据, 不碰容器。
        #
        # ⚠️ 逐个写 run: 步骤的代价是**漏接**时完全无声 —— 那正是本次缺口的成因。
        #   故改为"聚合执行 + 清单由 test_gate_wiring.py 反查", 后者会因漏接而报红。
        run: |
          set -euo pipefail
          for t in deploy/tests/test_*.sh deploy/tests/test_*.py; do
            echo "::group::$(basename "$t")"
            case "$t" in
              *.sh) bash "$t" ;;
              *.py) python3 "$t" ;;
            esac
            echo "::endgroup::"
          done
        shell: bash

      - name: Guard gate wiring (no unreferenced gate scripts)
        # 守护上面那个聚合步骤: 若将来新增 test_* 而忘了纳入, 或反过来
        # 脚本存在却无人调用, 都在这里报红。
        #
        # 判据方向用**白名单**: 「正确的一侧可枚举」。反过来用黑名单
        # （排除已知的几个）无法枚举"未知的漏接"（AGENTS.md 黑名单 vs 白名单）。
        run: python3 deploy/tests/test_gate_wiring.py
        shell: bash

      - name: Quick audit (tenancy + trust chain)
        # 2026-11-02 Session 四条核验的可执行固化版本，固化在 deploy/tests/quick_audit.sh。
        # 由 AGENTS.md「🔍 快速核查清单」第 0~3 条支撑，覆盖多租户启用、框架残留归零、
        # Controller @PreAuthorize 覆盖率、过滤器 order 与信任链四类关键门禁。
        # ⚠️ 这正是此前"门禁脚本自己从未被调用"的第 N 例: 脚本已存在但无 CI 引用。
        # 加这一步让它成为真正的门禁而非摆设——改坏一条 order 会红, 改回会绿。
        run: bash deploy/tests/quick_audit.sh
        shell: bash

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Start Podman system service (rootless)
        # GitHub runner 默认有 podman, 但 rootless 模式需 lingering 启动守护进程
        run: |
          sudo loginctl enable-linger $USER
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          systemctl --user enable podman.socket || true
          systemctl --user start podman.socket || true
          podman info | head -5

      - name: Run E2E verify script
        # --skip-build 不传: CI 走完整流程 (mvn + podman build)
        # 失败时上传 build 产物与日志便于排查
        #
        # `shell: bash` 不可省: GitHub 的**默认** shell 是 `bash -e {0}`, 不带
        # `-o pipefail`, 管道退出码取自 tee(恒 0) → verify-e2e.sh 失败会被整个吞掉,
        # 表现为"这步绿了, 下一步却莫名其妙地 Connection refused"。
        # 2026-10-02 的 E2E 红灯正是这样被掩盖的。
        run: bash verify-e2e.sh 2>&1 | tee /tmp/e2e.log
        shell: bash
        env:
          # 让 compose 在 runner 上能找到 Nacos
          JAVA_OPTS: ""

      - name: Guard Lombok @Qualifier propagation
        # 类里**早就写了** @Qualifier, 但写在字段上, 且类上有
        # @RequiredArgsConstructor —— Lombok 不把它复制到构造参数,
        # 而 Spring 注入看的是构造参数。故该注解从未生效（CI run 37074048182:
        # "Parameter 8 ... required a single bean, but 2 were found"）。
        #
        # 任何基于 grep 的守护都会通过（源码里确实有那个词）,
        # 唯一能区分的判据是**字节码里构造参数上有没有它**。
        # 本守护跑 javap, 检查的正是 Spring 运行时实际看到的。
        #
        # ⚠️ 位置很关键: 必须放在 verify-e2e.sh **之后**。
        #   它需要 target/classes 里的字节码, 而那要等编译完成;
        #   之前放在 "Cache Maven packages" 之前（run 37076989259）, 既没有
        #   字节码也没有依赖（mvn -o 报 Non-resolvable import POM）, 直接红。
        #   `if: always()` 保证 E2E 本步失败时它仍执行 ——
        #   否则就变成"只有全绿才检查的假门禁"。
        if: always()
        run: python3 deploy/tests/test_lombok_qualifier_propagation.py
        shell: bash

      - name: Install Python websockets client
        # Notification WebSocket e2e 端到端测试 (commit af10741)
        # 验证: connect 收到 connected / send 触发 push 收到 notification / ping-pong
        if: success()
        run: pip install websockets

      - name: Run WebSocket E2E test
        if: success()
        # 等通知服务 5s 让 startup 完成
        run: |
          sleep 5
          python3 docs/demos/notification-websocket-e2e.py

      - name: Upload E2E logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ github.run_id }}
          path: |
            /tmp/e2e.log
            **/target/surefire-reports/
          # 注: 曾有 `deploy/nacos/conf/` 一行, 但该路径自 ab5baa50 引入起
          # 从未存在过 (git log --all -- deploy/nacos/conf 无任何记录)。
          # compose 只挂载 ./nacos/data, nacos 日志不落宿主, 因此删掉 —
          # 否则它只是让 artifact 多一个恒为空的白名单项。
          retention-days: 7
          if-no-files-found: ignore
