name: E2E Verify

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# E2E 跑全链路: mvn + podman build + compose 启动 + e2e 验收,
# 需要 Linux runner + podman + podman-compose + Java 25 + 充足磁盘 (>=10GB 镜像层)
# 单 PR 跑 1 次, 防止资源滥用; push 到 master 时多并发 (按服务拆分)
jobs:
  e2e:
    name: End-to-End Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Verify E2E gate integrity (negative control)
        # 2026-10-02 新增。
        #
        # 本仓库已记录 6 例"门禁看起来在守护, 实际从未生效", 其中 E2E 占了两处:
        #   ① verify-e2e.sh 的镜像构建上下文用服务目录, 6 个镜像全部构建失败,
        #      失败被 `| tail -3` 吞掉后仍打印 "PASS 6 个镜像构建完成";
        #   ② `podman-compose --profile full ... | tail -3` 报 invalid choice 也判 PASS。
        # 两者都只有"人肉读日志"才看得出来 —— 所以这里给门禁本身加一道负向对照:
        # 用假 podman 强制 build 失败, 断言脚本真的会判 FAIL。
        #
        # 若这一步变红, 说明有人把"吞掉错误"的写法改回来了。
        run: bash verify-e2e.sh --self-test
        # 注意: GitHub Actions 的**默认** shell 是 `bash -e {0}` —— **不含** `-o pipefail`;
        # 只有显式声明 `shell: bash` 才会变成 `bash --noprofile --norc -eo pipefail {0}`。
        # 本项目多个步骤用 `... | tee /tmp/x.log`, 一旦漏掉 pipefail,
        # 管道退出码取自 tee(恒 0), 脚本失败会被整个吞掉。
        shell: bash

      - name: Install Podman + podman-compose
        run: |
          sudo apt-get update
          sudo apt-get install -y podman podman-compose
          podman --version
          podman-compose --version

      - name: Gate integrity self-check (up.sh)
        # 2026-10-02 新增。
        #
        # 本仓库已记录 8 例"门禁看起来在守护, 实际从未生效"。本次 E2E 红灯本身
        # 就是第 9 例的原料: 548b9bc 为修 E2E 加的 up.sh --self-test 有三重失效 ——
        #   ① 它调用的是**本地/CI 各自安装的** podman-compose (本地 1.6.0, CI 1.0.6),
        #      因此从不演练 CI 真正会走的那条分支;
        #   ② `podman-compose --dry-run up -d` 在 1.6.0 下输出为空 (实测 stdout/stderr
        #      均 0 行), 探测不到任何东西, 退出码也不可靠 (正确顺序 exit=1);
        #   ③ 它比对的是"命令能否被解析", 而当时的 FULL_SERVICES 用的是**镜像名**
        #      (cloud-infra-gateway) 而非 compose 服务名 (gateway)。
        #
        # 现在的 up.sh --self-test 改为两件真能失败的事: 用 awk 解析 compose.yaml
        # 核对服务名集合 + 用 1.0.6 行为桩校验参数顺序, 并自带负向对照。
        # (2026-10-02 修正: 原先用 `podman-compose config --services`, 但 CI 的
        #  1.0.6 无此子命令 → 自检恒定报 FAIL。本地 1.6.0 有, 故本地绿、CI 红。)
        #
        # ⚠️ 必须排在 "Install Podman + podman-compose" **之后**: self_test 在
        # podman-compose 缺失时是直接 return 0 的 (本地无该命令时属正常),
        # 放到安装步骤之前就等于在 CI 上静默跳过 —— 那正是本次要消灭的那类假门禁。
        run: |
          # 显式断言工具存在, 避免 self_test 的"跳过即通过"分支掩盖未安装的情况
          command -v podman-compose >/dev/null 2>&1 || { echo "::error::podman-compose 未安装, 自检会被静默跳过"; exit 1; }
          bash deploy/up.sh --self-test
        shell: bash

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Start Podman system service (rootless)
        # GitHub runner 默认有 podman, 但 rootless 模式需 lingering 启动守护进程
        run: |
          sudo loginctl enable-linger $USER
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          systemctl --user enable podman.socket || true
          systemctl --user start podman.socket || true
          podman info | head -5

      - name: Run E2E verify script
        # --skip-build 不传: CI 走完整流程 (mvn + podman build)
        # 失败时上传 build 产物与日志便于排查
        #
        # `shell: bash` 不可省: GitHub 的**默认** shell 是 `bash -e {0}`, 不带
        # `-o pipefail`, 管道退出码取自 tee(恒 0) → verify-e2e.sh 失败会被整个吞掉,
        # 表现为"这步绿了, 下一步却莫名其妙地 Connection refused"。
        # 2026-10-02 的 E2E 红灯正是这样被掩盖的。
        run: bash verify-e2e.sh 2>&1 | tee /tmp/e2e.log
        shell: bash
        env:
          # 让 compose 在 runner 上能找到 Nacos
          JAVA_OPTS: ""

      - name: Install Python websockets client
        # Notification WebSocket e2e 端到端测试 (commit af10741)
        # 验证: connect 收到 connected / send 触发 push 收到 notification / ping-pong
        if: success()
        run: pip install websockets

      - name: Run WebSocket E2E test
        if: success()
        # 等通知服务 5s 让 startup 完成
        run: |
          sleep 5
          python3 docs/demos/notification-websocket-e2e.py

      - name: Upload E2E logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ github.run_id }}
          path: |
            /tmp/e2e.log
            deploy/nacos/conf/
            **/target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore
