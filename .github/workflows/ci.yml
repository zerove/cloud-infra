name: CI Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  MAVEN_OPTS: "-Xmx2G -Xms512m"
  JAVA_VERSION: "25"
  # 不钉死具体 GraalVM 版本号（2026-09-30 事故）:
  # 旧写法 GRAALVM_VERSION=25.0.1 会让 action 去拉 graalvm-ce-java25-linux-amd64-25.0.1,
  # 该资产已被上游回收 -> "Failed to download" -> 全部 job 在 setup 阶段 17 秒内红,
  # CI 自 2026-09-05 起从未真正跑到编译与测试。改为 distribution 由 action 动态解析。
  GRAALVM_DISTRIBUTION: "graalvm-community"

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25 (GraalVM Community)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.GRAALVM_DISTRIBUTION }}
          components: 'native-image'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run tests
        run: mvn clean test --batch-mode -T 2

      - name: Build exec jars for cross-service IT
        # 跨服务 Feign 链路 IT 以子进程拉起 system/auth 的 *-exec.jar（进程隔离），
        # 必须在 failsafe 前完成 package；-am 连带构建其依赖模块
        run: mvn package -pl cloud-infra-modules/system-module,cloud-infra-auth -am -DskipTests --batch-mode

      - name: Run integration tests (Testcontainers)
        # 集成测试需 Docker（GitHub runner 自带），单独跑避免拖慢单测反馈；
        # 先 test-compile 因为直接调 failsafe goal 不触发编译生命周期。
        # 刻意串行：多模块并行会同时拉起多个 Testcontainers 容器，
        # runner 资源竞争导致 RabbitMQ 冷启动超时（本地全量回归实测踩坑）
        env:
          # GitHub runner Docker daemon (>=29) 拒绝 docker-java/Testcontainers 1.21 默认协商的旧 API 1.32,
          # 报 "client version 1.32 is too old. Minimum supported API version is 1.40"。
          # DOCKER_API_VERSION 在本栈未被采纳; docker-java 读取 ~/.docker-java.properties 的 api.version。
          DOCKER_API_VERSION: "1.44"
        run: |
          mkdir -p "$HOME/.docker"
          printf 'api.version=1.44\n' > "$HOME/.docker-java.properties"
          mvn test-compile failsafe:integration-test failsafe:verify -DskipITs=false --batch-mode

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 7

      - name: Upload quality reports
        # 本地与 CI 的静态分析结论曾长期不一致 (本地 ~/.m2 残留 + pmd 增量缓存),
        # 把报告本身作为产物上传, 才能在下一次红灯时直接读到违规清单而不是猜。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            **/target/pmd.xml
            **/target/checkstyle-result.xml
            **/target/spotbugsXml.xml
          retention-days: 7
          if-no-files-found: ignore

  quality-gate:
    name: Quality Gates (Checkstyle, SpotBugs, PMD)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25 (GraalVM Community)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.GRAALVM_DISTRIBUTION }}

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Install reactor artifacts (module SNAPSHOT deps must be resolvable)
        # checkstyle/spotbugs/pmd 都是按模块执行的, 每个模块都要解析自己的依赖,
        # 其中包含同 reactor 的 SNAPSHOT (如 codegen-core -> codegen-maven-plugin)。
        # 本 job 不跑 package/install, 干净 runner 上这些构件根本不存在 ->
        # "Could not find artifact com.cloudinfra:cloud-infra-codegen-core:jar:1.0.0-SNAPSHOT"。
        # 本地不报错是因为 ~/.m2 里残留着历史 install 的 SNAPSHOT, 属于典型的"本地绿 CI 红"。
        run: mvn install -DskipTests -DskipITs -Dcheckstyle.skip=true -Dspotbugs.skip=true --batch-mode

      - name: Run quality checks
        run: mvn checkstyle:check spotbugs:check pmd:check --batch-mode

      - name: Check doc version drift (H3 regression guard)
        run: bash tools/check-doc-versions.sh

      - name: ArchUnit architecture guard (5 rules)
        # 守护 framework/common/api/modules 分层, 防止架构腐化.
        # 详见 ArchitectureTest.java (5 rules). 任一违反即拦截 PR.
        #
        # 2026-10-01: 参数从 -DfailIfNoTests=false 改为 -Dsurefire.failIfNoSpecifiedTests=false。
        # Surefire 3.x 已不再认 failIfNoTests, 传了等于没传; 而 -am 会连带构建
        # cloud-infra-common / cloud-infra-test-support 等**没有** ArchitectureTest 的模块,
        # Surefire 因"无匹配测试"直接失败, 于是本步骤在 2026-10-01 首次真正跑起来时立刻红:
        #   No tests matching pattern "ArchitectureTest" were executed!
        # 注意: 真正的架构违规会以不同的措辞出现 (Architecture Violation ... was violated),
        # 两者不要混淆 —— 本次是参数名失效, 不是分层被破坏。
        run: mvn -pl cloud-infra-modules/system-module -am test -Dtest=ArchitectureTest -Dsurefire.failIfNoSpecifiedTests=false --batch-mode

      - name: Upload quality reports
        # 本地与 CI 的静态分析结论曾长期不一致 (本地 ~/.m2 残留历史 SNAPSHOT +
        # maven-pmd-plugin 的增量缓存), 把报告本身作为产物上传, 下一次红灯时
        # 就能直接读到违规清单, 而不是靠猜。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            **/target/pmd.xml
            **/target/checkstyle-result.xml
            **/target/spotbugsXml.xml
          retention-days: 7
          if-no-files-found: ignore

  native-build:
    name: Native Image Build (Gateway + Auth)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: [test, quality-gate]
    # 2026-10-02 改为 always() 且不再限定 push-to-master。
    #
    # 旧条件有两个问题, 两者都在本次排查中实际发生:
    # 1. 限定 `push to master` → **PR 完全无法验证 native 构建**。
    #    曾开 PR #57 专做基线对照, 该 job 根本不触发(显示 "skipping"),
    #    取不到对照数据, 只能关掉 PR 另寻他法。
    # 2. 有 `needs` 但未加 always() → 上游任一失败, 本 job 即 skipped,
    #    **native 的真实失败被上游失败掩盖**, 表现为"native 从未验证过"。
    #
    # 代价: 每个 PR 多耗约 20 分钟 runner。收益: native 成为一道
    # **独立可验证**的门禁, 且改 native 相关代码时能在 PR 上直接看到结果。
    if: ${{ always() }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25 (GraalVM Community)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.GRAALVM_DISTRIBUTION }}
          components: 'native-image'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Install reactor artifacts (module SNAPSHOT deps must be resolvable)
        # native:compile 对 `mvn -pl cloud-infra-gateway --batch-mode` 这种**单模块**
        # 下解析同 reactor 的 SNAPSHOT (gateway -> cloud-infra-common/api/framework-*) 需要
        # 这些构件在本地 Maven 仓库可见。clean runner 上默认没有 -> 报错:
        #   Could not resolve dependencies for project cloud-infra-gateway:jar:1.0.0-SNAPSHOT
        #   Could not find artifact com.cloudinfra:cloud-infra-common:jar:1.0.0-SNAPSHOT
        # quality-gate job 的 install 步骤不会在本 job 里执行, 故这里显式补一次
        # (2026-11-10 CI run 42738441187 实证)。
        run: mvn install -DskipTests -DskipITs -Dcheckstyle.skip=true -Dspotbugs.skip=true --batch-mode

      - name: Build Native Images
        # 2026-10-02 四次实测得到的事实（勿凭猜测再改）:
        #
        #   配置                              gateway          auth
        #   -J-Xmx8g（原，不限 MaxRAM）        失败              失败
        #   -J-Xmx4g（不限 MaxRAM）            失败              —
        #   -J-Xmx4g -J-XX:MaxRAM=10g         成功(9m9s/6.18GB) 失败
        #   -J-Xmx4g -J-XX:MaxRAM=14g（当前）  待验证            待验证
        #
        # 结论（按实测单调性, 非猜测）:
        # 1. **必须限制 MaxRAM** —— 放开它时（`-J-Xmx4g` 无限制）gateway 也失败,
        #    说明 image heap 会自行涨到顶穿 16 GB runner。
        # 2. **但 10 GB 又可能对 auth 偏紧** —— gateway 在 10 GB 下峰值已 6.18 GB,
        #    而 auth 依赖更多（Nacos/Feign/Redis/Security），峰值更高,
        #    在 `[8/8] Creating image` 后无错误被系统终止。
        # 3. 故本次取中间值: MaxRAM 放宽到 **14 GB** —— 仍为 OS 与 Maven 留出
        #    ≥2 GB 余量, 同时把 image heap 的天花板抬高, 给 auth 留出空间。
        #
        # 若 auth 在 14 GB 下仍失败，则 MaxRAM 因素可视为已穷尽,
        # 需转向其他形态（届时可考虑临时回退 cloud-infra-auth/src/main 到 0c66985
        # 做对照 —— 注意该 job 只在 push 到 master 时触发, PR 路径无效）。
        #
        # ⚠️ 14 GB 这一档**尚未在 CI 上验证**, 不应被当作已修复。
        run: |
          mvn clean package -T 1 -Pnative -DskipTests -Dnative.image.args="-J-Xmx4g -J-XX:MaxRAM=14g" -pl cloud-infra-gateway,cloud-infra-auth -am --batch-mode
          # **两个模块分两次 Maven 调用构建**, 2026-10-02 修正。
          #
          # 起因: 同一会话内先后构建 gateway 与 auth 时, gateway 成功而 auth 报
          #   native-maven-plugin:0.10.4:compile failed:
          #   Cannot invoke "java.util.LinkedHashMap.get(Object)" because "this.inodes" is null
          # 该 NPE 在 **5.188 秒**内抛出 —— native-image 进程**根本没被启动**,
          # 所以它不是"分析失败"也不是"内存耗尽"。
          #
          # 本地对照实验支持"插件跨模块会话状态被污染"这一解释:
          #   单独构建 auth → 能跑过该插件并真正启动 native-image(随后才撞上本机 mmap 沙箱限制)
          #   gateway+auth 同一会话 → gateway 成功后 auth 在插件内 NPE
          # 即失败与"auth 在 gateway 之后构建"相关, 而与 auth 自身代码无关
          # (PR #58 回退 auth 代码后仍以相同方式失败, 已在 CI 上验证)。
          #
          # 分开会话即可让每个模块拿到干净的插件状态; 同时 native-image 峰值更可能独占机器。
          mvn native:compile -Pnative -DskipTests -Dnative.image.args="-J-Xmx4g -J-XX:MaxRAM=14g" -pl cloud-infra-gateway --batch-mode
          mvn native:compile -Pnative -DskipTests -Dnative.image.args="-J-Xmx4g -J-XX:MaxRAM=14g" -pl cloud-infra-auth --batch-mode

      - name: Stage native binaries
        # 2026-10-02 修正: 直接把 target/ 下的两个文件交给 upload-artifact,
        # v4 会以**所有 path 的最小公共祖先**为根, 于是 artifact 内部结构是
        #   cloud-infra-gateway/target/cloud-infra-gateway-binary
        #   cloud-infra-auth/target/cloud-infra-auth-binary
        # 而 docker-build 里写的是 `cp artifacts/cloud-infra-gateway-binary`（扁平路径）,
        # 2026-10-02 该 job 首次真正执行即以此报错:
        #   cp: cannot stat 'artifacts/cloud-infra-gateway-binary': No such file or directory
        #
        # 与其依赖 download-artifact 的 LCA 计算规则（隐式、易随 action 版本变化）,
        # 不如**显式暂存**: 上传 artifacts/ 目录, 使 artifact 内部结构 = 文件名,
        # 与 docker-build 的 cp 路径一一对应。
        #
        # 附带收益: cp 在 `bash -e` 下失败即中断 —— 二进制没生成就不会上传空 artifact,
        # 把"上游没产出却往下游传"这条静默路径堵死。
        run: |
          mkdir -p artifacts
          cp cloud-infra-gateway/target/cloud-infra-gateway-binary artifacts/
          cp cloud-infra-auth/target/cloud-infra-auth-binary artifacts/
          ls -l artifacts/

      - name: Upload native binaries
        uses: actions/upload-artifact@v4
        with:
          name: native-binaries
          path: artifacts/
          retention-days: 7
          if-no-files-found: error

  docker-build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: native-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    # 2026-10-02 新增。此前本 job **没有任何 permissions 声明**, 而仓库的
    # 默认 workflow 权限是 read (经 API 核实:
    # {"default_workflow_permissions":"read"}), 因此 GITHUB_TOKEN 无权写 packages。
    # 表现: 镜像本地构建成功, push 时报
    #   denied: installation not allowed to Create organization package
    # 这同样是"上游坏掉 → 把自己伪装成从未验证过"的第 N 例: aaf0f67 修好 podman
    # action 之后本 job 才首次真正执行, 才露出这个从未被验证过的权限缺失。
    permissions:
      contents: read   # 下载 artifact 不需要, 但 checkout 需要
      packages: write   # 推 ghcr.io 必需
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download native binaries
        uses: actions/download-artifact@v8
        with:
          name: native-binaries
          path: artifacts/

      - name: Set up Podman
        # 2026-10-02 修正: 原为 `redhat-actions/podman-installer@v1`，该 action 已被
        # **重命名**为 `podman-install`(经 GitHub API 核实: podman-installer 返回 404,
        # 而 redhat-actions/podman-install 存在且有 v1/v1.1.x 标签)。
        #
        # 此缺陷一直存在但从未暴露: 本 job `needs` native-build, 而 native-build
        # 在 2026-10-01 之前长期处于 skipped, 于是本 job 也一直被 skipped ——
        # 典型的"依赖链上游坏掉, 把自己也伪装成没验证过"。
        # native-build 修好后本 job 首次真正执行, 才露出这个引用失效。
        uses: redhat-actions/podman-install@v1

      - name: Login to GitHub Container Registry
        uses: redhat-actions/podman-login@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Gateway Native Image
        run: |
          # 先断言构件真的在（而非让 cp 的报错在 6 步之后才出现）
          test -f artifacts/cloud-infra-gateway-binary || { echo "::error::gateway native 二进制缺失, 上游 native-build 未产出"; exit 1; }
          test -f artifacts/cloud-infra-auth-binary || { echo "::error::auth native 二进制缺失, 上游 native-build 未产出"; exit 1; }
          mkdir -p cloud-infra-gateway/target
          cp artifacts/cloud-infra-gateway-binary cloud-infra-gateway/target/
          podman build -f cloud-infra-gateway/Dockerfile.native -t ghcr.io/${{ github.repository }}/cloud-infra-gateway-native:${{ github.sha }} cloud-infra-gateway/

      - name: Build Auth Native Image
        run: |
          mkdir -p cloud-infra-auth/target
          cp artifacts/cloud-infra-auth-binary cloud-infra-auth/target/
          podman build -f cloud-infra-auth/Dockerfile.native -t ghcr.io/${{ github.repository }}/cloud-infra-auth-native:${{ github.sha }} cloud-infra-auth/

      - name: Push Gateway Image
        run: podman push ghcr.io/${{ github.repository }}/cloud-infra-gateway-native:${{ github.sha }}

      - name: Push Auth Image
        run: podman push ghcr.io/${{ github.repository }}/cloud-infra-auth-native:${{ github.sha }}

      - name: Tag as latest
        run: |
          podman tag ghcr.io/${{ github.repository }}/cloud-infra-gateway-native:${{ github.sha }} ghcr.io/${{ github.repository }}/cloud-infra-gateway-native:latest
          podman tag ghcr.io/${{ github.repository }}/cloud-infra-auth-native:${{ github.sha }} ghcr.io/${{ github.repository }}/cloud-infra-auth-native:latest
          podman push ghcr.io/${{ github.repository }}/cloud-infra-gateway-native:latest
          podman push ghcr.io/${{ github.repository }}/cloud-infra-auth-native:latest

  notify:
    name: Notification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test, quality-gate, native-build, docker-build]
    if: always()
    env:
      # 必须在**作业级**声明: 步骤级 `if` 表达式求值时看不到步骤自己的 env,
      # 原写法 `if: env.SLACK_WEBHOOK_URL != ''` 配 `env:` 写在同一步骤里,
      # 条件恒为假 —— 这条通知自加入以来从未执行过(第 7 例"门禁/步骤形同虚设")。
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Send status to Slack
        if: env.SLACK_WEBHOOK_URL != ''
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#ci-cd'
          text: "Cloud-Infra Pipeline: ${{ job.status }}"
