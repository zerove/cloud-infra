name: CI Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  MAVEN_OPTS: "-Xmx2G -Xms512m"
  JAVA_VERSION: "25"
  GRAALVM_VERSION: "25.0.1"

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25 (GraalVM)
        uses: graalvm/setup-graalvm@v1
        with:
          version: ${{ env.GRAALVM_VERSION }}
          java-version: ${{ env.JAVA_VERSION }}
          components: 'native-image'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run tests
        run: mvn clean test --batch-mode -T 2

      - name: Build exec jars for cross-service IT
        # 跨服务 Feign 链路 IT 以子进程拉起 system/auth 的 *-exec.jar（进程隔离），
        # 必须在 failsafe 前完成 package；-am 连带构建其依赖模块
        run: mvn package -pl cloud-infra-modules/system-module,cloud-infra-auth -am -DskipTests --batch-mode

      - name: Run integration tests (Testcontainers)
        # 集成测试需 Docker（GitHub runner 自带），单独跑避免拖慢单测反馈；
        # 先 test-compile 因为直接调 failsafe goal 不触发编译生命周期。
        # 刻意串行：多模块并行会同时拉起多个 Testcontainers 容器，
        # runner 资源竞争导致 RabbitMQ 冷启动超时（本地全量回归实测踩坑）
        run: mvn test-compile failsafe:integration-test failsafe:verify -DskipITs=false --batch-mode

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 7

  quality-gate:
    name: Quality Gates (Checkstyle, SpotBugs, PMD)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25 (GraalVM)
        uses: graalvm/setup-graalvm@v1
        with:
          version: ${{ env.GRAALVM_VERSION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run quality checks
        run: mvn checkstyle:check spotbugs:check pmd:check --batch-mode

      - name: Check doc version drift (H3 regression guard)
        run: bash tools/check-doc-versions.sh

  native-build:
    name: Native Image Build (Gateway + Auth)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: [test, quality-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25 (GraalVM)
        uses: graalvm/setup-graalvm@v1
        with:
          version: ${{ env.GRAALVM_VERSION }}
          java-version: ${{ env.JAVA_VERSION }}
          components: 'native-image'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build Native Images
        run: |
          mvn clean package -T 1 -Pnative -DskipTests -Dnative.image.args="-J-Xmx8g" -pl cloud-infra-gateway,cloud-infra-auth -am --batch-mode
          mvn native:compile -Pnative -DskipTests -Dnative.image.args="-J-Xmx8g" -pl cloud-infra-gateway,cloud-infra-auth --batch-mode

      - name: Upload native binaries
        uses: actions/upload-artifact@v4
        with:
          name: native-binaries
          path: |
            cloud-infra-gateway/target/cloud-infra-gateway-binary
            cloud-infra-auth/target/cloud-infra-auth-binary
          retention-days: 7

  docker-build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: native-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download native binaries
        uses: actions/download-artifact@v8
        with:
          name: native-binaries
          path: artifacts/

      - name: Set up Podman
        uses: redhat-actions/podman-installer@v1

      - name: Login to GitHub Container Registry
        uses: redhat-actions/podman-login@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Gateway Native Image
        run: |
          mkdir -p cloud-infra-gateway/target
          cp artifacts/cloud-infra-gateway-binary cloud-infra-gateway/target/
          podman build -f cloud-infra-gateway/Dockerfile.native -t ghcr.io/${{ github.repository }}/cloud-infra-gateway-native:${{ github.sha }} cloud-infra-gateway/

      - name: Build Auth Native Image
        run: |
          mkdir -p cloud-infra-auth/target
          cp artifacts/cloud-infra-auth-binary cloud-infra-auth/target/
          podman build -f cloud-infra-auth/Dockerfile.native -t ghcr.io/${{ github.repository }}/cloud-infra-auth-native:${{ github.sha }} cloud-infra-auth/

      - name: Push Gateway Image
        run: podman push ghcr.io/${{ github.repository }}/cloud-infra-gateway-native:${{ github.sha }}

      - name: Push Auth Image
        run: podman push ghcr.io/${{ github.repository }}/cloud-infra-auth-native:${{ github.sha }}

      - name: Tag as latest
        run: |
          podman tag ghcr.io/${{ github.repository }}/cloud-infra-gateway-native:${{ github.sha }} ghcr.io/${{ github.repository }}/cloud-infra-gateway-native:latest
          podman tag ghcr.io/${{ github.repository }}/cloud-infra-auth-native:${{ github.sha }} ghcr.io/${{ github.repository }}/cloud-infra-auth-native:latest
          podman push ghcr.io/${{ github.repository }}/cloud-infra-gateway-native:latest
          podman push ghcr.io/${{ github.repository }}/cloud-infra-auth-native:latest

  notify:
    name: Notification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test, quality-gate, native-build, docker-build]
    if: always()
    steps:
      - name: Send status to Slack
        if: env.SLACK_WEBHOOK_URL != ''
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#ci-cd'
          text: "Cloud-Infra Pipeline: ${{ job.status }}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}