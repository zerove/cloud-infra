name: CI Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  MAVEN_OPTS: "-Xmx2G -Xms512m"
  JAVA_VERSION: "25"
  # 不钉死具体 GraalVM 版本号（2026-09-30 事故）:
  # 旧写法 GRAALVM_VERSION=25.0.1 会让 action 去拉 graalvm-ce-java25-linux-amd64-25.0.1,
  # 该资产已被上游回收 -> "Failed to download" -> 全部 job 在 setup 阶段 17 秒内红,
  # CI 自 2026-09-05 起从未真正跑到编译与测试。改为 distribution 由 action 动态解析。
  GRAALVM_DISTRIBUTION: "graalvm-community"

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25 (GraalVM Community)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.GRAALVM_DISTRIBUTION }}
          components: 'native-image'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run tests
        run: mvn clean test --batch-mode -T 2

      - name: Build exec jars for cross-service IT
        # 跨服务 Feign 链路 IT 以子进程拉起 system/auth 的 *-exec.jar（进程隔离），
        # 必须在 failsafe 前完成 package；-am 连带构建其依赖模块
        run: mvn package -pl cloud-infra-modules/system-module,cloud-infra-auth -am -DskipTests --batch-mode

      - name: Run integration tests (Testcontainers)
        # 集成测试需 Docker（GitHub runner 自带），单独跑避免拖慢单测反馈；
        # 先 test-compile 因为直接调 failsafe goal 不触发编译生命周期。
        # 刻意串行：多模块并行会同时拉起多个 Testcontainers 容器，
        # runner 资源竞争导致 RabbitMQ 冷启动超时（本地全量回归实测踩坑）
        run: mvn test-compile failsafe:integration-test failsafe:verify -DskipITs=false --batch-mode

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 7

      - name: Upload quality reports
        # 本地与 CI 的静态分析结论曾长期不一致 (本地 ~/.m2 残留 + pmd 增量缓存),
        # 把报告本身作为产物上传, 才能在下一次红灯时直接读到违规清单而不是猜。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            **/target/pmd.xml
            **/target/checkstyle-result.xml
            **/target/spotbugsXml.xml
          retention-days: 7
          if-no-files-found: ignore

  quality-gate:
    name: Quality Gates (Checkstyle, SpotBugs, PMD)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25 (GraalVM Community)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.GRAALVM_DISTRIBUTION }}

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Install reactor artifacts (module SNAPSHOT deps must be resolvable)
        # checkstyle/spotbugs/pmd 都是按模块执行的, 每个模块都要解析自己的依赖,
        # 其中包含同 reactor 的 SNAPSHOT (如 codegen-core -> codegen-maven-plugin)。
        # 本 job 不跑 package/install, 干净 runner 上这些构件根本不存在 ->
        # "Could not find artifact com.cloudinfra:cloud-infra-codegen-core:jar:1.0.0-SNAPSHOT"。
        # 本地不报错是因为 ~/.m2 里残留着历史 install 的 SNAPSHOT, 属于典型的"本地绿 CI 红"。
        run: mvn install -DskipTests -DskipITs -Dcheckstyle.skip=true -Dspotbugs.skip=true --batch-mode

      - name: Run quality checks
        run: mvn checkstyle:check spotbugs:check pmd:check --batch-mode

      - name: Check doc version drift (H3 regression guard)
        run: bash tools/check-doc-versions.sh

      - name: ArchUnit architecture guard (5 rules)
        # 守护 framework/common/api/modules 分层, 防止架构腐化.
        # 详见 ArchitectureTest.java (5 rules). 任一违反即拦截 PR.
        #
        # 2026-10-01: 参数从 -DfailIfNoTests=false 改为 -Dsurefire.failIfNoSpecifiedTests=false。
        # Surefire 3.x 已不再认 failIfNoTests, 传了等于没传; 而 -am 会连带构建
        # cloud-infra-common / cloud-infra-test-support 等**没有** ArchitectureTest 的模块,
        # Surefire 因"无匹配测试"直接失败, 于是本步骤在 2026-10-01 首次真正跑起来时立刻红:
        #   No tests matching pattern "ArchitectureTest" were executed!
        # 注意: 真正的架构违规会以不同的措辞出现 (Architecture Violation ... was violated),
        # 两者不要混淆 —— 本次是参数名失效, 不是分层被破坏。
        run: mvn -pl cloud-infra-modules/system-module -am test -Dtest=ArchitectureTest -Dsurefire.failIfNoSpecifiedTests=false --batch-mode

      - name: Upload quality reports
        # 本地与 CI 的静态分析结论曾长期不一致 (本地 ~/.m2 残留历史 SNAPSHOT +
        # maven-pmd-plugin 的增量缓存), 把报告本身作为产物上传, 下一次红灯时
        # 就能直接读到违规清单, 而不是靠猜。
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            **/target/pmd.xml
            **/target/checkstyle-result.xml
            **/target/spotbugsXml.xml
          retention-days: 7
          if-no-files-found: ignore

  native-build:
    name: Native Image Build (Gateway + Auth)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: [test, quality-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25 (GraalVM Community)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.GRAALVM_DISTRIBUTION }}
          components: 'native-image'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build Native Images
        # 2026-10-02 四次实测得到的事实（勿凭猜测再改）:
        #
        #   配置                              gateway          auth
        #   -J-Xmx8g（原，不限 MaxRAM）        失败              失败
        #   -J-Xmx4g（不限 MaxRAM）            失败              —
        #   -J-Xmx4g -J-XX:MaxRAM=10g         成功(9m9s/6.18GB) 失败
        #   -J-Xmx4g -J-XX:MaxRAM=14g（当前）  待验证            待验证
        #
        # 结论（按实测单调性, 非猜测）:
        # 1. **必须限制 MaxRAM** —— 放开它时（`-J-Xmx4g` 无限制）gateway 也失败,
        #    说明 image heap 会自行涨到顶穿 16 GB runner。
        # 2. **但 10 GB 又可能对 auth 偏紧** —— gateway 在 10 GB 下峰值已 6.18 GB,
        #    而 auth 依赖更多（Nacos/Feign/Redis/Security），峰值更高,
        #    在 `[8/8] Creating image` 后无错误被系统终止。
        # 3. 故本次取中间值: MaxRAM 放宽到 **14 GB** —— 仍为 OS 与 Maven 留出
        #    ≥2 GB 余量, 同时把 image heap 的天花板抬高, 给 auth 留出空间。
        #
        # 若 auth 在 14 GB 下仍失败，则 MaxRAM 因素可视为已穷尽,
        # 需转向其他形态（届时可考虑临时回退 cloud-infra-auth/src/main 到 0c66985
        # 做对照 —— 注意该 job 只在 push 到 master 时触发, PR 路径无效）。
        #
        # ⚠️ 14 GB 这一档**尚未在 CI 上验证**, 不应被当作已修复。
        run: |
          mvn clean package -T 1 -Pnative -DskipTests -Dnative.image.args="-J-Xmx4g -J-XX:MaxRAM=14g" -pl cloud-infra-gateway,cloud-infra-auth -am --batch-mode
          mvn native:compile -Pnative -DskipTests -Dnative.image.args="-J-Xmx4g -J-XX:MaxRAM=14g" -pl cloud-infra-gateway,cloud-infra-auth --batch-mode

      - name: Upload native binaries
        uses: actions/upload-artifact@v4
        with:
          name: native-binaries
          path: |
            cloud-infra-gateway/target/cloud-infra-gateway-binary
            cloud-infra-auth/target/cloud-infra-auth-binary
          retention-days: 7

  docker-build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: native-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download native binaries
        uses: actions/download-artifact@v8
        with:
          name: native-binaries
          path: artifacts/

      - name: Set up Podman
        uses: redhat-actions/podman-installer@v1

      - name: Login to GitHub Container Registry
        uses: redhat-actions/podman-login@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Gateway Native Image
        run: |
          mkdir -p cloud-infra-gateway/target
          cp artifacts/cloud-infra-gateway-binary cloud-infra-gateway/target/
          podman build -f cloud-infra-gateway/Dockerfile.native -t ghcr.io/${{ github.repository }}/cloud-infra-gateway-native:${{ github.sha }} cloud-infra-gateway/

      - name: Build Auth Native Image
        run: |
          mkdir -p cloud-infra-auth/target
          cp artifacts/cloud-infra-auth-binary cloud-infra-auth/target/
          podman build -f cloud-infra-auth/Dockerfile.native -t ghcr.io/${{ github.repository }}/cloud-infra-auth-native:${{ github.sha }} cloud-infra-auth/

      - name: Push Gateway Image
        run: podman push ghcr.io/${{ github.repository }}/cloud-infra-gateway-native:${{ github.sha }}

      - name: Push Auth Image
        run: podman push ghcr.io/${{ github.repository }}/cloud-infra-auth-native:${{ github.sha }}

      - name: Tag as latest
        run: |
          podman tag ghcr.io/${{ github.repository }}/cloud-infra-gateway-native:${{ github.sha }} ghcr.io/${{ github.repository }}/cloud-infra-gateway-native:latest
          podman tag ghcr.io/${{ github.repository }}/cloud-infra-auth-native:${{ github.sha }} ghcr.io/${{ github.repository }}/cloud-infra-auth-native:latest
          podman push ghcr.io/${{ github.repository }}/cloud-infra-gateway-native:latest
          podman push ghcr.io/${{ github.repository }}/cloud-infra-auth-native:latest

  notify:
    name: Notification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test, quality-gate, native-build, docker-build]
    if: always()
    steps:
      - name: Send status to Slack
        if: env.SLACK_WEBHOOK_URL != ''
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#ci-cd'
          text: "Cloud-Infra Pipeline: ${{ job.status }}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
