# ============================================================
# 基准测试门禁
# 在 master 合并前运行, 对比性能基线, 防止性能回归
# ⚠️ 触发器原写 branches:[main, develop] —— 本仓库默认分支是 master,
#    该组合永不匹配, 门禁自建立起从未触发过(2026-10-18 修正)。
#
# 实际阈值(唯一真源是下方 "Compare with baseline" 里的变量, 不是本注释):
#   启动 < 15000ms, 内存 < 512MB, 吞吐 > 100 RPS, p99 < 1000ms
# 注意: benchmark.sh 默认打的是 /v3/api-docs —— 网关自己生成的静态 OpenAPI JSON,
# **不触达任何业务逻辑**。因此本门禁衡量的是"网关入口路径"(过滤器链 + 路由 + 响应),
# 不是业务吞吐。要测业务链路需起全栈后用 --endpoint 指定业务路径。
# 用法: 在 PR 上添加 `benchmark` 标签触发
# ============================================================
name: Benchmark Gate

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, labeled]

jobs:
  benchmark-gate:
    name: Benchmark Performance Gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: contains(github.event.pull_request.labels.*.name, 'benchmark') || github.event.action == 'labeled'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # 需要对比上一次提交

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '25'
          cache: 'maven'

      - name: Cache Maven repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build Gateway (JVM mode)
        run: |
          cd cloud-infra-gateway
          mvn clean package -DskipTests --batch-mode

      - name: Run benchmark suite
        run: |
          # 并发吞量测试取短时长,避免 CI 超时
          ./benchmark.sh --duration=15 --concurrency=4
          # 提取报告指标
          REPORT=benchmark-results/benchmark-report.md
          STARTUP_MS=$(grep -oP '启动时间 \| \K\d+' "$REPORT" 2>/dev/null || grep -A1 '启动时间' "$REPORT" | tail -1 | grep -oP '\d+' | head -1)
          MEM_MB=$(grep 'RSS 内存' "$REPORT" | grep -oP '\d+')
          RPS=$(grep '吞吐量' "$REPORT" | grep -oP '[0-9]+ RPS' | grep -oP '\d+')
          # p99 是本次新增的门禁项: 原先只卡启动/内存/吞吐, 延迟劣化可静默通过
          P99_MS=$(grep -oP 'p99 延迟 \| \K[0-9.]+' "$REPORT" 2>/dev/null | head -1)
          [ -z "$P99_MS" ] && P99_MS=$(grep -oP 'p99[^0-9]*\K[0-9.]+' "$REPORT" 2>/dev/null | head -1)
          echo "== 基准指标 =="
          echo "启动时间: ${STARTUP_MS}ms"
          echo "内存: ${MEM_MB}MB"
          echo "吞吐量: ${RPS} RPS"
          echo "STARTUP_MS=${STARTUP_MS}" >> $GITHUB_ENV
          echo "MEM_MB=${MEM_MB}" >> $GITHUB_ENV
          echo "RPS=${RPS}" >> $GITHUB_ENV
          FAIL_RATE=$(grep -oP '失败率 \| \K[0-9]+' "$REPORT" 2>/dev/null | head -1)
          [ -z "$FAIL_RATE" ] && FAIL_RATE=$(grep -oP '失败率[^0-9]*\K[0-9]+' "$REPORT" 2>/dev/null | head -1)
          echo "P99_MS=${P99_MS:-}" >> $GITHUB_ENV
          echo "FAIL_RATE=${FAIL_RATE:-}" >> $GITHUB_ENV

      - name: Compare with baseline
        run: |
          # 基准值: JVM 启动 < 15s, 内存 < 512MB, 吞吐 > 100 RPS
          MAX_STARTUP_MS=15000
          MAX_MEM_MB=512
          MIN_RPS=100
          MAX_P99_MS=1000
          # 失败率门禁: 没有它, 端点全挂也能靠"尝试数"凑出高 RPS 并通过
          MAX_FAIL_RATE=5

          echo "=== 性能门禁检查 ==="
          echo "启动时间: ${STARTUP_MS}ms (阈值: ${MAX_STARTUP_MS}ms)"
          echo "内存使用: ${MEM_MB}MB (阈值: ${MAX_MEM_MB}MB)"
          echo "吞吐量: ${RPS}RPS (阈值: ${MIN_RPS}RPS)"

          FAILED=false

          if [ "${STARTUP_MS:-99999}" -gt "${MAX_STARTUP_MS}" ]; then
            echo "❌ 启动时间超出阈值: ${STARTUP_MS}ms > ${MAX_STARTUP_MS}ms"
            FAILED=true
          else
            echo "✅ 启动时间符合要求"
          fi

          if [ "${MEM_MB:-99999}" -gt "${MAX_MEM_MB}" ]; then
            echo "❌ 内存使用超出阈值: ${MEM_MB}MB > ${MAX_MEM_MB}MB"
            FAILED=true
          else
            echo "✅ 内存使用符合要求"
          fi

          if [ "${RPS:-0}" -lt "${MIN_RPS}" ]; then
            echo "❌ 吞吐量低于阈值: ${RPS}RPS < ${MIN_RPS}RPS"
            FAILED=true
          else
            echo "✅ 吞吐量符合要求"
          fi

          # 缺 p99 视为失败(fail-closed): 报告格式变化导致解析不出来时,
          # 不能因为"没测到"就当作通过 —— 否则新增门禁会变成又一次假门禁。
          if [ -z "${P99_MS:-}" ]; then
            echo "❌ p99 未能从报告中解析出来, 无法判定延迟预算(视为不通过)"
            FAILED=true
          elif awk "BEGIN{exit !(${P99_MS} > ${MAX_P99_MS})}"; then
            echo "❌ p99 超出阈值: ${P99_MS}ms > ${MAX_P99_MS}ms"
            FAILED=true
          else
            echo "✅ p99 符合要求"
          fi

          if [ -z "${FAIL_RATE:-}" ]; then
            echo "❌ 失败率未能解析出来, 无法判定(视为不通过)"
            FAILED=true
          elif [ "${FAIL_RATE}" -gt "${MAX_FAIL_RATE}" ]; then
            echo "❌ 请求失败率过高: ${FAIL_RATE}% > ${MAX_FAIL_RATE}%"
            FAILED=true
          else
            echo "✅ 失败率符合要求"
          fi

          if [ "$FAILED" = true ]; then
            echo "❌ 基准测试门禁未通过"
            exit 1
          fi
          echo "✅ 基准测试门禁通过"

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-gate-report
          path: |
            benchmark-results/
            /tmp/gateway-startup.log
          retention-days: 30

      - name: Comment result on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const startupMs = process.env.STARTUP_MS || 'N/A';
            const memMb = process.env.MEM_MB || 'N/A';
            const rps = process.env.RPS || 'N/A';
            const body = `## 🏎️ 基准测试门禁结果
            | 指标 | 实测值 | 阈值 | 状态 |
            |------|--------|------|------|
            | 启动时间 | ${startupMs}ms | 15000ms | ${Number(startupMs) > 15000 ? '❌' : '✅'} |
            | 内存使用 | ${memMb}MB | 512MB | ${Number(memMb) > 512 ? '❌' : '✅'} |
            | 吞吐量 | ${rps}RPS | 100RPS | ${Number(rps) < 100 ? '❌' : '✅'} |

            *触发方式: 在 PR 上添加 \`benchmark\` 标签*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            })