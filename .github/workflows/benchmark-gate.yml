# ============================================================
# 基准测试门禁
# 在 main 分支合并前运行, 对比性能基线, 防止性能回归
# 基线: gateway 启动时间 < 5s (JVM) / < 2s (Native), 内存 < 512MB
# ============================================================
name: Benchmark Gate

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, labeled]

jobs:
  benchmark-gate:
    name: Benchmark Performance Gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: contains(github.event.pull_request.labels.*.name, 'benchmark') || github.event.action == 'labeled'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # 需要对比上一次提交

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '25'
          cache: 'maven'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build Gateway (JVM mode)
        run: |
          cd cloud-infra-gateway
          mvn clean package -DskipTests --batch-mode

      - name: Run startup benchmark
        run: |
          cd cloud-infra-gateway/target
          echo "=== 启动时间基准测试 ==="
          START_TIME=$(date +%s%N)
          java -jar cloud-infra-gateway-*.jar --spring.cloud.nacos.config.enabled=false --spring.cloud.nacos.discovery.enabled=false --server.port=18080 > /tmp/gateway-startup.log 2>&1 &
          PID=$!
          
          # 等待健康检查就绪
          for i in $(seq 1 60); do
            if curl -sf http://localhost:18080/actuator/health > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          END_TIME=$(date +%s%N)
          STARTUP_MS=$(( (END_TIME - START_TIME) / 1000000 ))
          echo "STARTUP_MS=${STARTUP_MS}" >> $GITHUB_ENV
          
          # 内存使用
          MEM_KB=$(ps -o rss= -p $PID | tr -d ' ')
          echo "MEM_KB=${MEM_KB}" >> $GITHUB_ENV
          echo "启动时间: ${STARTUP_MS}ms, 内存: ${MEM_KB}KB"
          
          # 清理
          kill $PID 2>/dev/null || true
          wait $PID 2>/dev/null || true

      - name: Compare with baseline
        run: |
          # 基准值: JVM 启动 < 15s, Native < 2s, 内存 < 512MB
          MAX_STARTUP_MS=15000
          MAX_MEM_KB=524288
          
          echo "=== 性能门禁检查 ==="
          echo "启动时间: ${STARTUP_MS}ms (阈值: ${MAX_STARTUP_MS}ms)"
          echo "内存使用: ${MEM_KB}KB (阈值: ${MAX_MEM_KB}KB)"
          
          FAILED=false
          
          if [ "${STARTUP_MS}" -gt "${MAX_STARTUP_MS}" ]; then
            echo "❌ 启动时间超出阈值: ${STARTUP_MS}ms > ${MAX_STARTUP_MS}ms"
            FAILED=true
          else
            echo "✅ 启动时间符合要求"
          fi
          
          if [ "${MEM_KB}" -gt "${MAX_MEM_KB}" ]; then
            echo "❌ 内存使用超出阈值: ${MEM_KB}KB > ${MAX_MEM_KB}KB"
            FAILED=true
          else
            echo "✅ 内存使用符合要求"
          fi
          
          if [ "$FAILED" = true ]; then
            echo "❌ 基准测试门禁未通过"
            exit 1
          fi
          echo "✅ 基准测试门禁通过"

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-gate-report
          path: |
            /tmp/gateway-startup.log
          retention-days: 30

      - name: Comment result on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const startupMs = process.env.STARTUP_MS || 'N/A';
            const memKb = process.env.MEM_KB || 'N/A';
            const body = `## 🏎️ 基准测试门禁结果
            | 指标 | 实测值 | 阈值 | 状态 |
            |------|--------|------|------|
            | 启动时间 | ${startupMs}ms | 15000ms | ${startupMs > 15000 ? '❌' : '✅'} |
            | 内存使用 | ${memKb}KB | 524288KB | ${memKb > 524288 ? '❌' : '✅'} |
            
            *触发方式: 在 PR 上添加 \`benchmark\` 标签*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            })
