spring:
  application:
    name: cloud-auth
  config:
    import: "optional:nacos:auth.yaml"
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_CONFIG_ADDR:${NACOS_ADDR:nacos-service:8848}}
        file-extension: yaml
        shared-configs:
          - data-id: actuator-config.yaml
            refresh: true
        import-check:
          enabled: false
      discovery:
        server-addr: ${NACOS_DISCOVERY_ADDR:${NACOS_ADDR:nacos-service:8848}}

  # JWT 配置
  auth:
    jwt:
      secret: ${AUTH_JWT_SECRET:CloudInfraSecretKey123456789012345678901234567890}
      expire-time: ${AUTH_JWT_EXPIRE_TIME:86400000}
      algorithm: ${AUTH_JWT_ALGORITHM:HS256}
      cache:
        enabled: ${AUTH_JWT_CACHE_ENABLED:true}
        max-size: ${AUTH_JWT_CACHE_MAX_SIZE:10000}
        ttl-seconds: ${AUTH_JWT_CACHE_TTL:300}

# 追踪配置由 management.tracing 与 management.otlp 统一管理

management:
  server:
    port: 9301
  endpoints:
    web:
      base-path: /management
      exposure:
        include: "*"
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://otel-collector:4317