spring:
  application:
    name: cloud-auth
  autoconfigure:
    exclude:
      # resilience4j 的 RefreshScoped 注册表依赖 RefreshScope，AOT (process-aot)
      # 无法为其生成代码（UnsupportedTypeValueCodeGenerationException）。
      # auth 未使用 resilience4j 注解，安全排除。
      - io.github.resilience4j.springboot.bulkhead.autoconfigure.BulkheadRefreshScopedRegistryAutoConfiguration
      - io.github.resilience4j.springboot.circuitbreaker.autoconfigure.CircuitBreakerRefreshScopedRegistryAutoConfiguration
      - io.github.resilience4j.springboot.ratelimiter.autoconfigure.RateLimiterRefreshScopedRegistryAutoConfiguration
      - io.github.resilience4j.springboot.retry.autoconfigure.RetryRefreshScopedRegistryAutoConfiguration
      - io.github.resilience4j.springboot.timelimiter.autoconfigure.TimeLimiterRefreshScopedRegistryAutoConfiguration
      # RefreshScope 提供者：禁用后 resilience4j 的 @ConditionalOnBean(RefreshScope)
      # 配置全部不满足，从根源避免 AOT 代码生成失败
      - org.springframework.cloud.autoconfigure.RefreshAutoConfiguration
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_CONFIG_ADDR:${NACOS_ADDR:cloud-nacos:8848}}
        file-extension: yaml
        import-check:
          enabled: false
      discovery:
        server-addr: ${NACOS_DISCOVERY_ADDR:${NACOS_ADDR:cloud-nacos:8848}}
  config:
    import:
      - optional:nacos:actuator-config.yaml


# JWT 配置（本地直启兜底；生产必须通过 AUTH_JWT_SECRET 注入外置强密钥）
auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:}
    expire-time: ${AUTH_JWT_EXPIRE_TIME:86400000}
    algorithm: ${AUTH_JWT_ALGORITHM:HS256}
    cache:
      enabled: ${AUTH_JWT_CACHE_ENABLED:true}
      max-size: ${AUTH_JWT_CACHE_MAX_SIZE:10000}
      ttl-seconds: ${AUTH_JWT_CACHE_TTL:300}


# 追踪配置由 management.tracing 与 management.otlp 统一管理

management:
  server:
    port: 9301
  endpoints:
    web:
      base-path: /management
      exposure:
        include: health,info,prometheus,metrics,env,beans,conditions,refresh
  tracing:
    sampling:
      # 2026-11-05 perf audit P0: 全量采样 1.0 -> 0.2（建议值），压 CPU/吞吐
      probability: 0.2
# MyBatis-Plus：native 下必须显式指定日志实现，避免运行时反射选型 NPE；
# 禁用延迟加载，避免 Javassist 字节码代理在 native 下不可用
mybatis-plus:
  global-config:
    banner: false
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    lazy-loading-enabled: false
    aggressive-lazy-loading: false
