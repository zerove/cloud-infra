server:
  port: 9200
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: cloud-auth
  datasource:
    type: org.postgresql.ds.PGSimpleDataSource
    url: jdbc:postgresql://mysql-server:3306/cloud_infra
    username: root
    password: root
  data:
    redis:
      host: redis-server
      port: 6379
      database: 0
  cloud:
    nacos:
      discovery:
        server-addr: nacos:8848
        enabled: true
      config:
        server-addr: nacos:8848
        enabled: true

management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
